      { t: "where", h: "Interest expense sits low on the <strong>income statement</strong>, after operating profit (lesson 1450). The loan balance is a liability on the <strong>balance sheet</strong>. Drawdowns and repayments of principal appear only in the <strong>cash flow statement</strong>, under financing (lesson 1540)." },
      { t: "mcq", q: "In FY25 the café pays the bank " + R(110000) + " in total (" + R(60000) + " interest + " + R(50000) + " principal). How much of that reduces FY25 profit?", opts: [R(110000), R(60000), R(50000), "Nothing — loan payments never touch profit"], correct: 1, why: ["Only part of the payment is a cost of doing business. The principal portion is returning borrowed money — the café's obligation shrinks by exactly what it pays, so nothing is consumed.", "Only the interest — the price of using the bank's money for the year — is an expense. The " + R(50000) + " principal repayment swaps cash for a smaller debt: assets down, liabilities down, equity untouched. Lenders read this split closely: a business can afford its interest and still choke on principal repayments.", "That's the principal — the part that is <em>not</em> an expense.", "Interest genuinely is an expense — money paid for a service (the use of capital) that's fully consumed each year."] }
    ]
  };

  LS.lessons["1230-right-hand-side"] = {
    id: "1230-right-hand-side", code: "1230", minutes: 4,
    title: "Assembling the right-hand side",

    lede: "You now know every claim on the café: suppliers, employees, the bank, and Priya herself. Before building the full balance sheet, sort them — because the balance sheet is exactly this sorting, done neatly.",
    body: [

          { text: "Bank term loan, " + R(C.fy25.bs.loan), bucket: "Non-current liability", why: "Repayable over several years (we keep it whole; see the 1220 note about current maturities)." },
          { text: "Priya's share capital, " + R(C.fy25.bs.capital), bucket: "Equity", why: "The owner's stake — never 'due'. It's what remains after all liabilities.", whyNot: { "Non-current liability": "Tempting — it does look long-term. But the café owes Priya nothing on fixed terms; she gets whatever is left after real creditors. No due date, no fixed amount → equity, not a liability." } },
          { text: "Retained earnings, " + R(C.fy25.bs.retained), bucket: "Equity", why: "Profits kept in the business belong to the owner — equity's second component, built next lesson." }
        ]
      },
      {

          title: "Total what outsiders are owed, 31 Mar 2025",

      { t: "where", h: "On a <strong>Schedule III balance sheet</strong> (the Indian statutory format) these appear as: Equity, then Non-current liabilities, then Current liabilities — the whole right-hand side ordered from most patient money to most urgent. The capstone in 1330 assembles it." },
      { t: "mcq", q: "Why is equity listed with liabilities on the same side of the balance sheet?", opts: ["To make the sheet balance by force", "Both are claims on the assets — they differ in who claims and in what order", "Equity is just a special loan from the owner", "Historical accident"], correct: 1, why: ["The sheet balances by arithmetic, not by force — equity is <em>defined</em> as the residual.", "The left side lists what the business has; the right side lists who has a claim on it. Creditors claim fixed amounts first; the owner claims everything that's left, last. Same side, opposite personalities — and that ranking (debt before equity) is exactly why lenders and owners analyse companies so differently (module 1600).", "A loan has a fixed amount and a due date; equity has neither. The difference is fundamental, not cosmetic.", "The layout encodes real seniority of claims — it's information, not accident."] }

<script>

/* Module 1300 — Equity & the balance sheet (capstone: the sheet must tie) */
(function () {

  LS.lessons["1310-share-capital"] = {
    id: "1310-share-capital", code: "1310", minutes: 3,
    title: "Share capital",
    short: "Share capital",
    desc: "The owner's paid-in stake: shares, face value, and why share capital stays frozen while the business grows.",
    lede: "Equity has two components with very different personalities. Share capital is the money owners put in — it barely ever moves. Retained earnings is the money the business made and kept — it moves every single year. This lesson: the frozen half.",

      { t: "def", term: "Share capital", h: "The amount owners have <strong>paid into</strong> the company in exchange for shares. It records historical contribution, not current value — a company worth crores can have tiny share capital." },

      { t: "formula", title: "Share capital", lines: ["Share capital = Number of shares × Face value per share"], note: "If investors pay more than face value, the excess is recorded separately as securities premium — not needed for our café, where Priya paid exactly face value." },
      { t: "example", h: "<p>Bombay Bean Coffee Co. issued <strong>1,00,000 shares of ₹10 each</strong> to Priya on day one, all fully paid: share capital " + R(C.fy25.bs.capital) + ". Two profitable years later it is <em>still</em> " + R(C.fy25.bs.capital) + " — profits grow retained earnings (next lesson), never share capital.</p>" },
      {
        t: "sheet",
        sheet: {
          id: "s1",
          title: "The café's share capital",
          hint: "Multiply shares by face value. (Cell references, not retyped numbers.)",
          grid: [
            ["", { v: "Since 1 Apr 2023", year: true }],
            ["Shares issued", { v: 100000, fmt: "plain" }],
            ["Face value per share", { v: 10, fmt: "plain" }],
            ["Share capital", { input: true, mf: true, fmt: "inr", ph: "=B2*B3" }]
          ],
          checks: [
            { cell: "B4", expect: 1000000, message: "B4: shares × face value", mustFormula: true }
          ],
          success: "Share capital " + R(1000000) + " — set on day one, untouched since. All the action in equity happens in the other component."

      { t: "mcq", q: "After two profitable years, the café's share capital is still exactly " + R(1000000) + ". Why?", opts: ["An accounting error nobody caught", "Profits are recorded in retained earnings, not share capital", "It's adjusted for inflation only every five years", "Priya withdrew her profits as salary"], correct: 1, why: ["No error — this is by design. Each equity line answers a different question.", "Share capital answers \"what did owners pay in?\" Retained earnings answers \"what has the business earned and kept?\" Keeping them separate lets a reader instantly split a company's equity into money invested vs money self-generated — a fast quality signal about the business.", "Indian books are kept at historical cost; no inflation indexing of share capital.", "Whether profits are paid out or kept, share capital is untouched — payouts come from retained earnings."] }

      },
      { t: "where", h: "Retained earnings is the second line of <strong>equity on the balance sheet</strong>. Its yearly increase is explained by the <strong>income statement</strong> (PAT) and the dividend, which is a financing outflow on the <strong>cash flow statement</strong> — one line touching all three statements." },
      { t: "mcq", q: "The café's retained earnings are " + R(250000) + ", but its cash is only " + R(100000) + ". Is something wrong?", opts: ["Yes — retained earnings should equal cash", "No — retained earnings is a claim; the matching value is spread across many assets", "Yes — someone has taken the missing " + R(150000), "No — but only because of a timing difference that will fix itself"], correct: 1, why: ["This is the most common misreading of a balance sheet. Retained earnings lives on the claims side — it doesn't point at any particular asset.", "Retained profit was reinvested: some became the second espresso machine, some sits in inventory and receivables, some repaid the loan. Retained earnings says \"the owner's claim grew " + R(250000) + " through profits\"; it never promised that growth would stay in the bank. Companies with enormous retained earnings and thin cash are completely normal.", "Nothing is missing — the profit was deliberately put to work in assets that earn more than a bank account.", "It's not a timing quirk that reverses; reinvestment is permanent strategy. The claim and the cash simply measure different things."] }
    ]
  };

  LS.lessons["1330-balance-sheet"] = {
    id: "1330-balance-sheet", code: "1330", minutes: 6,
    title: "Capstone: build the balance sheet",
    short: "★ The balance sheet",
    desc: "Assemble Bombay Bean's full FY25 balance sheet and make it tie: total assets = total liabilities + equity = ₹19,50,000.",
    lede: "Everything you've built — PP&E, inventory, receivables, cash, payables, the loan, share capital, retained earnings — assembles into one statement now. The tie meter at the bottom is watching: assets must equal liabilities plus equity, to the rupee.",
    share: true,
    body: [
      { t: "p", h: "A balance sheet that ties isn't a formality — it's proof that every transaction was recorded with both its sides. Yours will tie at <strong>" + R(1950000) + "</strong> if each piece you built in modules 1100–1300 is wired in correctly. If it doesn't tie, the <em>size</em> of the difference is your first debugging clue." },
      { t: "formula", title: "What you're assembling", lines: ["Total assets = PP&E (net) + deposit + inventory + receivables + cash", "Total equity & liabilities = share capital + retained earnings", "&nbsp;&nbsp;+ term loan + payables + salaries payable", "<b>Tie:</b> Total assets − Total equity & liabilities = 0"], note: "Presented assets-first here for building intuition. India's statutory Schedule III format lists Equity & Liabilities first — same numbers, opposite order; see the Reference section." },
      { t: "example", h: "<p>It's 31 March 2025, closing time. Gross PP&E stands at " + R(C.fy25.bs.ppeGross) + " (the " + R(1600000) + " day-one register plus the FY25 " + R(240000) + " addition), and accumulated depreciation is " + R(C.fy25.bs.accDep) + " (two years' charges: " + R(200000) + " + " + R(240000) + "). The rest you know: every line below is one you've already computed somewhere in this course.</p>" },
      {
        t: "sheet",
        sheet: {
          id: "s1",
          title: "Bombay Bean Coffee Co. — Balance sheet as at 31 March 2025",
          hint: "Five formulas to write: net PP&E (B5), total assets (B10, use SUM), retained earnings (B13 — the 1320 roll-forward: opening " + R(120000) + " + PAT " + R(180000) + " − dividend " + R(50000) + "), total equity & liabilities (B17, use SUM). Watch the tie meter as you go.",
          grid: [
            ["", { v: "31 Mar 2025", year: true }],
            ["ASSETS", null],
            ["Gross PP&E (at cost)", C.fy25.bs.ppeGross],
            ["Less: accumulated depreciation", -C.fy25.bs.accDep],
            ["PP&E, net", { input: true, mf: true, fmt: "inr", ph: "=B3+B4" }],
            ["Security deposit", C.fy25.bs.deposit],
            ["Inventory", C.fy25.bs.inventory],
            ["Trade receivables", C.fy25.bs.receivables],
            ["Cash at bank", C.fy25.bs.cash],
            ["TOTAL ASSETS", { input: true, mf: true, fmt: "inr", ph: "=SUM(B5:B9)" }],
            ["EQUITY & LIABILITIES", null],
            ["Share capital", C.fy25.bs.capital],
            ["Retained earnings", { input: true, mf: true, fmt: "inr", ph: "=opening+PAT−dividend" }],
            ["Term loan", C.fy25.bs.loan],
            ["Trade payables", C.fy25.bs.payables],
            ["Salaries payable", C.fy25.bs.accrued],
            ["TOTAL EQUITY & LIABILITIES", { input: true, mf: true, fmt: "inr", ph: "=SUM(B12:B16)" }]
          ],
          checks: [
            { cell: "B5", expect: 1400000, message: "B5: net PP&E = gross − accumulated depreciation", mustFormula: true },
            { cell: "B10", expect: 1950000, message: "B10: total assets via SUM(B5:B9)", mustFormula: true, mustUse: "SUM", mustUseLabel: "SUM over B5:B9" },
            { cell: "B13", expect: 250000, message: "B13: retained earnings via the roll-forward", mustFormula: true },
            { cell: "B17", expect: 1950000, message: "B17: total equity & liabilities via SUM(B12:B16)", mustFormula: true, mustUse: "SUM", mustUseLabel: "SUM over B12:B16" },
            {
              custom: function (s) {
                var a = s.value("B10"), l = s.value("B17");
                return (typeof a === "number" && typeof l === "number" && a === l && a === 1950000) ? true : "The two totals must both equal " + R(1950000) + ".";
              },
              message: "The sheet ties: total assets = total equity & liabilities"
            }
          ],
          tie: { a: "B10", le: "B17", aLabel: "Total assets", leLabel: "Total equity & liabilities" },
          success: "TOTAL ASSETS = TOTAL EQUITY & LIABILITIES = " + R(1950000) + ". Your balance sheet ties. That green zero is the sound of every lesson so far agreeing with every other."
        }
      },
      { t: "where", h: "This statement <em>is</em> the destination — but two of its numbers arrived unexplained: PAT of " + R(180000) + " inside retained earnings, and cash of " + R(100000) + ". The next two modules build the statements that explain them: the income statement (1400) and the cash flow statement (1500)." },
      { t: "mcq", q: "Your first attempt doesn't tie: assets exceed equity & liabilities by exactly " + R(180000) + ". What did you most likely forget?", opts: ["Depreciation on the PP&E line", "Adding FY25 profit into retained earnings", "The security deposit", "The salaries payable"], correct: 1, why: ["Missing depreciation would make assets too <em>high</em> by " + R(440000) + " — the wrong amount. In tie-debugging, the size of the gap identifies the suspect.", "A gap of exactly PAT (" + R(180000) + ") is the classic signature of an unrolled retained earnings line: the profit's assets all arrived (cash, receivables, machines…) but the matching claim never got recorded. Professional modelers memorise this diagnostic — gap = PAT means check the RE bridge first. You'll use it again in lesson 2130.", "The deposit is " + R(100000) + " — the wrong size, and forgetting an asset would make assets too <em>low</em>.", "That's " + R(30000) + ", and missing a liability would push the gap the same direction but the wrong amount."] }
    ]
  };
})();

<script>
/* js/lessons/m1400.js */
/* Module 1400 — The income statement */
(function () {
  "use strict";
  var LS = (window.LS = window.LS || {});
  LS.lessons = LS.lessons || {};
  var C = LS.C, R = LS.fmt.inr, P = LS.fmt.pct;
  var p = C.fy25.pl, p24 = C.fy24.pl;

  LS.lessons["1410-revenue"] = {
    id: "1410-revenue", code: "1410", minutes: 4,
    title: "Revenue: recognized ≠ collected",
    short: "Revenue",
    desc: "When a sale becomes revenue, why cash timing is irrelevant to it, and how the café's ₹24,00,000 splits between counter and catering.",
    lede: "Revenue is the top line, and the most misread number in finance. It does not mean \"money received\". It means \"value delivered\". Get this one distinction right and half of the cash flow module becomes obvious.",
    body: [
      { t: "def", term: "Revenue", h: "The value of goods or services <strong>delivered</strong> to customers during the period, whether or not they've paid. Also called turnover, sales, or the top line — it's the first line of the income statement." },
      { t: "def", term: "Revenue recognition", h: "Revenue is recorded when the business has <strong>done its job</strong> — handed over the coffee, finished the catering. Cash arriving earlier (an advance) or later (credit) doesn't change <em>when</em> revenue is recognized, only which balance-sheet line holds the difference." },
      { t: "formula", title: "Three timings, one revenue", lines: [
        "Cash sale:      deliver &amp; collect together → revenue, cash ↑",
        "Credit sale:    deliver now, collect later  → revenue, <b>receivable ↑</b>",
        "Advance:        collect now, deliver later  → <b>no revenue yet</b>, liability ↑"
      ], note: "Only the middle case creates a receivable; only the last delays revenue. The delivery date, not the bank statement, drives the top line." },
      { t: "example", h: "<p>FY25 revenue of <strong>" + R(p.revenue) + "</strong> comes from two streams: the counter (walk-in coffee, paid instantly) and corporate catering (invoiced on 30-day terms — the " + R(600000) + " you met in lesson 1140). Both are revenue the moment the coffee is handed over.</p>" },
      {
        t: "sheet",
        sheet: {
          id: "s1",
          title: "FY25 revenue, and how much of it was actually collected",
          hint: "Total revenue in B4 with SUM. Then in B7: cash collected = counter sales (all cash) + catering collections. You worked out catering collections in lesson 1140 using the roll-forward — opening receivables + invoices − closing.",
          grid: [
            ["", { v: "FY25", year: true }],
            ["Counter sales (cash)", p.revenue - 600000],
            ["Catering sales (invoiced)", 600000],
            ["Total revenue", { input: true, mf: true, fmt: "inr", ph: "=SUM(B2:B3)" }],
            ["Opening receivables", C.fy24.bs.receivables],
            ["Closing receivables", C.fy25.bs.receivables],
            ["Cash actually collected", { input: true, mf: true, fmt: "inr", ph: "=…" }],
            ["Revenue not yet in the bank", { input: true, mf: true, fmt: "inr", ph: "=B4-B7" }]
          ],
          checks: [
            { cell: "B4", expect: 2400000, message: "B4: total revenue via SUM", mustFormula: true, mustUse: "SUM", mustUseLabel: "the SUM function" },
            { cell: "B7", expect: 2360000, message: "B7: cash collected = counter + (opening AR + catering invoices − closing AR)", mustFormula: true },
            { cell: "B8", expect: 40000, message: "B8: the gap between revenue and cash", mustFormula: true }
          ],
          success: "Revenue " + R(p.revenue) + ", cash collected " + R(2360000) + ". The " + R(40000) + " gap is exactly the growth in receivables — and exactly what the cash flow statement will subtract in lesson 1520."
        }
      },
      { t: "where", h: "Revenue is the first line of the <strong>income statement</strong>. Anything invoiced but uncollected sits in receivables on the <strong>balance sheet</strong>. The change in receivables is a working-capital adjustment on the <strong>cash flow statement</strong>." },
      { t: "mcq", q: "On 20 March, Nimbus Tech pays the café ₹90,000 upfront for an April conference. How much FY25 revenue (year ends 31 March) does this create?", opts: ["₹90,000 — the cash is in the bank", "₹90,000 — the contract is signed", "Nothing — the coffee hasn't been served", "₹7,500 — one month's worth"], correct: 2, why: ["Cash in the bank is not the test. If it were, any company could inflate this year's revenue by asking customers to prepay.", "Signing isn't delivering either. A contract creates an obligation, not revenue.", "The café has done nothing yet, so it has earned nothing. The ₹90,000 sits as a liability (deferred revenue) — the café owes coffee or a refund. It becomes FY26 revenue in April, when the conference is served. Cash up, revenue flat: the exact opposite of a credit sale, where revenue is up and cash is flat.", "Time-apportioning suits a rental or subscription that's delivered continuously. A one-day conference is delivered on the day it happens — all in April."] }
    ]
  };

  LS.lessons["1420-cogs"] = {
    id: "1420-cogs", code: "1420", minutes: 4,
    title: "COGS and gross profit",
    short: "COGS & gross profit",
    desc: "Direct costs, gross profit and gross margin — the first profit line, and what it tells you about pricing power.",
    lede: "Subtract the cost of the beans from the price of the coffee and you have gross profit — the money left to pay for everything else. It's the first and most diagnostic subtotal on the income statement.",
    body: [
      { t: "def", term: "Cost of goods sold (COGS)", h: "The <strong>direct</strong> cost of what was sold — beans, milk, cups, pastry. It moves up and down with sales volume. Rent doesn't; rent is an operating expense (next lesson)." },
      { t: "def", term: "Gross profit & gross margin", h: "<strong>Gross profit</strong> = revenue − COGS: what's left after paying for the product itself. <strong>Gross margin</strong> is that as a percentage of revenue — the cleanest single read on pricing power." },
      { t: "formula", title: "The first subtotal", lines: [
        "Gross profit = Revenue − COGS",
        "Gross margin % = Gross profit ÷ Revenue",
        "Café FY25: " + R(p.revenue) + " − " + R(p.cogs) + " = <b>" + R(p.grossProfit) + "</b> (" + P(C.ratios.gmPct) + ")"
      ], note: "The direct/indirect line can be judgment. A barista's wage is arguably direct, but because staffing is fixed week to week the café — like most cafés — reports it as an operating expense. Be consistent, and read others' definitions before comparing." },
      { t: "example", h: "<p>The café consumed " + R(p.cogs) + " of beans, milk and pastry (lesson 1130) to deliver " + R(p.revenue) + " of coffee. A 65% gross margin is normal for a café: the physical inputs of a latte are cheap; the rent and the barista are what actually cost money.</p>" },
      {
        t: "sheet",
        sheet: {
          id: "s1",
          title: "Gross profit and margin, FY24 vs FY25",
          hint: "Two columns — FY24 and FY25. Build B4 first, then use the 'Copy formula right →' button to push it into C4: that's exactly what fill-right does in Excel. Do the same for the margin row (format it as a percentage by dividing — the cell is already set to show %).",
          grid: [
            ["", { v: "FY24", year: true }, { v: "FY25", year: true }],
            ["Revenue", p24.revenue, p.revenue],
            ["Cost of goods sold", p24.cogs, p.cogs],
            ["Gross profit", { input: true, mf: true, fmt: "inr", ph: "=B2-B3" }, { input: true, mf: true, fmt: "inr" }],
            ["Gross margin", { input: true, mf: true, fmt: "pct", ph: "=B4/B2" }, { input: true, mf: true, fmt: "pct" }]
          ],
          checks: [
            { cell: "B4", expect: 1300000, message: "B4: FY24 gross profit", mustFormula: true },
            { cell: "C4", expect: 1560000, message: "C4: FY25 gross profit", mustFormula: true },
            { cell: "B5", expect: 0.65, message: "B5: FY24 gross margin", mustFormula: true, tol: 0.001 },
            { cell: "C5", expect: 0.65, message: "C5: FY25 gross margin", mustFormula: true, tol: 0.001 }
          ],
          success: "Gross profit grew from " + R(1300000) + " to " + R(1560000) + " — but margin held at exactly 65%. Growth came from selling more coffee, not from charging more per cup."
        }
      },
      { t: "where", h: "Gross profit is the first subtotal on the <strong>income statement</strong>. It has no balance-sheet line of its own — but the inventory it consumed came off the <strong>balance sheet</strong>, and the margin it reveals is the first ratio you'll compute in lesson 1610." },
      { t: "mcq", q: "The café's gross margin falls from 65% to 58% while revenue grows. The most likely cause is…", opts: ["Rent went up", "Bean prices rose and the café didn't raise cup prices", "It bought a second espresso machine", "It repaid part of the loan"], correct: 1, why: ["Rent is an operating expense, below the gross profit line — it can't touch gross margin. That's precisely why the subtotal is useful: it isolates product economics from overheads.", "Gross margin only moves when the relationship between selling price and direct cost changes. Costlier beans absorbed rather than passed on is the textbook cause — and a warning sign, because it means the café lacks the pricing power to defend its margin.", "A machine is capex; it reaches the P&L as depreciation, far below gross profit.", "Loan repayments never touch the income statement at all (lesson 1220), let alone gross margin."] }
    ]
  };

  LS.lessons["1430-opex-ebitda"] = {
    id: "1430-opex-ebitda", code: "1430", minutes: 5,
    title: "Operating expenses & EBITDA",
    short: "Opex & EBITDA",
    desc: "Build revenue down to EBITDA, and understand what that much-quoted acronym does and doesn't measure.",
    lede: "Below gross profit sit the costs of simply being open: rent, salaries, power, marketing. Subtract them and you reach EBITDA — the number investors quote most and misunderstand most.",
    body: [
      { t: "def", term: "Operating expenses (opex)", h: "The costs of running the business that aren't direct product costs — rent, salaries, utilities, marketing. Largely <strong>fixed</strong>: the rent is the same whether you sell 100 cups or 1,000. Fixed costs are why growth improves margins." },
      { t: "def", term: "EBITDA", h: "<strong>E</strong>arnings <strong>B</strong>efore <strong>I</strong>nterest, <strong>T</strong>ax, <strong>D</strong>epreciation and <strong>A</strong>mortisation. Profit from operating the business, before financing choices (interest), government (tax) and past investment decisions (depreciation)." },
      { t: "formula", title: "Down to EBITDA", lines: [
        "Revenue − COGS = Gross profit",
        "Gross profit − Operating expenses = <b>EBITDA</b>",
        "Café FY25: " + R(p.grossProfit) + " − " + R(p.opex) + " = <b>" + R(p.ebitda) + "</b>"
      ], note: "EBITDA is popular because it compares two businesses' operations without their debt or tax situations getting in the way. Its danger: it ignores that machines wear out and must be replaced. EBITDA is not cash flow — module 1500 shows why." },
      { t: "example", h: "<p>The café's FY25 overheads: rent " + R(p.rent) + " (unchanged — a five-year lease), salaries " + R(p.salaries) + " (up, a third barista was hired), utilities " + R(p.utilities) + ", and marketing " + R(p.marketing) + ". Total " + R(p.opex) + ".</p>" },
      {
        t: "sheet",
        sheet: {
          id: "s1",
          title: "Revenue → EBITDA, FY25",
          hint: "Four formulas: gross profit (B4), total opex (B9, use SUM over the four cost rows), EBITDA (B10), and the EBITDA margin (B11).",
          grid: [
            ["", { v: "FY25", year: true }],
            ["Revenue", p.revenue],
            ["Cost of goods sold", -p.cogs],
            ["Gross profit", { input: true, mf: true, fmt: "inr", ph: "=B2+B3" }],
            ["Rent", -p.rent],
            ["Salaries & wages", -p.salaries],
            ["Utilities", -p.utilities],
            ["Marketing", -p.marketing],
            ["Total operating expenses", { input: true, mf: true, fmt: "inr", ph: "=SUM(B5:B8)" }],
            ["EBITDA", { input: true, mf: true, fmt: "inr", ph: "=B4+B9" }],
            ["EBITDA margin", { input: true, mf: true, fmt: "pct", ph: "=B10/B2" }]
          ],
          checks: [
            { cell: "B4", expect: 1560000, message: "B4: gross profit", mustFormula: true },
            { cell: "B9", expect: -1020000, message: "B9: total operating expenses via SUM", mustFormula: true, mustUse: "SUM", mustUseLabel: "the SUM function" },
            { cell: "B10", expect: 540000, message: "B10: EBITDA", mustFormula: true },
            { cell: "B11", expect: 0.225, message: "B11: EBITDA margin", mustFormula: true, tol: 0.001 }
          ],
          success: "EBITDA " + R(p.ebitda) + ", a " + P(C.ratios.ebitdaPct) + " margin. Costs are entered as negatives here so every subtotal is a straight SUM — a modeling convention worth adopting."
        }
      },
      { t: "note", h: "<strong>Sign convention:</strong> this sheet enters costs as negative numbers and adds them. Real published statements print costs as positives and subtract. Both are fine — but inside a model, all-negative-costs-and-SUM means fewer sign errors. Pick one and never mix." },
      { t: "where", h: "EBITDA is a subtotal on the <strong>income statement</strong> (though Indian statutory formats don't print it as a named line — analysts compute it). It's the starting point for valuation multiples and the closest P&L line to operating cash flow, which module 1500 builds properly." },
      { t: "mcq", q: "Two cafés both report EBITDA of ₹5,00,000. Café A owns its equipment outright; Café B leases everything and has a large loan. Which is more profitable?", opts: ["They're identical — EBITDA says so", "Café A, almost certainly", "Café B, almost certainly", "EBITDA alone can't tell you"], correct: 3, why: ["Identical EBITDA is exactly where the number stops being informative. It was designed to strip out the differences that matter here.", "A is a reasonable guess — no interest, and owned assets — but you're inferring below-EBITDA facts EBITDA deliberately excludes. You'd need the full P&L to say.", "B's lease costs sit in opex (so already inside EBITDA), but its interest doesn't. Guessing B is riskier still.", "That's the honest answer, and the lesson. EBITDA excludes interest (B pays a lot, A none) and depreciation (A's owned machines wear out; B's don't appear). Same EBITDA, potentially very different profit after tax — which is why this module keeps going down to PAT."] }
    ]
  };

  LS.lessons["1440-depreciation-pl"] = {
    id: "1440-depreciation-pl", code: "1440", minutes: 4,
    title: "Depreciation on the P&L",
    short: "Depreciation & EBIT",
    desc: "Take the depreciation schedule from lesson 1120 onto the income statement to reach EBIT — operating profit.",
    lede: "Now the van schedule you built in lesson 1120 comes back. Subtract depreciation from EBITDA and you get EBIT — the last line before financing and government take their cuts.",
    body: [
      { t: "def", term: "EBIT (operating profit)", h: "<strong>E</strong>arnings <strong>B</strong>efore <strong>I</strong>nterest and <strong>T</strong>ax. EBITDA minus depreciation — profit after recognising that assets wear out, but before how the business is financed. Also called operating profit." },
      { t: "formula", title: "EBITDA to EBIT", lines: [
        "EBIT = EBITDA − Depreciation &amp; amortisation",
        "Café FY25: " + R(p.ebitda) + " − " + R(p.dep) + " = <b>" + R(p.ebit) + "</b>"
      ], note: "Amortisation is the same idea applied to intangible assets (software, a licence). The café has none, so its D&A is pure depreciation." },
      { t: "example", h: "<p>FY25 depreciation comes straight from the asset register: the fit-out (" + R(60000) + "), the original machine (" + R(60000) + "), the van (" + R(80000) + " — your lesson 1120 schedule), plus a first full year on the " + R(240000) + " of FY25 additions over 6 years (" + R(40000) + "). Total " + R(p.dep) + ", up from " + R(p24.dep) + " in FY24 because of that new equipment.</p>" },
      {
        t: "sheet",
        sheet: {
          id: "s1",
          title: "The FY25 depreciation charge, and EBIT",
          hint: "Each asset's annual charge is cost ÷ life — build all four with formulas (B2/C2 style). Total them in D6, then take EBITDA down to EBIT in D9.",
          grid: [
            ["Asset", "Cost", "Life (years)", "Annual depreciation"],
            ["Café fit-out & furniture", 600000, { v: 10, fmt: "plain" }, { input: true, mf: true, fmt: "inr", ph: "=B2/C2" }],
            ["Espresso machine & kitchen", 600000, { v: 10, fmt: "plain" }, { input: true, mf: true, fmt: "inr" }],
            ["Delivery van", 400000, { v: 5, fmt: "plain" }, { input: true, mf: true, fmt: "inr" }],
            ["FY25 additions", 240000, { v: 6, fmt: "plain" }, { input: true, mf: true, fmt: "inr" }],
            ["Total FY25 depreciation", null, null, { input: true, mf: true, fmt: "inr", ph: "=SUM(D2:D5)" }],
            [null, null, null, null],
            ["EBITDA (from lesson 1430)", null, null, p.ebitda],
            ["EBIT", null, null, { input: true, mf: true, fmt: "inr", ph: "=D8-D6" }]
          ],
          checks: [
            { cell: "D2", expect: 60000, message: "D2: fit-out depreciation (cost ÷ life)", mustFormula: true },
            { cell: "D3", expect: 60000, message: "D3: espresso machine depreciation", mustFormula: true },
            { cell: "D4", expect: 80000, message: "D4: van depreciation — matches your 1120 schedule", mustFormula: true },
            { cell: "D5", expect: 40000, message: "D5: FY25 additions depreciation", mustFormula: true },
            { cell: "D6", expect: 240000, message: "D6: total depreciation via SUM", mustFormula: true, mustUse: "SUM", mustUseLabel: "the SUM function" },
            { cell: "D9", expect: 300000, message: "D9: EBIT = EBITDA − depreciation", mustFormula: true }
          ],
          success: "Depreciation " + R(p.dep) + " → EBIT " + R(p.ebit) + ". Every rupee of that charge was traced to a specific asset — that's how a real schedule is built, and it's why your balance sheet's accumulated depreciation will tie."
        }
      },
      { t: "where", h: "The charge is an expense on the <strong>income statement</strong>. The same number increases accumulated depreciation on the <strong>balance sheet</strong> (reducing net PP&E), and gets added back on the <strong>cash flow statement</strong> because no cash moved. One number, three statements — that's bridge #2 of module 2100." },
      { t: "mcq", q: "The café's EBITDA is ₹5,40,000 and EBIT is ₹3,00,000. A friend says \"so it really made ₹5,40,000, the depreciation is just an accounting entry.\" What's wrong with that?", opts: ["Nothing — depreciation isn't cash", "The equipment genuinely wears out and will need replacing with real cash", "Depreciation is a tax, not an expense", "EBITDA is always the wrong number to use"], correct: 1, why: ["It's true that no cash moved this year — but that's a statement about timing, not about whether the cost is real.", "The van really does lose a fifth of its life every year, and in FY29 the café will write a real cheque to replace it. Depreciation is the honest annual cost of that; ignoring it flatters any asset-heavy business. Note the café's steady-state capex (₹2,40,000/yr) happens to equal its depreciation — which is what you'd expect for a business just maintaining itself.", "Depreciation is an expense; it reduces taxable profit but is not itself a tax.", "EBITDA is useful for comparing operations across different financing structures — it's just not profit, and not cash."] }

  LS.lessons["1450-interest-tax"] = {

    lede: "Two claimants remain: the bank wants interest, the government wants tax. What survives both is profit after tax — the number that flows into retained earnings and belongs to the owner.",
    body: [

      { t: "def", term: "Profit after tax (PAT)", h: "PBT minus tax. The bottom line, also called net profit or net income. The <strong>only</strong> profit number that belongs to the owner — and the one that flows into retained earnings on the balance sheet." },
      { t: "formula", title: "The bottom of the statement", lines: [
        "EBIT − Interest = Profit before tax",
        "Tax = Tax rate × Profit before tax",

      ], note: "We apply a flat 25% to book profit. Real tax is computed on taxable income, which differs from book profit (depreciation rates alone differ) and creates deferred tax — a genuine complication we deliberately skip. Flag it, don't fake it." },
      { t: "example", h: "<p>Interest is " + R(p.interest) + " — 10% of the " + R(C.fy24.bs.loan) + " loan balance the café opened FY25 with (lesson 1220). Tax at 25% of " + R(p.pbt) + " is " + R(p.tax) + ". What's left is <strong>" + R(p.pat) + "</strong> — and you should recognise that number: it's exactly the PAT you rolled into retained earnings back in lesson 1320.</p>" },

      { t: "mcq", q: "The café is considering repaying its whole ₹5,50,000 loan next year. Ignoring everything else, what happens to the P&L?", opts: ["PAT falls by ₹5,50,000", "PAT rises because ₹55,000 of interest disappears — partly offset by more tax", "No change — repayment isn't a P&L item, and neither is interest", "PAT rises by exactly ₹55,000"], correct: 1, why: ["Repaying principal never hits the P&L (lesson 1220) — it's a balance sheet and cash flow event only.", "The repayment itself is invisible to the P&L, but the interest it eliminates is not: ₹55,000 less expense → PBT up ₹55,000 → tax up ₹13,750 at 25% → PAT up ₹41,250. Interest saved is never fully kept, because the taxman takes a share of any profit increase. This is the mirror image of the 'tax shield' on debt.", "The repayment isn't, but interest very much is an expense.", "Close, but it forgets tax. A pre-tax saving of ₹55,000 is worth ₹41,250 after 25% tax."] }

      { t: "where", h: "This statement explains one line of the <strong>balance sheet</strong>: the " + R(p.pat) + " that grew retained earnings. It explains nothing about cash — the café earned " + R(p.pat) + " but its bank balance rose only " + R(C.fy25.cf.net) + ". Module 1500 explains that gap, and it's the last big idea in accounting." },

<script>
/* js/lessons/m1500.js */
/* Module 1500 — The cash flow statement */
(function () {
  "use strict";
  var LS = (window.LS = window.LS || {});
  LS.lessons = LS.lessons || {};

  LS.lessons["1510-profit-not-cash"] = {
    id: "1510-profit-not-cash", code: "1510", minutes: 4,
    title: "Profit is not cash",
    short: "Profit ≠ cash",
    desc: "The four reasons a profitable business can run out of money, with small reconciliations you build yourself.",
    lede: "Profitable businesses go bankrupt. Not occasionally — routinely. It happens when profit and cash drift apart and the owner watches only the profit. This module teaches you to watch both.",
    body: [
      { t: "def", term: "The wedge", h: "Profit and cash differ for four reasons: <strong>(1)</strong> non-cash expenses like depreciation, <strong>(2)</strong> cash tied up in working capital (stock and unpaid invoices), <strong>(3)</strong> cash spent on assets, which never appears as an expense, and <strong>(4)</strong> financing flows — loans and dividends — that profit never sees." },
      { t: "formula", title: "Four ways they diverge", lines: [
        "Depreciation      → expense, <b>no cash out</b>      → cash &gt; profit",
        "Inventory ↑       → cash out, <b>no expense yet</b>  → cash &lt; profit",
        "Receivables ↑     → revenue, <b>no cash in</b>       → cash &lt; profit",
        "Capex / repayment → cash out, <b>never an expense</b> → cash &lt; profit"
      ], note: "Read the middle column: each line is a timing mismatch between when value moves and when cash moves. That's all the cash flow statement ever fixes." },
      { t: "example", h: "<p>In FY25 the café earned " + R(p.pat) + " of profit. Its bank balance rose by " + R(cf.net) + ". A gap of " + R(p.pat - cf.net) + " — bigger than the profit itself. Every rupee of that gap has a name, and by lesson 1550 you'll have accounted for all of them.</p>" },
      {
        t: "sheet",
        sheet: {
          id: "s1",
          title: "Three quick reconciliations",
          hint: "Each row is a separate mini-scenario: start from profit and adjust to cash. Think about which direction each item pushes.",
          grid: [
            ["Scenario", "Profit", "Adjustment", "Cash effect"],
            ["Earned ₹1,00,000, of which ₹2,000 was depreciation", 100000, 2000, { input: true, mf: true, fmt: "inr", ph: "=B2+C2" }],
            ["Earned ₹1,00,000 but receivables rose ₹30,000", 100000, -30000, { input: true, mf: true, fmt: "inr" }],
            ["Earned ₹1,00,000 and spent ₹1,50,000 on a machine", 100000, -150000, { input: true, mf: true, fmt: "inr" }]
          ],
          checks: [
            { cell: "D2", expect: 102000, message: "D2: depreciation added back — cash beats profit", mustFormula: true },
            { cell: "D3", expect: 70000, message: "D3: receivables growth eats cash", mustFormula: true },
            { cell: "D4", expect: -50000, message: "D4: capex — profitable, but cash went backwards", mustFormula: true }
          ],
          success: "Row 4 is the killer: a genuinely profitable month where " + R(50000) + " left the bank. Do that four months running and a profitable business misses payroll."
        }
      },
      { t: "note", h: "This is why fast-growing businesses so often need funding. Growth means buying stock earlier and waiting for customers to pay — both consume cash <em>ahead</em> of the profit they eventually produce. Grow fast enough and you can go broke doing everything right." },
      { t: "where", h: "The <strong>cash flow statement</strong> exists solely to explain this gap. It starts at the income statement's PAT and walks, adjustment by adjustment, to the change in the balance sheet's cash line — stitching all three statements together." },
      { t: "mcq", q: "A café doubles its sales, all on 30-day credit, and stocks up on beans to cope. Profit is at a record high. What is the most likely cash position?", opts: ["Record high too — profit is cash eventually", "Worse than before, possibly badly", "Unchanged — the effects cancel", "Impossible to say without the tax rate"], correct: 1, why: ["Eventually, yes — but businesses pay rent and salaries this month, not eventually. The lag is what kills them.", "Both changes drain cash exactly when profit is booming: the sales are recognised as revenue but sit unpaid in receivables, while the extra beans were paid for upfront. This pattern — record profit, emptying bank account — is the classic overtrading failure. It's why lenders read the cash flow statement before the P&L.", "They don't cancel; they compound. Both are cash <em>outflows</em> relative to profit.", "The tax rate affects the size, not the direction. Growth funded by working capital drains cash at any tax rate."] }
    ]
  };

  LS.lessons["1520-cfo"] = {
    id: "1520-cfo", code: "1520", minutes: 6,
    title: "Cash from operations: the indirect method",
    short: "CFO (indirect)",
    desc: "Start at PAT, add back depreciation, adjust for working capital changes — and arrive at the cash the café's operations actually generated.",
    lede: "The first and most important section of the cash flow statement. It starts at the P&L's bottom line and undoes every timing difference until only cash remains. This is the method essentially every published statement uses.",
    body: [
      { t: "def", term: "Cash from operations (CFO)", h: "Cash generated by the actual business of selling coffee — before investing in assets and before dealing with lenders or owners. The healthiest number on the statement: a business that can't generate positive CFO is being funded by someone else." },
      { t: "def", term: "The indirect method", h: "Rather than listing every receipt and payment, start from profit after tax and <strong>reverse the accruals</strong>: add back non-cash expenses, then adjust for the change in each working-capital balance." },
      { t: "formula", title: "The indirect method, in signs", lines: [
        "Profit after tax",
        "+ Depreciation                    <i>(expense, no cash left)</i>",
        "− Increase in receivables         <i>(revenue, no cash came)</i>",
        "− Increase in inventory           <i>(cash out, no expense yet)</i>",
        "+ Increase in payables            <i>(expense, no cash left yet)</i>",
        "+ Increase in accrued expenses    <i>(same idea)</i>",
        "= <b>Cash from operations</b>"
      ], note: "The rule that never fails: an <b>asset</b> going up consumes cash; a <b>liability</b> going up releases cash. If you remember only one thing from this module, remember that." },
      { t: "example", h: "<p>Every input is one you already know. PAT " + R(p.pat) + " (lesson 1460). Depreciation " + R(p.dep) + " (1440). Receivables rose from " + R(bs24.receivables) + " to " + R(bs.receivables) + "; inventory from " + R(bs24.inventory) + " to " + R(bs.inventory) + "; payables from " + R(bs24.payables) + " to " + R(bs.payables) + "; accrued salaries from " + R(bs24.accrued) + " to " + R(bs.accrued) + ".</p>" },
      {
        t: "sheet",
        sheet: {
          id: "s1",
          title: "FY25 cash from operations",
          hint: "Column D is the adjustment. For each working-capital line, compute closing − opening in column D and then think about the sign: for assets the cash effect is the negative of the change; for liabilities it's the change itself. Build D4:D7 as formulas from B and C, then total the cash column in D9.",
          grid: [
            ["", "Opening", "Closing", "Cash effect"],
            ["Profit after tax", null, null, p.pat],
            ["Add back: depreciation", null, null, { input: true, mf: true, fmt: "inr", ph: "=240000" }],
            ["Trade receivables", bs24.receivables, bs.receivables, { input: true, mf: true, fmt: "inr", ph: "=B4-C4" }],
            ["Inventory", bs24.inventory, bs.inventory, { input: true, mf: true, fmt: "inr" }],
            ["Trade payables", bs24.payables, bs.payables, { input: true, mf: true, fmt: "inr", ph: "=C6-B6" }],
            ["Accrued salaries", bs24.accrued, bs.accrued, { input: true, mf: true, fmt: "inr" }],
            [null, null, null, null],
            ["CASH FROM OPERATIONS", null, null, { input: true, mf: true, fmt: "inr", ph: "=SUM(D2:D7)" }]
          ],
          checks: [
            { cell: "D3", expect: 240000, message: "D3: depreciation added back", mustFormula: true },
            { cell: "D4", expect: -40000, message: "D4: receivables grew — a cash outflow", mustFormula: true },
            { cell: "D5", expect: -30000, message: "D5: inventory grew — a cash outflow", mustFormula: true },
            { cell: "D6", expect: 20000, message: "D6: payables grew — a cash inflow", mustFormula: true },
            { cell: "D7", expect: 10000, message: "D7: accrued salaries grew — a cash inflow", mustFormula: true },
            { cell: "D9", expect: 380000, message: "D9: cash from operations via SUM", mustFormula: true, mustUse: "SUM", mustUseLabel: "the SUM function" }
          ],
          success: "CFO " + R(cf.cfo) + " against PAT of " + R(p.pat) + ". The operations threw off more than twice the profit — almost entirely because of the " + R(p.dep) + " depreciation add-back."
        }
      },
      { t: "note", h: "<strong>A convention worth flagging:</strong> Indian statements (AS 3 / Ind AS 7) usually start this section from <em>profit before tax</em> and show tax paid as a separate operating line. Starting from PAT, as we do, reaches the same CFO and is the common teaching and modeling shortcut. It also assumes tax expense equals tax paid — true here, since we're ignoring deferred tax." },
      { t: "where", h: "CFO is the first of three sections on the <strong>cash flow statement</strong>. Its inputs come from the <strong>income statement</strong> (PAT, depreciation) and from comparing two <strong>balance sheets</strong> (the working-capital changes). It is literally a bridge between the other two statements." },
      { t: "mcq", q: "Inventory falls from ₹1,50,000 to ₹1,10,000. What does CFO show?", opts: ["−₹40,000, because stock is lower", "+₹40,000, because the café sold stock without buying replacements", "No effect — inventory is a balance sheet item", "−₹40,000, because it's an asset"], correct: 1, why: ["The direction is backwards. Running stock down means the café stopped paying for replacements while still selling — cash comes in.", "An asset falling releases cash. The café sold ₹40,000 of beans it had already paid for in an earlier period, so this period's COGS is higher than this period's spending. Working capital freed up is a real, if one-off, source of cash — and a common way struggling businesses survive another quarter.", "It's a balance sheet item, but its <em>change</em> is exactly what the indirect method adjusts for.", "Right that it's an asset, wrong on direction: assets going <em>up</em> consume cash, so assets going <em>down</em> release it."] }
    ]
  };

  LS.lessons["1530-cfi"] = {
    id: "1530-cfi", code: "1530", minutes: 4,
    title: "Cash from investing",
    short: "CFI & capex",
    desc: "Capex on the cash flow statement, and the link between what you spend on assets and what depreciation you'll carry.",
    lede: "The section where a business spends money on its future. Short, usually negative, and the fastest way to see whether a company is growing, coasting, or quietly shrinking.",
    body: [
      { t: "def", term: "Cash from investing (CFI)", h: "Cash spent on or received from long-term assets — buying equipment, selling an old van. Negative CFI is normal and usually healthy: it means the business is investing." },
      { t: "formula", title: "Reading capex against depreciation", lines: [
        "Capex &gt; Depreciation  → the asset base is <b>growing</b>",
        "Capex ≈ Depreciation  → <b>maintaining</b> — replacing what wears out",
        "Capex &lt; Depreciation  → <b>shrinking</b> — living off existing assets"
      ], note: "A business that runs capex below depreciation for years is consuming its own capacity. It flatters cash flow now and forces a large catch-up later." },
      { t: "example", h: "<p>FY25's only investing activity was the " + R(240000) + " second machine and scooter — the FY25 additions from your depreciation schedule in lesson 1440. So CFI is " + R(cf.cfi) + ". Note that FY25 capex of " + R(240000) + " exactly equals FY25 depreciation of " + R(p.dep) + ": the café is holding its capacity steady, not expanding it.</p>" },
      {
        t: "sheet",
        sheet: {

          title: "FY25 investing, and the PP&E roll-forward it drives",
          hint: "CFI in B4. Then prove capex is consistent with the balance sheet: net PP&E rolls forward as opening + capex − depreciation, and must land on " + R(bs.ppeNet) + ".",
          grid: [
            ["", { v: "FY25", year: true }],
            ["Purchase of equipment (capex)", -240000],
            ["Proceeds from selling assets", 0],
            ["CASH FROM INVESTING", { input: true, mf: true, fmt: "inr", ph: "=SUM(B2:B3)" }],
            [null, null],
            ["Opening net PP&E (31 Mar 2024)", bs24.ppeNet],
            ["Add: capex", { input: true, mf: true, fmt: "inr", ph: "=-B2" }],
            ["Less: depreciation", -p.dep],
            ["Closing net PP&E (31 Mar 2025)", { input: true, mf: true, fmt: "inr", ph: "=SUM(B6:B8)" }]
          ],
          checks: [
            { cell: "B4", expect: -240000, message: "B4: cash from investing", mustFormula: true },
            { cell: "B7", expect: 240000, message: "B7: capex as a positive addition to PP&E", mustFormula: true },
            { cell: "B9", expect: 1400000, message: "B9: closing net PP&E — matches the balance sheet's " + R(1400000), mustFormula: true }
          ],
          success: "CFI " + R(cf.cfi) + ", and net PP&E rolls to exactly " + R(bs.ppeNet) + " — the figure you put on the balance sheet in lesson 1330. Capex and depreciation cancelled, so net PP&E didn't move at all."

      { t: "mcq", q: "A café reports strong CFO but its capex has been half its depreciation for three years. What should you suspect?", opts: ["Excellent capital discipline", "Cash flow is being flattered by under-investment that must be caught up later", "The depreciation rate is definitely wrong", "Nothing — CFO is what matters"], correct: 1, why: ["It can look like discipline for a year. Three years of replacing only half of what wears out is different — the equipment is aging.", "Depreciation is the annual estimate of capacity being consumed. Spending half of it means the asset base is quietly running down, and the espresso machines will need replacing all at once. Today's healthy cash flow is partly borrowed from tomorrow's balance sheet. Comparing capex to depreciation over several years is one of the fastest quality checks in analysis.", "Possible, but under-spending is the far more common explanation — and you'd check the asset ages before blaming the rate.", "CFO matters enormously, but CFO minus capex — free cash flow, lesson 2230 — is what actually funds lenders and owners."] }

  LS.lessons["1540-cff"] = {
    id: "1540-cff", code: "1540", minutes: 4,
    title: "Cash from financing",

    body: [

      { t: "formula", title: "What belongs in financing", lines: [
        "+ Loan drawn down            − Loan principal repaid",
        "+ Shares issued              − Dividends paid",
        "= <b>Cash from financing</b>",
        "<i>Interest paid: operating (it's a cost of running the business)</i>",
        "<i>Loan principal: financing (it's the money itself)</i>"
      ], note: "The interest-vs-principal split from lesson 1220 decides which section each payment lands in. Ind AS permits interest paid in either operating or financing for non-financial companies, provided it's applied consistently — we keep it in operating, inside PAT." },
      { t: "example", h: "<p>FY25 had two financing events: the café repaid " + R(50000) + " of loan principal (lesson 1220), and paid Priya her first dividend of " + R(C.fy25.dividend) + " (lesson 1320). No new shares, no new borrowing. CFF is " + R(cf.cff) + " — the business returning money to its funders.</p>" },
      {
        t: "sheet",
        sheet: {
          id: "s1",
          title: "FY25 financing, and the loan roll-forward",
          hint: "CFF in B5. Then check the repayment against the balance sheet: the loan must roll from " + R(bs24.loan) + " to " + R(bs.loan) + ".",
          grid: [
            ["", { v: "FY25", year: true }],
            ["Fresh borrowing", 0],
            ["Loan principal repaid", -50000],
            ["Dividend paid to Priya", -C.fy25.dividend],
            ["CASH FROM FINANCING", { input: true, mf: true, fmt: "inr", ph: "=SUM(B2:B4)" }],
            [null, null],
            ["Opening loan (31 Mar 2024)", bs24.loan],
            ["Repayment", { input: true, mf: true, fmt: "inr", ph: "=B3" }],
            ["Closing loan (31 Mar 2025)", { input: true, mf: true, fmt: "inr", ph: "=B7+B8" }]
          ],
          checks: [
            { cell: "B5", expect: -100000, message: "B5: cash from financing via SUM", mustFormula: true, mustUse: "SUM", mustUseLabel: "the SUM function" },
            { cell: "B8", expect: -50000, message: "B8: the repayment, linked from B3", mustFormula: true },
            { cell: "B9", expect: 550000, message: "B9: closing loan — matches the balance sheet's " + R(550000), mustFormula: true }

          success: "CFF " + R(cf.cff) + " and the loan rolls to exactly " + R(bs.loan) + ". Note the dividend appears here — never on the income statement. Dividends are a distribution of profit, not a cost of earning it."
        }
      },
      { t: "where", h: "CFF is the third section of the <strong>cash flow statement</strong>. Loan movements roll the borrowings line on the <strong>balance sheet</strong>; the dividend reduces retained earnings there too (the '− dividends' in your lesson 1320 roll-forward). The <strong>income statement</strong> sees none of it — only the interest." },
      { t: "mcq", q: "Which pairing is correct?", opts: ["Interest paid → financing; dividend paid → financing", "Interest paid → operating; dividend paid → financing", "Interest paid → operating; dividend paid → operating", "Both belong in investing"], correct: 1, why: ["Defensible under Ind AS, which allows interest paid in financing if applied consistently — but it isn't the convention this course (or most teaching models) uses, since interest is already inside PAT.", "Interest is a cost of running the business, already deducted in arriving at PAT, so it sits in operating. A dividend isn't a cost at all — it's profit being handed to the owner, which is a transaction with a capital provider: financing. The give-away is that interest reduces profit and dividends don't.", "A dividend can't be operating — it isn't an expense of earning revenue. It never appears on the income statement.", "Investing is only about long-term assets — buying and selling machines, not dealing with funders."] }
    ]
  };

  LS.lessons["1550-cf-capstone"] = {

      { t: "where", h: "This statement's closing cash <em>is</em> the <strong>balance sheet's</strong> cash line (bridge #3), and it began at the <strong>income statement's</strong> PAT (bridge #1). You've now built all three statements for the same year, from the same facts, and they agree. Module 2100 wires them together so they stay agreeing when you change an assumption." },
      { t: "mcq", q: "A business shows CFO of ₹5,00,000, CFI of −₹8,00,000 and CFF of +₹4,00,000. What story does that tell?", opts: ["It's in trouble — cash from investing is negative", "It's investing more than operations generate, funded by raising money", "It's returning money to shareholders", "The statement must be wrong — the sections should net to zero"], correct: 1, why: ["Negative CFI on its own is a sign of investment, not distress — the question is how it's being funded.", "The business generated ₹5,00,000, spent ₹8,00,000 on assets, and covered the ₹3,00,000 shortfall (plus a bit more) by borrowing or issuing shares. Cash rose ₹1,00,000 overall. That's the classic expansion profile: legitimate and common, but it only works while funders keep saying yes. Compare it with the café, which funded its own capex out of operations.", "Positive CFF means money is coming <em>in</em> from funders, not going out.", "The three sections net to the change in cash, which is ₹1,00,000 here. They have no reason to sum to zero."] }

<script>
/* js/lessons/m1600.js */
/* Module 1600 — Reading statements: ratios */
(function () {
  "use strict";
  var LS = (window.LS = window.LS || {});
  LS.lessons = LS.lessons || {};
  var C = LS.C, R = LS.fmt.inr, P = LS.fmt.pct, X = LS.fmt.x;

  LS.lessons["1610-margins"] = {
    id: "1610-margins", code: "1610", minutes: 5,
    title: "Margin ratios",
    short: "Margins",
    desc: "Gross, EBITDA and PAT margins — the profit funnel as percentages, and how to compare two businesses of different sizes.",
    lede: "Ratios exist for one reason: to make different-sized businesses comparable. A café earning ₹1,80,000 and a chain earning ₹18 crore can't be compared in rupees — but their margins can be compared directly.",
    body: [
      { t: "def", term: "Margin", h: "Any profit line divided by revenue. It answers \"out of every ₹100 a customer spends, how much is left at this point?\" — so margins can be read straight down the income statement as a funnel." },
      { t: "formula", title: "The three margins", lines: [
        "Gross margin  = Gross profit ÷ Revenue    → product economics",
        "EBITDA margin = EBITDA ÷ Revenue          → operating efficiency",
        "PAT margin    = Profit after tax ÷ Revenue → what the owner keeps"
      ], note: "Always compare like with like: gross margin to gross margin, and within the same industry. A supermarket living on 3% net margin can be far healthier than a boutique on 20%." },
      { t: "example", h: "<p>The café's funnel for FY25: " + P(r.gmPct) + " gross → " + P(r.ebitdaPct) + " EBITDA → " + P(r.patPct) + " PAT. Of every ₹100 spent at the counter, ₹65 survives the beans, ₹22.50 survives the rent and salaries, and ₹7.50 reaches Priya. The gap between the first two numbers is the cost of simply being open.</p>" },
      {
        t: "sheet",
        sheet: {
          id: "s1",
          title: "The café's margin funnel, FY24 vs FY25",
          hint: "Build the FY24 column of margins (C2:C4 style — each profit line ÷ revenue), then use 'Copy formula right →' to fill FY25. Cells are already formatted as percentages, so just divide.",
          grid: [
            ["", { v: "FY24", year: true }, { v: "FY25", year: true }],
            ["Revenue", p24.revenue, p.revenue],
            ["Gross profit", p24.grossProfit, p.grossProfit],
            ["EBITDA", p24.ebitda, p.ebitda],
            ["Profit after tax", p24.pat, p.pat],
            [null, null, null],
            ["Gross margin", { input: true, mf: true, fmt: "pct", ph: "=B3/B2" }, { input: true, mf: true, fmt: "pct" }],
            ["EBITDA margin", { input: true, mf: true, fmt: "pct" }, { input: true, mf: true, fmt: "pct" }],
            ["PAT margin", { input: true, mf: true, fmt: "pct" }, { input: true, mf: true, fmt: "pct" }]
          ],
          checks: [
            { cell: "B7", expect: 0.65, message: "B7: FY24 gross margin", mustFormula: true, tol: 0.002 },
            { cell: "C7", expect: 0.65, message: "C7: FY25 gross margin", mustFormula: true, tol: 0.002 },
            { cell: "B8", expect: 0.21, message: "B8: FY24 EBITDA margin", mustFormula: true, tol: 0.002 },
            { cell: "C8", expect: 0.225, message: "C8: FY25 EBITDA margin", mustFormula: true, tol: 0.002 },
            { cell: "B9", expect: 0.06, message: "B9: FY24 PAT margin", mustFormula: true, tol: 0.002 },
            { cell: "C9", expect: 0.075, message: "C9: FY25 PAT margin", mustFormula: true, tol: 0.002 }
          ],
          success: "Gross margin held at 65%, but EBITDA margin rose from 21% to 22.5% and PAT margin from 6% to 7.5%. Revenue grew 20% while rent stayed flat — that's operating leverage, and it's where most margin improvement comes from."
        }
      },
      {
        t: "compare",
        left: {
          title: "Café A — \"Brew Lane\"",
          rows: [["Revenue", "₹40,00,000"], ["Gross profit", "₹22,00,000"], ["EBITDA", "₹4,00,000"], ["Profit after tax", "₹1,20,000"], ["Gross margin", "55%"], ["EBITDA margin", "10%", "total"]]
        },
        right: {
          title: "Café B — \"Third Wave\"",
          rows: [["Revenue", "₹20,00,000"], ["Gross profit", "₹13,00,000"], ["EBITDA", "₹4,40,000"], ["Profit after tax", "₹2,40,000"], ["Gross margin", "65%"], ["EBITDA margin", "22%", "total"]]
        }
      },
      { t: "where", h: "Margins are computed entirely from the <strong>income statement</strong> — no other statement needed. They're the first thing any reader calculates, and the reason the P&L is presented as a funnel of subtotals rather than one big list of costs." },
      { t: "mcq", tag: "Which is healthier?", q: "Brew Lane sells twice as much coffee as Third Wave. Which business would you rather own, and why?", opts: ["Brew Lane — twice the revenue", "Third Wave — better margins at every level and more actual profit", "Brew Lane — bigger businesses are safer", "You can't compare cafés of different sizes"], correct: 1, why: ["Revenue is the least informative line on the statement. Brew Lane is bigger and yet keeps less money.", "Third Wave converts revenue to profit far better: 65% vs 55% gross (better pricing or cheaper inputs), 22% vs 10% EBITDA (much tighter overheads), and it earns ₹2,40,000 against Brew Lane's ₹1,20,000 on half the sales. Brew Lane's real problem is visible in the gap between its gross and EBITDA margins — 45 points of revenue disappearing into overheads, against Third Wave's 43… on twice the base.", "Size gives some resilience, but Brew Lane's thin 10% EBITDA margin means a small cost shock wipes out its profit entirely.", "Comparing different sizes is exactly what ratios are for — that's the whole point of this module."] }
    ]
  };

  LS.lessons["1620-liquidity"] = {
    id: "1620-liquidity", code: "1620", minutes: 5,
    title: "Liquidity: current & quick ratios",
    short: "Liquidity",
    desc: "Can the business pay its bills over the next twelve months? The current ratio, the quick ratio, and why the difference matters.",
    lede: "Profit is about the year. Liquidity is about next Friday. These two ratios ask a blunt question: if the bills came due, could the business pay them?",
    body: [
      { t: "def", term: "Current ratio", h: "Current assets ÷ current liabilities. How many rupees of near-term assets stand behind each rupee of near-term debt. Below 1 means near-term obligations exceed near-term resources." },
      { t: "def", term: "Quick ratio (acid test)", h: "The same, but <strong>excluding inventory</strong> — because stock has to be sold before it becomes cash, and in a bad month it may not sell at all. The harsher, more honest test." },
      { t: "formula", title: "Two tests of survival", lines: [
        "Current ratio = Current assets ÷ Current liabilities",
        "Quick ratio   = (Current assets − Inventory) ÷ Current liabilities",
        "Café: " + R(r.currentAssets) + " ÷ " + R(r.currentLiabs) + " = <b>" + X(3) + "</b>; quick = <b>" + X(2) + "</b>"
      ], note: "Higher isn't automatically better. A current ratio of 5 can mean cash sitting idle or customers who never pay. For most businesses 1.5–3 is comfortable; the right level depends heavily on the industry." },
      { t: "example", h: "<p>At 31 March 2025 the café holds " + R(r.currentAssets) + " of current assets (inventory " + R(bs.inventory) + ", receivables " + R(bs.receivables) + ", cash " + R(bs.cash) + " — the total you built in lesson 1150) against " + R(r.currentLiabs) + " of current liabilities (payables " + R(bs.payables) + " and salaries " + R(bs.accrued) + ").</p>" },
      {
        t: "sheet",
        sheet: {
          id: "s1",
          title: "The café's liquidity, 31 March 2025",
          hint: "Total the current assets (B5) and current liabilities (B8) with SUM, then build both ratios. The ratio cells display as multiples (3x).",
          grid: [
            ["", { v: "31 Mar 2025", year: true }],
            ["Inventory", bs.inventory],
            ["Trade receivables", bs.receivables],
            ["Cash", bs.cash],
            ["Total current assets", { input: true, mf: true, fmt: "inr", ph: "=SUM(B2:B4)" }],
            ["Trade payables", bs.payables],
            ["Salaries payable", bs.accrued],
            ["Total current liabilities", { input: true, mf: true, fmt: "inr", ph: "=SUM(B6:B7)" }],
            [null, null],
            ["Current ratio", { input: true, mf: true, fmt: "x", ph: "=B5/B8" }],
            ["Quick ratio", { input: true, mf: true, fmt: "x", ph: "=(B5-B2)/B8" }]
          ],
          checks: [
            { cell: "B5", expect: 450000, message: "B5: total current assets via SUM", mustFormula: true, mustUse: "SUM", mustUseLabel: "the SUM function" },
            { cell: "B8", expect: 150000, message: "B8: total current liabilities via SUM", mustFormula: true, mustUse: "SUM", mustUseLabel: "the SUM function" },
            { cell: "B10", expect: 3, message: "B10: current ratio", mustFormula: true, tol: 0.01 },
            { cell: "B11", expect: 2, message: "B11: quick ratio — exclude inventory", mustFormula: true, tol: 0.01 }
          ],
          success: "Current ratio " + X(3) + ", quick ratio " + X(2) + ". Even ignoring every bean in the storeroom, the café has ₹2 of quick assets for every ₹1 due. It can comfortably pay its bills."
        }

      {
        t: "compare",
        left: {
          title: "Café A — \"Brew Lane\"",

        },
        right: {
          title: "Café B — \"Third Wave\"",
          rows: [["Inventory", "₹1,00,000"], ["Receivables", "₹2,00,000"], ["Cash", "₹3,00,000"], ["Current liabilities", "₹4,00,000"], ["Current ratio", "1.5x"], ["Quick ratio", "1.25x", "total"]]
        }
      },
      { t: "where", h: "Both ratios come entirely from the current sections of the <strong>balance sheet</strong> — which is exactly why that statement bothers to split current from non-current (lesson 1150). The split exists to make this calculation possible." },
      { t: "mcq", tag: "Which is healthier?", q: "Both cafés show a current ratio of exactly 1.5x. Which one would you lend to?", opts: ["Brew Lane — it has more current assets in total", "Third Wave — its liquidity doesn't depend on selling stock", "Neither — 1.5x is too low", "They're equally safe; the ratio says so"], correct: 1, why: ["Brew Lane's assets are larger but the wrong kind: ₹6,00,000 of it is beans and pastry. If sales slow, that stock doesn't convert — and unlike Third Wave, Brew Lane has only ₹50,000 of cash to bridge the gap.", "Identical current ratios, completely different risk. Third Wave's quick ratio of 1.25x means it could settle every current liability without selling a single bean. Brew Lane's 0.3x means it's utterly dependent on moving inventory. This is exactly the blind spot the quick ratio was invented to expose — never read the current ratio alone.", "1.5x is a perfectly normal level for many businesses; the composition is what separates these two.", "The ratio is identical, which is precisely why one ratio is never enough."] }
    ]

  LS.lessons["1630-leverage"] = {
    id: "1630-leverage", code: "1630", minutes: 5,
    title: "Leverage: D/E and interest coverage",
    short: "Leverage",
    desc: "How much debt is too much? Debt-to-equity measures the stock of debt; interest coverage measures the ability to service it.",
    lede: "Debt magnifies both good and bad outcomes. Two ratios tell you how much a business has taken on, and — more importantly — whether it can comfortably keep paying for it.",
    body: [
      { t: "def", term: "Debt-to-equity (D/E)", h: "Borrowings ÷ equity. How many rupees the lenders have put in for every rupee the owner has. A <strong>stock</strong> measure — a snapshot of the balance sheet." },
      { t: "def", term: "Interest coverage", h: "EBIT ÷ interest expense. How many times over the year's operating profit could pay the year's interest. A <strong>flow</strong> measure — and usually the one lenders check first, because businesses default on payments, not on ratios." },
      { t: "formula", title: "Stock and flow", lines: [
        "Debt-to-equity     = Borrowings ÷ Equity",
        "Interest coverage  = EBIT ÷ Interest expense",
        "Café: " + R(bs.loan) + " ÷ " + R(r.equity) + " = <b>" + X(r.de) + "</b>;  " + R(p.ebit) + " ÷ " + R(p.interest) + " = <b>" + X(r.intCover) + "</b>"
      ], note: "Rules of thumb: coverage below about 2x is uncomfortable, below 1x means operating profit can't even pay the interest. Acceptable D/E varies enormously — a utility with predictable cash flows carries debt a café never could." },
      { t: "example", h: "<p>The café owes the bank " + R(bs.loan) + " against Priya's equity of " + R(r.equity) + " (share capital " + R(bs.capital) + " + retained earnings " + R(bs.retained) + "). Its EBIT of " + R(p.ebit) + " covers its " + R(p.interest) + " interest bill " + X(r.intCover) + " over.</p>" },
      {
        t: "sheet",
        sheet: {
          id: "s1",
          title: "The café's leverage, FY25",
          hint: "Total equity in B4, then both ratios. Remember equity = share capital + retained earnings, not just the capital.",
          grid: [
            ["", { v: "FY25", year: true }],
            ["Share capital", bs.capital],
            ["Retained earnings", bs.retained],
            ["Total equity", { input: true, mf: true, fmt: "inr", ph: "=SUM(B2:B3)" }],
            ["Term loan (debt)", bs.loan],
            [null, null],
            ["EBIT", p.ebit],
            ["Interest expense", p.interest],
            [null, null],
            ["Debt-to-equity", { input: true, mf: true, fmt: "x", ph: "=B5/B4" }],
            ["Interest coverage", { input: true, mf: true, fmt: "x", ph: "=B7/B8" }]

                });

              },

            }

          tie: { pairs: [{ a: "B17", le: "B24", label: "FY24" }, { a: "C17", le: "C24", label: "FY25" }, { a: "D17", le: "D24", label: "FY26" }] },
          success: "Three years, three bridges, zero difference in every one. This is a working financial model — change any flow in rows 3–10 and every year still ties."
        }

      { t: "note", h: "<strong>Try it:</strong> change FY26 depreciation in D4 to " + R(300000) + " and watch. PP&E falls, retained earnings falls by the same amount, cash doesn't move — and FY26 still ties. If a model doesn't behave that way, a bridge is broken. That's the next lesson." },
      { t: "where", h: "This is the skeleton of every three-statement model in professional finance. Module 2200 adds the missing front end: instead of typing PAT for each year, you'll <em>drive</em> it from assumptions about growth and margin, and let the model compute everything downstream." },
      { t: "mcq", q: "In your model, why does FY26 cash depend on FY25 cash rather than being computed from scratch?", opts: ["Convenience — it saves typing", "Because cash is a balance that carries over; the statement only ever explains the change", "Because Excel requires it", "It doesn't — either method works identically"], correct: 1, why: ["It does save typing, but the reason is conceptual, not practical.", "Cash is a <em>stock</em> — it persists. The cash flow statement measures a <em>flow</em>, the change during the year. Closing = opening + change is the only way to connect them, which is exactly the stocks-vs-flows distinction from lesson 1040. Every balance sheet line in this model rolls forward the same way; only the flows are computed fresh each year.", "The spreadsheet doesn't care; the accounting does.", "Computing cash from scratch each year would mean re-deriving every transaction since the café opened — and it would silently lose any opening balance."] }
    ]

  LS.lessons["2130-broken-link"] = {
    id: "2130-broken-link", code: "2130", minutes: 6,
    title: "Debug it: find the broken link",
    short: "Find the broken link",
    desc: "A model that doesn't tie, one wrong formula, and the diagnostic technique professionals use to find it fast.",
    lede: "Every modeler's real job is this: the balance sheet is out by some amount, and you have to find out why. There's a technique, and it beats hunting randomly every time.",
    body: [
      { t: "def", term: "The size-of-the-gap technique", h: "Don't scan formulas. <strong>Read the difference.</strong> The amount by which a balance sheet fails to tie almost always equals the number that was mishandled — so identify the gap, find the line item of that exact size, and check its formula first." },
      { t: "formula", title: "Common gaps and their usual cause", lines: [
        "Gap = PAT                → retained earnings missing the profit",
        "Gap = dividend           → retained earnings missing the dividend",
        "Gap = depreciation       → PP&amp;E or the cash add-back is wrong",

        "Gap = loan repayment     → the loan roll-forward or financing is wrong",

      { t: "example", h: "<p>Below is the café's FY25 model, already built — and broken. Someone wired one of the four rolled lines wrongly. The FY24 column is correct and ties; FY25 does not. Read the gap before you read the formulas.</p>" },

          ],
          checks: [
            { cell: "C18", expect: 250000, message: "C18: retained earnings — opening + PAT − dividend", mustFormula: true, mustUse: /C7/, mustUseLabel: "the dividend in C7" },
            { cell: "C14", expect: 100000, message: "C14: FY25 cash still correct at ₹1,00,000", mustFormula: true },
            { cell: "C10", expect: 1400000, message: "C10: FY25 PP&E still correct at ₹14,00,000", mustFormula: true },
            {
              custom: function (s) {
                var a = s.value("C15"), l = s.value("C22");
                if (typeof a !== "number" || typeof l !== "number") return "The FY25 totals aren't computing.";
                return Math.abs(a - l) < 1 ? true : "FY25 is still out by " + R(Math.abs(a - l)) + ".";
              },

          ],
          tie: { pairs: [{ a: "B15", le: "B22", label: "FY24" }, { a: "C15", le: "C22", label: "FY25" }] },
          success: "Fixed. The gap was ₹50,000 — the dividend — and retained earnings was the only line that should have used it. Gap size named the culprit before you read a single formula."
        }
      },
      { t: "note", h: "<strong>Why this happens so often in real models:</strong> the dividend is the one flow that touches retained earnings but is easy to forget, because it never appears on the income statement. Anything that bypasses the P&L — dividends, share issues, loan principal — is where broken links cluster." },
      { t: "where", h: "This is the everyday reality of working with the <strong>balance sheet</strong>: it's not just a report, it's a permanent audit of your own logic. A model that ties in every year is a model whose flows are all accounted for — which is why the tie is the first thing anyone checks." },
      { t: "mcq", q: "A model is out by exactly ₹4,80,000, and capex for the year was ₹2,40,000. What's the most likely error?", opts: ["Capex was omitted from PP&E", "Capex was added to PP&E where it should have been subtracted, or vice versa — a sign flip", "Depreciation was doubled", "Two separate errors of ₹2,40,000"], correct: 1, why: ["Omitting it entirely would leave a gap of ₹2,40,000, not double that.", "A gap of exactly twice a line item is the signature of a flipped sign. Adding ₹2,40,000 where you should subtract it moves the total by ₹4,80,000 — the ₹2,40,000 you wrongly added plus the ₹2,40,000 you failed to subtract. Check the sign before you go looking for two coincidental errors.", "Possible in principle, but only if depreciation happened to equal capex — and a sign flip is far more common than a duplicated line.", "Two independent errors of exactly the same size is a much less likely explanation than one sign flip."] }
    ]
  };

(function () {
