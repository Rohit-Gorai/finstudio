  LS.lessons["2210-drivers"] = {
    id: "2210-drivers", code: "2210", minutes: 5,
    title: "Drivers and assumptions",
    short: "Drivers",
    desc: "Separate assumptions from calculations: growth %, margin %, and DSO/DIO/DPO as input cells that everything else references.",
    lede: "A model is not a forecast typed into a grid. It's a small machine: a handful of assumptions at the top, and every other cell computed from them. Change one input and the whole model responds. Here's how to build that discipline in.",
    body: [
      { t: "def", term: "Driver", h: "An assumption the model is <strong>driven by</strong> — revenue growth, gross margin, days of receivables. Drivers live in their own clearly-marked input cells. Everything else is a formula. If you find yourself typing a number into a calculation, you've just broken your model." },
      { t: "def", term: "DSO, DIO, DPO", h: "Working capital expressed in <strong>days</strong> rather than rupees, so it scales automatically as the business grows. <strong>DSO</strong>: days customers take to pay. <strong>DIO</strong>: days of stock held. <strong>DPO</strong>: days you take to pay suppliers." },
      { t: "formula", title: "Turning balances into days (and back)", lines: [
        "DSO = Receivables ÷ Revenue × 365      → forecast: Receivables = Revenue × DSO ÷ 365",
        "DIO = Inventory   ÷ COGS    × 365      → forecast: Inventory   = COGS × DIO ÷ 365",
        "DPO = Payables    ÷ COGS    × 365      → forecast: Payables    = COGS × DPO ÷ 365"
      ], note: "Compute the days from history, assume they hold, then let revenue growth carry working capital along with it. That's how a projected balance sheet stays realistic instead of frozen." },
      { t: "example", h: "<p>From the café's FY25 statements: receivables " + R(y25.bs.receivables) + " on revenue of " + R(y25.pl.revenue) + " is " + C.ratios.dso.toFixed(1) + " days — consistent with the 30-day catering terms from lesson 1140. Inventory of " + R(y25.bs.inventory) + " against COGS of " + R(y25.pl.cogs) + " is " + C.ratios.dio.toFixed(1) + " days of stock, and the café takes " + C.ratios.dpo.toFixed(1) + " days to pay its roaster.</p>" },
      {
        t: "sheet",
        sheet: {
          id: "s1",
          title: "Derive the café's working-capital drivers from FY25",
          hint: "Build the three day-counts in B7:B9 from the actuals above. Then prove they work in reverse: B12 forecasts FY26 receivables from FY26 revenue and your DSO — and it should land on " + R(230000) + ".",
          grid: [

            ["DPO (days)", { input: true, mf: true, fmt: "days", ph: "=B6/B3*365" }],
            [null, null],
            ["FY26 revenue (15% growth)", { input: true, mf: true, fmt: "inr", ph: "=B2*1.15" }],

          checks: [
            { cell: "B7", expect: 30.42, message: "B7: DSO", mustFormula: true, tol: 0.1 },
            { cell: "B8", expect: 65.18, message: "B8: DIO", mustFormula: true, tol: 0.1 },
            { cell: "B9", expect: 52.14, message: "B9: DPO", mustFormula: true, tol: 0.1 },
            { cell: "B11", expect: 2760000, message: "B11: FY26 revenue grown 15%", mustFormula: true },
            { cell: "B12", expect: 230000, message: "B12: FY26 receivables driven by DSO", mustFormula: true, tol: 100 }

        }
      },
      { t: "note", h: "<strong>The cash conversion cycle:</strong> DIO + DSO − DPO = " + (C.ratios.dio + C.ratios.dso - C.ratios.dpo).toFixed(0) + " days for the café. That's how long a rupee is tied up between paying for beans and collecting from customers. Shorter is better; negative (which supermarkets achieve) means suppliers fund your entire working capital." },
      { t: "where", h: "Drivers sit in a clearly-labelled assumptions block at the top of a model. From there they feed the projected <strong>income statement</strong> (growth, margin) and the projected <strong>balance sheet</strong> (the day-counts) — and through both, the projected <strong>cash flow statement</strong>." },
      { t: "mcq", q: "Your model forecasts receivables as a flat ₹2,00,000 for all three years while revenue grows 15% a year. What's wrong?", opts: ["Nothing — receivables are hard to predict", "It implicitly assumes customers pay faster every year, which needs justification", "Receivables should always grow faster than revenue", "It will make the balance sheet fail to tie"], correct: 1, why: ["They're uncertain, but a frozen balance with growing revenue isn't a neutral assumption — it's a strong and probably unintended one.", "Flat receivables on rising revenue means DSO falling from 30 days to 26 to 23 — you've silently assumed the café gets better at collecting every year. That flatters cash flow. Holding the <em>days</em> constant instead keeps the assumption neutral, which is exactly why professionals model working capital in days.", "There's no such rule. Growing in line with revenue (constant DSO) is the neutral default.", "The sheet will still tie — a linked model always ties. It'll just tie around a hidden and unjustified assumption, which is far more dangerous than an obvious error."] }
    ]
  };

  LS.lessons["2220-project-pl"] = {
    id: "2220-project-pl", code: "2220", minutes: 6,
    title: "Projecting the P&L three years",
    short: "Projecting the P&L",
    desc: "Drive a three-year income statement from four assumptions, using copy-right to build FY27 and FY28 from FY26.",
    lede: "Four assumptions produce three years of income statement. Build the first projected column properly and the other two are one button-press each — which is exactly how it works in a real modeling job.",
    body: [
      { t: "formula", title: "The projection logic", lines: [
        "Revenue     = prior year revenue × (1 + growth)",
        "COGS        = revenue × (1 − gross margin)",
        "Opex        = prior year opex × (1 + cost inflation)",
        "Depreciation, interest: from the schedules you already built",
        "Tax         = profit before tax × tax rate"
      ], note: "Notice that every line references either a driver or a prior-year cell. No number is typed twice — a rule worth being fanatical about." },
      { t: "example", h: "<p>The café's assumptions: revenue grows " + P(d.growth) + " a year (a second location's worth of catering), gross margin holds at " + P(d.gm) + ", operating costs inflate " + P(d.opexGrowth) + ", depreciation stays " + R(d.dep) + " (capex keeps replacing it), and interest falls as the loan is repaid — " + R(y26.pl.interest) + ", " + R(y27.pl.interest) + ", " + R(y28.pl.interest) + " at 10% of each year's opening balance.</p>" },
      {
        t: "sheet",
        sheet: {
          id: "s1",

          grid: [

            ["Gross margin", { v: d.gm, fmt: "pct" }, null, null, null],
            ["Opex inflation", { v: d.opexGrowth, fmt: "pct" }, null, null, null],
            ["", { v: "FY25 actual", year: true }, { v: "FY26", year: true }, { v: "FY27", year: true }, { v: "FY28", year: true }],

            ["Cost of goods sold", -y25.pl.cogs, { input: true, mf: true, fmt: "inr", ph: "=-C6*(1-$B$3)" }, { input: true, mf: true, fmt: "inr" }, { input: true, mf: true, fmt: "inr" }],
            ["Gross profit", y25.pl.grossProfit, { input: true, mf: true, fmt: "inr", ph: "=SUM(C6:C7)" }, { input: true, mf: true, fmt: "inr" }, { input: true, mf: true, fmt: "inr" }],
            ["Operating expenses", -y25.pl.opex, { input: true, mf: true, fmt: "inr", ph: "=B9*(1+$B$4)" }, { input: true, mf: true, fmt: "inr" }, { input: true, mf: true, fmt: "inr" }],
            ["EBITDA", y25.pl.ebitda, { input: true, mf: true, fmt: "inr", ph: "=SUM(C8:C9)" }, { input: true, mf: true, fmt: "inr" }, { input: true, mf: true, fmt: "inr" }],
            ["Depreciation", -y25.pl.dep, -d.dep, -d.dep, -d.dep],
            ["EBIT", y25.pl.ebit, { input: true, mf: true, fmt: "inr", ph: "=SUM(C10:C11)" }, { input: true, mf: true, fmt: "inr" }, { input: true, mf: true, fmt: "inr" }],
            ["Interest expense", -y25.pl.interest, -y26.pl.interest, -y27.pl.interest, -y28.pl.interest],

            ["PROFIT AFTER TAX", y25.pl.pat, { input: true, mf: true, fmt: "inr", ph: "=C14*0.75" }, { input: true, mf: true, fmt: "inr" }, { input: true, mf: true, fmt: "inr" }]
          ],
          checks: [

            { cell: "C8", expect: 1794000, message: "C8: FY26 gross profit", mustFormula: true },
            { cell: "C10", expect: 672000, message: "C10: FY26 EBITDA", mustFormula: true },
            { cell: "C12", expect: 432000, message: "C12: FY26 EBIT", mustFormula: true },
            { cell: "C15", expect: 282750, message: "C15: FY26 profit after tax", mustFormula: true, tol: 5 },
            { cell: "D6", expect: 3174000, message: "D6: FY27 revenue", mustFormula: true },
            { cell: "D15", expect: 404175, message: "D15: FY27 profit after tax", mustFormula: true, tol: 5 },
            { cell: "E6", expect: 3650100, message: "E6: FY28 revenue", mustFormula: true },
            { cell: "E12", expect: 774945, message: "E12: FY28 EBIT", mustFormula: true, tol: 5 },

          ],
          success: "Three projected years from four assumptions. PAT roughly triples, from " + R(y25.pl.pat) + " to " + R(rd(y28.pl.pat)) + " — mostly operating leverage, since revenue grows 15% while costs grow 10%."
        }
      },
      { t: "note", h: "<strong>Why the $ signs matter:</strong> when you copy a formula right, relative references shift (C6 becomes D6 — what you want for last year's revenue) but $B$2 stays anchored on the growth driver. Mixing these up is the most common cause of a model that works in the first column and quietly falls apart in the third. The 'Copy formula right' button in this sheet respects $ exactly as Excel does — try it both ways and watch." },
      { t: "where", h: "This projected <strong>income statement</strong> feeds everything downstream: PAT drives retained earnings, EBIT drives the free cash flow you'll build next, and both flow into the valuation in lesson 2240." },
      { t: "mcq", q: "Revenue grows 15% a year and operating costs 10%. What happens to EBITDA margin over three years?", opts: ["It stays flat — both are growing", "It rises, because revenue outgrows the costs it doesn't control", "It falls, because costs compound", "It depends on the tax rate"], correct: 1, why: ["Both grow, but at different rates — and the gap compounds in the business's favour.", "This is operating leverage. Gross margin is fixed at 65% by assumption, so gross profit grows at the full 15%, while opex grows at only 10%. EBITDA margin climbs from " + P(y25.pl.ebitda / y25.pl.revenue) + " in FY25 to " + P(y28.pl.ebitda / y28.pl.revenue) + " by FY28. It's also the assumption to challenge hardest — it says the café can grow 15% a year without proportionally more staff, which may not survive contact with reality.", "Costs do compound, but more slowly than revenue does. Compounding at 10% loses to compounding at 15%.", "Tax sits well below EBITDA — it can't affect that margin at all."] }

  LS.lessons["2230-fcff"] = {
    id: "2230-fcff", code: "2230", minutes: 6,
    title: "Free cash flow to the firm",
    short: "Free cash flow",
    desc: "The cash a business generates for all its funders: EBIT after tax, plus depreciation, minus capex and working capital.",
    lede: "Valuation doesn't use profit. It uses free cash flow — the cash actually available to hand to lenders and owners after the business has paid for everything it needs to keep running.",
    body: [
      { t: "def", term: "Free cash flow to the firm (FCFF)", h: "Cash generated by operations, after tax and after the investment needed to sustain them, but <strong>before</strong> any payments to lenders or owners. It belongs to <em>all</em> providers of capital — which is why it's discounted at a blended cost of capital." },
      { t: "formula", title: "Building FCFF", lines: [
        "EBIT × (1 − tax rate)      <i>= NOPAT, operating profit after a clean tax charge</i>",
        "+ Depreciation             <i>add back — it never cost cash</i>",
        "− Capital expenditure      <i>real cash the business must spend to survive</i>",
        "− Increase in working capital",
        "= <b>Free cash flow to the firm</b>"
      ], note: "Interest is deliberately absent. FCFF is measured <em>before</em> financing, so it doesn't change if the café repays its loan — that keeps the valuation about the business, not its funding mix. The tax is computed on EBIT, not on PBT, for the same reason." },

      {

        sheet: {
          id: "s1",
          title: "Free cash flow to the firm, FY26–FY28",
          hint: "Build the FY26 column (C3 down to C8), then copy each formula right into FY27 and FY28. Working capital increases are already entered as negatives.",

            ["", { v: "FY26", year: true }, { v: "FY27", year: true }, { v: "FY28", year: true }],
            ["EBIT", y26.pl.ebit, rd(y27.pl.ebit), rd(y28.pl.ebit)],
            ["Tax rate", { v: C.taxRate, fmt: "pct" }, { v: C.taxRate, fmt: "pct" }, { v: C.taxRate, fmt: "pct" }],
            ["NOPAT = EBIT × (1 − tax)", { input: true, mf: true, fmt: "inr", ph: "=B2*(1-B3)" }, { input: true, mf: true, fmt: "inr" }, { input: true, mf: true, fmt: "inr" }],

            ["Less: capital expenditure", -d.capex, -d.capex, -d.capex],
            ["Less: increase in working capital", -rd(y26.dNWC), -rd(y27.dNWC), -rd(y28.dNWC)],
            ["FREE CASH FLOW TO THE FIRM", { input: true, mf: true, fmt: "inr", ph: "=SUM(B4:B7)" }, { input: true, mf: true, fmt: "inr" }, { input: true, mf: true, fmt: "inr" }]

        { q: "Which statement answers \"did the business make a profit this year?\"", opts: ["Balance sheet", "Income statement", "Cash flow statement", "All three equally"], correct: 1, why: ["The balance sheet is a snapshot of what's owned and owed at one instant — it shows accumulated profit inside equity, but not this year's performance.", "Revenue minus expenses over a period is precisely what the income statement reports.", "That one answers where the cash went, which is a different question — and often a very different answer.", "Each answers a distinct question; conflating them is the mistake this course spends module 1000 preventing."] },
        { q: "The café pays ₹30,000 of rent for the month just ended. The effect on equity is…", opts: ["No change — cash just moved", "Equity falls ₹30,000", "Equity rises ₹30,000", "Equity falls only if the café is loss-making"], correct: 1, why: ["Cash fell and nothing was received in exchange that the café still owns — that consumption has to land somewhere, and it lands in equity.", "Rent is an expense: value consumed. Expenses reduce profit, and profit belongs to the owner, so equity falls by the same ₹30,000 the assets did. The equation stays balanced.", "Expenses never increase equity.", "Every expense reduces equity regardless of whether the business is overall profitable."] }

        { q: "The café repaints its shopfront for ₹40,000. This is…", opts: ["Capex — it improves the property", "An expense — it maintains what already exists", "Inventory", "A liability"], correct: 1, why: ["Repainting restores the shop to its existing condition rather than extending its life or capacity, so it isn't capitalised.", "Maintenance keeps an asset doing what it already did — expensed in the period. Had the café instead built an extension, that added capacity would be capex.", "Inventory is goods held for sale; paint on a wall isn't for sale.", "It's a cost, not an obligation — assuming it's been paid."] },
        { q: "A machine costs ₹6,00,000 with a 10-year life and no residual value. Annual straight-line depreciation is…", opts: ["₹60,000", "₹6,00,000", "₹10,000", "It depends on the machine's resale value"], correct: 0, why: ["Cost ÷ life = 6,00,000 ÷ 10 = ₹60,000 every year, charged against the original cost, not the falling book value.", "That's the whole cost, which would wrongly expense a 10-year asset in a single year.", "That would be a 60-year life.", "Resale value and book value drift apart immediately — accounting allocates cost, it doesn't appraise."] },
        { q: "Opening inventory ₹1,00,000, purchases ₹5,00,000, closing inventory ₹1,50,000. COGS is…", opts: ["₹5,50,000", "₹4,50,000", "₹5,00,000", "₹6,50,000"], correct: 1, why: ["That would mean consuming more than was available plus held — check the direction of the closing adjustment.", "COGS = opening + purchases − closing = 1,00,000 + 5,00,000 − 1,50,000 = ₹4,50,000. Stock grew ₹50,000, so ₹50,000 of what was bought is still on the shelf, not yet an expense.", "That's just purchases — it ignores the ₹50,000 that went into stock rather than into sales.", "That adds closing inventory instead of subtracting it."] },

        { q: "A refundable lease deposit repayable when the lease ends in six years is…", opts: ["A current asset — it's basically cash", "A non-current asset", "An expense", "A liability"], correct: 1, why: ["It feels like cash, but the café can't touch it for six years. Classification follows expected timing, not the nature of the item.", "Expected to convert to cash beyond twelve months, so it sits with the non-current assets near PP&E.", "It's fully refundable, so nothing has been consumed — the café still owns the money.", "The landlord owes it back to the café, making it the café's asset."] }

        { q: "The café receives ₹80,000 of beans on 45-day credit. At that moment…", opts: ["An expense of ₹80,000 is recorded", "Inventory and trade payables both rise ₹80,000", "Cash falls ₹80,000", "Nothing is recorded until payment"], correct: 1, why: ["No expense yet — the beans are an asset until they're brewed and sold.", "An asset arrives and an obligation arrives with it. The expense comes later (when consumed), the cash movement later still (day 45). Three events, three dates.", "Cash is untouched for 45 days — that's what credit terms mean.", "The obligation exists the moment goods change hands; waiting would let a business hide its debts."] },
        { q: "March salaries of ₹30,000 will be paid on 5 April. In the 31 March statements they are…", opts: ["Ignored — not yet paid", "An expense in March and a liability at 31 March", "An expense in April only", "An asset"], correct: 1, why: ["The work was done in March; ignoring it would understate March's costs and overstate its profit.", "Matching puts the cost in the period the work was done, and because the cash hasn't left, the unpaid amount sits as an accrued liability at year end.", "Recording it in April would push a March cost into the wrong year.", "The café owes money — that's an obligation, not something it owns."] },
        { q: "The café pays the bank ₹1,10,000: ₹60,000 interest and ₹50,000 principal. The income statement shows…", opts: ["₹1,10,000", "₹60,000", "₹50,000", "Nothing"], correct: 1, why: ["Only part of the payment is a cost of doing business.", "Interest is the price of using the bank's money for the year — an expense. The ₹50,000 principal repayment just returns borrowed money: assets down, liabilities down, equity untouched.", "That's the principal, which is precisely the part that is <em>not</em> an expense.", "Interest genuinely is an expense — a service fully consumed each year."] },

        { q: "Why is share capital shown with liabilities rather than assets?", opts: ["To force the sheet to balance", "Because both sides list claims on the assets, ranked by seniority", "Because owners can demand it back like a loan", "It's an arbitrary convention"], correct: 1, why: ["The sheet balances by arithmetic — equity is defined as the residual, not forced into place.", "The left side lists what the business has; the right lists who has a claim on it. Creditors claim fixed amounts first, the owner claims whatever remains, last. That ranking is exactly why lenders and owners analyse a business differently.", "Equity has no due date and no fixed amount — that's what separates it from a loan.", "The layout encodes real seniority of claims, which is information, not convention."] }

        { q: "Retained earnings are ₹2,50,000 but cash is ₹1,00,000. This means…", opts: ["₹1,50,000 is missing", "Retained profit was reinvested into other assets", "The accounts are wrong", "A dividend is overdue"], correct: 1, why: ["Nothing is missing — the money was deliberately put to work.", "Retained earnings is a claim, not a pile of cash. The profit became equipment, inventory and receivables, and repaid debt. Large retained earnings with modest cash is entirely normal.", "The two numbers measure different things and have no reason to match.", "Dividends are a choice, and retained earnings exceeding cash says nothing about whether one is due."] },

        { q: "A balance sheet is out by exactly the year's profit after tax. The likely cause is…", opts: ["Depreciation was missed", "Retained earnings was never rolled forward", "An asset was double counted", "The cash balance is wrong"], correct: 1, why: ["A missing depreciation charge would leave a gap the size of depreciation, not of PAT.", "A gap equal to PAT is the classic signature: the profit's assets all arrived, but the matching claim in equity was never recorded. Read the size of the gap before hunting through formulas.", "Possible in principle, but only if the duplicated asset happened to equal PAT exactly.", "Also possible, but again only by coincidence — the gap's size points straight at the retained earnings bridge."] }

        { q: "Which adjustment is ADDED back to profit when computing cash from operations?", opts: ["An increase in receivables", "Depreciation", "An increase in inventory", "A dividend paid"], correct: 1, why: ["Receivables rising means revenue recognised without cash arriving — subtracted.", "Depreciation is an expense that removed no cash, so it's added back. It's usually the largest single reconciling item.", "Stock rising means cash spent that isn't yet an expense — subtracted.", "Dividends are a financing outflow, not an operating adjustment."] },
        { q: "Inventory falls from ₹1,50,000 to ₹1,10,000. The effect on CFO is…", opts: ["−₹40,000", "+₹40,000", "None", "−₹1,10,000"], correct: 1, why: ["That's backwards — running stock down releases cash rather than consuming it.", "An asset falling releases cash: the café sold goods it had already paid for without fully replacing them. Assets up consume cash, assets down release it.", "The change in every working-capital balance is exactly what the indirect method adjusts for.", "The adjustment is the change, not the closing balance."] },

    "1600": {
      title: "Ratios",
      questions: [
        { q: "Gross margin falls from 65% to 58% while revenue grows. The likeliest cause is…", opts: ["Rent increased", "Input costs rose and weren't passed on in prices", "New equipment was bought", "Debt was repaid"], correct: 1, why: ["Rent sits below the gross profit line — it cannot affect gross margin. That's exactly why the subtotal is useful.", "Gross margin moves only when the relationship between selling price and direct cost changes. Absorbing higher input costs is the textbook cause, and a signal of weak pricing power.", "Equipment is capex, reaching the P&L as depreciation, far below gross profit.", "Debt repayment never touches the income statement at all."] },
        { q: "Two businesses both have a current ratio of 1.5x. What most affects which is safer?", opts: ["Which has more total assets", "How much of the current assets is inventory rather than cash", "Which is more profitable", "Which is larger"], correct: 1, why: ["Total assets includes long-term items that can't pay next month's bills.", "The quick ratio strips out inventory, because stock has to be sold before it becomes cash — and in a bad month it may not sell. Identical current ratios can hide completely different risk.", "Profit matters greatly, but liquidity is about timing of cash, and profitable businesses do run out of money.", "Size gives some resilience but says little about whether near-term bills can be paid."] },
        { q: "Interest coverage is EBIT ÷ interest. A coverage of 1.25x means…", opts: ["Comfortable headroom", "Operating profit barely exceeds the interest bill", "The business is loss-making", "Debt is 1.25x equity"], correct: 1, why: ["A 25% cushion is thin — one bad quarter and the payment can't be made.", "EBIT covers interest only 1.25 times, leaving very little room. Lenders write coverage covenants precisely because this flow measure predicts distress sooner than any balance-sheet ratio.", "Coverage above 1x means EBIT exceeds interest; the business is profitable at that level, if narrowly.", "That's debt-to-equity, a different (and stock-based) ratio."] },
        { q: "PAT ₹1,80,000 and equity ₹12,50,000. ROE is…", opts: ["14.4%", "6.9%", "144%", "7.5%"], correct: 0, why: ["1,80,000 ÷ 12,50,000 = 14.4% — the return on the owner's money after lenders and tax.", "That inverts the fraction.", "That's off by a factor of ten.", "7.5% is the PAT margin (profit over revenue), a different denominator entirely."] },
        { q: "Two businesses both earn 18% ROE. One does it on a 12% margin with low leverage, the other on a 3% margin with 3x leverage. Which is more robust?", opts: ["The leveraged one — leverage boosts returns", "The high-margin one", "They're identical", "Impossible to say"], correct: 1, why: ["Leverage magnifies losses exactly as it magnifies gains — it raises the return and the risk together.", "A 12% margin absorbs a bad year; a 3% margin amplified 3x can swing sharply negative on a small setback. Same ROE, opposite risk profiles — which is exactly what DuPont exists to reveal.", "The ROE is the same; the quality of it is not.", "DuPont makes it very answerable — that's its whole purpose."] }

    "2100": {
      title: "Linking the statements",
      questions: [
        { q: "Which is NOT one of the three bridges between the statements?", opts: ["PAT into retained earnings", "Depreciation reducing PP&E", "Closing cash into the balance sheet", "Revenue into trade receivables"], correct: 3, why: ["That's bridge 1 — the income statement's bottom line entering equity.", "That's bridge 2 — one number appearing on all three statements.", "That's bridge 3 — the cash flow statement's final line being the balance sheet's cash.", "Revenue does drive receivables, but that's a working-capital relationship inside one period's modelling, not one of the three structural bridges that make the statements interlock."] },
        { q: "You increase depreciation by ₹10,000 in a linked model (ignore tax). Cash…", opts: ["falls ₹10,000", "rises ₹10,000", "doesn't move", "falls ₹7,500"], correct: 2, why: ["Depreciation removes no cash — that's its defining feature.", "Cash doesn't rise either; the two effects cancel exactly.", "PAT falls ₹10,000 but the cash flow statement adds back ₹10,000 more depreciation, so CFO is unchanged. Meanwhile PP&E and retained earnings both fall ₹10,000, and the sheet still ties. This self-correcting behaviour is the sign of a correctly linked model.", "There's no tax effect to consider — the question says to ignore tax."] },
        { q: "A model is out by exactly the dividend paid. Check first…", opts: ["The depreciation schedule", "The retained earnings roll-forward", "The capex line", "The revenue forecast"], correct: 1, why: ["A depreciation error would leave a gap the size of depreciation.", "The dividend appears in only one balance-sheet formula — retained earnings — and it's easy to forget because it never appears on the income statement. Gap size names the culprit before you read a formula.", "Capex errors leave a gap the size of capex.", "A revenue error would flow through PAT and produce a differently-sized gap."] },
        { q: "A model is out by exactly twice the capex figure. That usually means…", opts: ["Capex was omitted", "A sign was flipped", "Capex was recorded in two places", "Depreciation equals capex"], correct: 1, why: ["Omitting it leaves a gap of one times capex, not two.", "Adding an amount where you should subtract it moves the total by twice that amount — the sum you wrongly added plus the sum you failed to subtract. A doubled gap is the signature of a sign error.", "Possible, but a flipped sign is far more common and produces exactly this pattern.", "That relationship affects net PP&E but wouldn't create a gap at all."] },
        { q: "Why does each year's closing cash depend on the previous year's closing cash?", opts: ["To save typing", "Because cash is a stock and the statement measures only the change", "Because spreadsheets require it", "It doesn't — each year stands alone"], correct: 1, why: ["Convenient, but the reason is conceptual.", "Cash persists; the cash flow statement measures a flow, the change during the period. Closing = opening + change is the only way to connect a stock to a flow — the same distinction lesson 1040 introduced.", "The spreadsheet doesn't care; the accounting does.", "Computing cash afresh each year would mean re-deriving every transaction since the business opened."] }

    "2200": {
      title: "Modeling & valuation",
      questions: [
        { q: "Modelling receivables as flat while revenue grows 15% a year implicitly assumes…", opts: ["Nothing — it's neutral", "Customers pay progressively faster each year", "Revenue will stop growing", "Bad debts are rising"], correct: 1, why: ["It's the opposite of neutral: a frozen balance against rising sales is a strong hidden assumption.", "Flat receivables on rising revenue means DSO falling year after year — you've assumed the business gets better at collecting, which flatters cash flow. Holding the days constant keeps the assumption neutral, which is why working capital is modelled in days.", "The assumption concerns collection speed, not future growth.", "Rising bad debts would push receivables up, not hold them flat."] },
        { q: "FCFF is built from EBIT × (1 − tax) rather than PAT because…", opts: ["It's simpler to compute", "It measures the business before financing, so value doesn't change with the debt mix", "PAT excludes depreciation", "Tax rules require it"], correct: 1, why: ["It's actually more work — you deliberately recompute tax as if there were no debt.", "PAT is struck after interest, so a borrower would look less valuable purely for having borrowed. FCFF values the business itself; debt is handled separately by subtracting net debt from enterprise value.", "PAT is after depreciation, which is why the add-back is its own line in the build.", "This is a valuation convention, not a tax rule."] },
        { q: "EBIT ₹4,32,000, tax 25%, depreciation ₹2,40,000, capex ₹2,40,000, working capital up ₹34,500. FCFF is…", opts: ["₹3,24,000", "₹2,89,500", "₹3,58,500", "₹4,32,000"], correct: 1, why: ["That's NOPAT, before the depreciation, capex and working-capital adjustments.", "NOPAT ₹3,24,000, plus depreciation ₹2,40,000, minus capex ₹2,40,000 (they cancel), minus ₹34,500 of working capital = ₹2,89,500.", "That adds the working-capital movement instead of subtracting it — growth ties cash up.", "That's EBIT before tax and before any of the cash adjustments."] },
        { q: "In a terminal value using Gordon growth, the growth rate g must be…", opts: ["Higher than the WACC", "Below the WACC, and no higher than long-run economic growth", "Equal to the forecast-period growth rate", "Zero"], correct: 1, why: ["If g exceeded the WACC the formula would return a negative or infinite value — it breaks down entirely.", "The denominator (WACC − g) requires g < WACC, and economic sense requires g to be modest: a business growing faster than the economy forever would eventually become the economy. 3–5% is the usual range.", "Forecast-period growth is usually much higher — it reflects a specific growth phase that can't continue indefinitely.", "Zero is permissible but unnecessarily conservative; modest perpetual growth is standard."] },
        { q: "Most of a DCF's value typically comes from the terminal value. This means…", opts: ["The forecast years don't matter", "The answer is highly sensitive to assumptions about the distant future", "The model is wrong", "You should use a shorter forecast"], correct: 1, why: ["They matter — they set the base the terminal value is calculated from.", "When most of the value rests on one formula and one long-run growth assumption, small changes in that assumption move the answer a lot. This is why a DCF should be presented as a range with its assumptions stated, never as a single confident figure.", "It's a structural feature of the method, not an error.", "A shorter forecast would increase the terminal value's share, not reduce it."] }
      ]

  /* ---------------- renderer ---------------- */
  LS.renderQuiz = function (code, content) {
    var quiz = LS.quizzes[code];
    var ui = LS.ui, el = ui.el, esc = ui.esc;
    if (!quiz) { location.hash = "#/"; return; }
    ui.setMeta("Quiz · " + code + " " + quiz.title + " · LedgerSchool",
      "Five questions on module " + code + ", " + quiz.title + ", with explanations for every option.");

    var page = el("div", "page");
    page.appendChild(el("p", "lesson-kicker",
      '<a href="#/module/' + code + '" style="text-decoration:none">' + code + " · " + esc(quiz.title) + "</a>"));
    page.appendChild(el("h1", null, "Module quiz"));
    page.appendChild(el("p", "lesson-lede",
      "Five questions. Pick an answer to see why it's right or wrong — you can change your mind, but your first pick is what's scored."));

    var answers = {}, firstPick = {};
    var scoreBox = el("p", "quiz-score", "Answered 0 of 5");
    scoreBox.setAttribute("aria-live", "polite");
    page.appendChild(scoreBox);

    function refreshScore() {
      var answered = Object.keys(firstPick).length;
      var right = Object.keys(firstPick).filter(function (k) { return firstPick[k]; }).length;
      if (answered < quiz.questions.length) {
        scoreBox.textContent = "Answered " + answered + " of " + quiz.questions.length;
      } else {
        scoreBox.textContent = "Score: " + right + " / " + quiz.questions.length + " — " +
          (right === 5 ? "every one right." :
           right >= 4 ? "solid." :
           right >= 3 ? "worth a re-read of the ones you missed." :
                        "go back through the module; the explanations above show where it went sideways.");
        LS.store.quiz(code, right);
        ui.buildSidebar();
      }
    }

    quiz.questions.forEach(function (q, qi) {
      var wrap = el("div", "mcq-block");
      wrap.appendChild(el("div", "mcq-tag", "Question " + (qi + 1) + " of " + quiz.questions.length));
      wrap.appendChild(el("p", "mcq-q", q.q));
      var ul = el("ul", "mcq-opts");
      var explain = el("div");
      q.opts.forEach(function (opt, i) {
        var li = el("li");
        var btn = el("button", null, esc(opt));
        btn.type = "button";
        btn.addEventListener("click", function () {
          var right = i === q.correct;
          if (!(qi in firstPick)) firstPick[qi] = right;
          answers[qi] = i;
          Array.prototype.forEach.call(ul.querySelectorAll("button"), function (x) {
            x.classList.remove("picked-wrong", "picked-right");
          });
          btn.classList.add(right ? "picked-right" : "picked-wrong");
          explain.innerHTML = "";
          var box = el("div", "mcq-explain" + (right ? "" : " wrong"));
          box.innerHTML = "<p><strong>" + (right ? "Correct." : "Not quite.") + "</strong> " + q.why[i] + "</p>";
          if (!right) {
            box.innerHTML += "<p><strong>The answer is “" + esc(q.opts[q.correct]) + "”:</strong> " + q.why[q.correct] + "</p>";
          }
          explain.appendChild(box);
          refreshScore();
        });
        li.appendChild(btn);
        ul.appendChild(li);
      });
      wrap.appendChild(ul);
      wrap.appendChild(explain);
      page.appendChild(wrap);
    });

    var back = el("a", "btn btn-ghost", "← Back to module " + code);
    back.href = "#/module/" + code;
    page.appendChild(back);

    content.innerHTML = "";
    content.appendChild(page);
  };
})();

</script>
<script>
/* js/reference.js */
/* Reference: a page per statement with every line item defined, plus a

(function () {

        {
          heading: "Current liabilities",
          lines: [
            line("Trade payables", "Amounts owed to suppliers for goods or services already received, typically due within 30–60 days. The mirror image of trade receivables, and effectively an interest-free loan from your suppliers.", "1210-payables"),
            line("Accrued expenses", "Costs that belong to this period but haven't been billed or paid yet, such as March salaries paid on 5 April. The expense is recognised now and the unpaid amount sits here until cash leaves.", "1210-payables")

        },

            line("Property, plant & equipment (net)", "Gross cost minus accumulated depreciation — the portion of the original cost not yet charged to the income statement. It is not an estimate of resale value.", "1120-depreciation"),
            line("Security deposit", "A refundable amount lodged with the landlord, returned only when the lease ends. It is the business's money, but non-current because it can't be accessed within twelve months.", "1150-cash-deposit")

<script>
/* js/sharecard.js */
/* The share card: a canvas-drawn PNG the learner can download once the
   balance sheet capstone ties. Drawn entirely in code — no image assets,
   no network, nothing to host. */
(function () {
  "use strict";
  var LS = (window.LS = window.LS || {});

  var PAPER = "#FBF9F3", INK = "#182530", GREEN = "#1E6B4E", LINE = "#DCD3BE";

  function draw(canvas, opts) {
    var W = 1200, H = 630;
    canvas.width = W; canvas.height = H;
    var g = canvas.getContext("2d");

    // paper with ledger rules
    g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
    g.strokeStyle = "#EFE9DA"; g.lineWidth = 1;
    for (var y = 90; y < H; y += 34) {
      g.beginPath(); g.moveTo(60, y + 0.5); g.lineTo(W - 60, y + 0.5); g.stroke();
    }
    // green spine
    g.fillStyle = GREEN; g.fillRect(0, 0, 14, H);

    // brand
    g.fillStyle = INK;
    g.font = "600 30px Georgia, 'Times New Roman', serif";
    g.fillText("LedgerSchool", 64, 84);
    g.fillStyle = "#8A959D";
    g.font = "18px system-ui, -apple-system, sans-serif";
    g.fillText("learn finance by building it", 254, 84);

    // headline
    g.fillStyle = INK;
    g.font = "700 62px Georgia, 'Times New Roman', serif";
    g.fillText("I made the balance", 64, 210);
    g.fillText("sheet tie", 64, 282);
    // green check
    g.strokeStyle = GREEN; g.lineWidth = 11; g.lineCap = "round"; g.lineJoin = "round";
    g.beginPath(); g.moveTo(325, 268); g.lineTo(355, 297); g.lineTo(415, 228); g.stroke();

    // the ledger box
    var bx = 64, by = 330, bw = W - 128, bh = 210;
    g.fillStyle = "#FFFFFF"; g.fillRect(bx, by, bw, bh);
    g.strokeStyle = LINE; g.lineWidth = 2; g.strokeRect(bx + 1, by + 1, bw - 2, bh - 2);

    g.font = "600 22px 'IBM Plex Mono', ui-monospace, monospace";
    g.fillStyle = "#51606B";
    g.fillText("Bombay Bean Coffee Co. · as at 31 March 2025", bx + 28, by + 44);

    var rows = [
      ["Total assets", opts.total],
      ["Total equity & liabilities", opts.total]
    ];
    g.font = "26px 'IBM Plex Mono', ui-monospace, monospace";
    rows.forEach(function (r, i) {
      var ry = by + 92 + i * 40;
      g.fillStyle = INK;
      g.fillText(r[0], bx + 28, ry);
      var w = g.measureText(r[1]).width;
      g.fillText(r[1], bx + bw - 28 - w, ry);
    });

    // the zero that makes the whole thing worth sharing
    g.strokeStyle = INK; g.lineWidth = 2;
    g.beginPath(); g.moveTo(bx + bw - 300, by + 156); g.lineTo(bx + bw - 28, by + 156); g.stroke();

    g.fillStyle = GREEN;
    g.font = "700 30px 'IBM Plex Mono', ui-monospace, monospace";
    var diff = "difference  " + opts.diff;
    var dw = g.measureText(diff).width;
    g.fillText(diff, bx + bw - 28 - dw, by + 192);

    // footer
    g.fillStyle = "#8A959D";
    g.font = "20px system-ui, -apple-system, sans-serif";
    g.fillText("Free · no sign-up · no videos", 64, H - 42);
    return canvas;
  }

  /* Called by the lesson renderer for any lesson with share:true.
     `done` is true once every sandbox in the lesson passes its checks. */
  LS.shareCard = function (lesson, done) {
    var ui = LS.ui, el = ui.el;
    var wrap = el("div", "share-box");

    var heading = el("h2", null, "Your share card");
    wrap.appendChild(heading);
    var blurb = el("p", null, done
      ? "You tied the balance sheet. Here's a card to prove it — download it, keep it, post it."
      : "Get every check on the capstone above to pass, then come back: a downloadable card appears here.");
    wrap.appendChild(blurb);

    if (!done) return wrap;

    var canvas = document.createElement("canvas");
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label",
      "Share card reading: I made the balance sheet tie. Bombay Bean Coffee Co. as at 31 March 2025, total assets and total equity and liabilities both " +
      LS.fmt.inr(LS.C.fy25.bs.totalAssets) + ", difference zero.");
    draw(canvas, { total: LS.fmt.inr(LS.C.fy25.bs.totalAssets), diff: LS.fmt.inr(0) });
    wrap.appendChild(canvas);

    var bar = el("p");
    var btn = el("button", "btn btn-primary", "Download the PNG");
    btn.type = "button";
    btn.addEventListener("click", function () {
      try {
        var a = document.createElement("a");
        a.download = "ledgerschool-balance-sheet-ties.png";
        a.href = canvas.toDataURL("image/png");
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (e) {
        btn.textContent = "Right-click the card and choose “Save image as…”";
      }
    });
    bar.appendChild(btn);
    wrap.appendChild(bar);
    return wrap;
  };
})();

</script>
<script>
/* js/app.js */
/* LedgerSchool app: hash router, sidebar, progress store, lesson renderer.
   Adding a lesson = one object in a module file + one manifest entry;
   nothing in this file changes per lesson. */
(function () {
  "use strict";
  var LS = (window.LS = window.LS || {});
  var fmt = LS.fmt;

  /* ================= progress store (localStorage, degrades to memory) ================= */
  var store = (function () {
    var KEY = "ledgerschool-progress-v1";
    var mem = null;
    function load() {
      if (mem) return mem;
      try { mem = JSON.parse(localStorage.getItem(KEY) || "{}"); }
      catch (e) { mem = {}; }
      return mem;
    }
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* memory-only */ }
    }
    return {
      lesson: function (id) {
        var all = load();
        if (!all[id]) all[id] = { items: {}, sheets: {} };
        if (!all[id].items) all[id].items = {};
        if (!all[id].sheets) all[id].sheets = {};
        return all[id];
      },
      markItem: function (lessonId, itemId) {
        this.lesson(lessonId).items[itemId] = true;
        save();
      },
      saveCell: function (lessonId, sheetId, addr, raw) {
        var l = this.lesson(lessonId);
        if (!l.sheets[sheetId]) l.sheets[sheetId] = {};
        l.sheets[sheetId][addr] = raw;
        save();
      },
      clearSheet: function (lessonId, sheetId) {
        var l = this.lesson(lessonId);
        delete l.sheets[sheetId];
        save();
      },
      quiz: function (code, score) {
        var l = this.lesson("quiz-" + code);
        if (score != null) { l.items.score = score; save(); }
        return l.items.score;
      },
      isDone: function (lessonId) {
        var lesson = LS.lessons[lessonId];
        if (!lesson) return false;
        var need = requiredItems(lesson);
        if (!need.length) return false;
        var have = this.lesson(lessonId).items;
        return need.every(function (id) { return have[id]; });
      }
    };

  // Have all this lesson's sandboxes been solved? The share card hangs off
  // this rather than off whole-lesson completion: the card celebrates the
  // sheet tying, not the MCQ underneath it.
  function sheetsDone(lesson) {
    var ids = [];
    (lesson.body || []).forEach(function (b, i) {
      if (b.t === "sheet") ids.push(b.sheet.id || "sheet" + i);
    });
    if (!ids.length) return false;

    var ids = [];

  /* ================= sheet keyboard + fill-right ================= */
  // Arrows move between editable cells, Enter commits and drops down,
  // Esc restores the cell's previous contents.
  LS.sheetKeys = function (e, input, sheet, inputs, commit) {
    var here = LS.cellAddr.parseAddr(input.dataset.addr);
    if (!here) return;
    function go(dc, dr) {
      // walk until we find an editable cell (skips labels and locked numbers)
      for (var i = 1; i <= 40; i++) {
        var a = LS.cellAddr.addr(here.c + dc * i, here.r + dr * i);
        if (inputs[a]) { commit(input); inputs[a].focus(); return true; }
        if (here.c + dc * i < 1 || here.r + dr * i < 1) return false;
      }
      return false;
    }
    var k = e.key;
    if (k === "Enter") { e.preventDefault(); if (!go(0, 1)) { commit(input); input.blur(); } return; }
    if (k === "Escape") {
      e.preventDefault();
      input.value = sheet.raw(input.dataset.addr);
      input.select();
      return;
    }
    // let the caret move inside a cell that's being edited
    var atStart = input.selectionStart === 0 && input.selectionEnd === 0;
    var atEnd = input.selectionStart === input.value.length && input.selectionEnd === input.value.length;
    if (k === "ArrowDown") { e.preventDefault(); go(0, 1); }
    else if (k === "ArrowUp") { e.preventDefault(); go(0, -1); }
    else if (k === "ArrowRight" && (atEnd || !input.value)) { e.preventDefault(); go(1, 0); }
    else if (k === "ArrowLeft" && (atStart || !input.value)) { e.preventDefault(); go(-1, 0); }
  };

  // "Copy formula right" — the button that teaches what fill-right does.
  LS.copyRight = function (sheet, from, inputs) {
    var raw = sheet.raw(from);
    if (!raw || raw.charAt(0) !== "=") return null;
    var here = LS.cellAddr.parseAddr(from);
    var to = LS.cellAddr.addr(here.c + 1, here.r);
    if (!inputs[to]) return { addr: to, raw: raw, note: to + " isn't an editable cell — nothing to copy into." , skipped: true };
    var shifted = LS.shiftFormula(raw, 1);
    sheet.setRaw(to, shifted);
    inputs[to].value = shifted;
    return { addr: to, raw: shifted, note: from + " " + raw + "  →  " + to + " " + shifted + " (every column letter moved one across)" };
  };

  /* ================= the spreadsheet ================= */
  function renderSheet(cfg, ctx, itemId) {
    var sheet = new LS.Sheet(cfg);
    // restore saved work
    if (ctx) {
      var saved = store.lesson(ctx.lessonId).sheets[itemId] || {};
      Object.keys(saved).forEach(function (a) { sheet.setRaw(a, saved[a]); });
    }

    var block = el("section", "sheet-block");
    var head = el("div", "sheet-head");
    head.appendChild(el("span", "sheet-tag", "Build it"));
    head.appendChild(el("span", "sheet-title", esc(cfg.title || "Sandbox")));
    block.appendChild(head);
    if (cfg.hint) block.appendChild(el("p", "sheet-hint", cfg.hint));

    var fbar = el("div", "formula-bar");
    var fbAddr = el("span", "fb-addr", "—");
    var fbRaw = el("span", null, "");
    fbar.appendChild(fbAddr); fbar.appendChild(fbRaw);
    block.appendChild(fbar);

    var scroll = el("div", "sheet-scroll");
    var table = el("table", "sheet");
    table.setAttribute("role", "grid");
    var inputs = {}; // addr -> input element
    var selected = null;

    // header row: corner + A B C ...
    var thr = el("tr");
    thr.appendChild(el("th", null, ""));
    for (var c = 1; c <= sheet.cols; c++) thr.appendChild(el("th", null, LS.cellAddr.numToCol(c)));
    var thead = el("thead"); thead.appendChild(thr); table.appendChild(thead);

    var tbody = el("tbody");
    for (var r = 1; r <= sheet.rows; r++) {
      var tr = el("tr");
      tr.appendChild(el("td", "rowhead", String(r)));
      for (var c2 = 1; c2 <= sheet.cols; c2++) {
        var a = LS.cellAddr.addr(c2, r);
        var cell = sheet.cell(a);
        var td = el("td");
        if (!cell) { td.className = "label-cell"; td.appendChild(el("span", "cell-static", "")); }
        else if (cell.ro) {
          if (cell.year) td.className = "year-cell";
          else if (cell.label) td.className = "label-cell";
          else td.className = "num-cell";
          td.appendChild(el("span", "cell-static", displayOf(sheet, a)));
        } else {
          var input = document.createElement("input");
          input.className = "cell-input";
          input.type = "text";
          input.autocomplete = "off";
          input.spellcheck = false;
          input.setAttribute("aria-label", "Cell " + a + rowContext(sheet, r));
          if (cell.ph) input.placeholder = cell.ph;
          input.dataset.addr = a;
          input.value = displayOf(sheet, a);
          bindCellEvents(input, td);
          inputs[a] = input;
          td.appendChild(input);
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    scroll.appendChild(table);
    block.appendChild(scroll);

    function rowContext(sheet, r) {
      var lbl = sheet.value("A" + r);
      return typeof lbl === "string" && lbl ? ", " + lbl : "";
    }
    function displayOf(sheet, a) {
      var v = sheet.value(a);
      if (v == null) return "";
      if (v && v.err) return v.err;
      var cell = sheet.cell(a);
      return fmt.cell(v, cell && cell.fmt);
    }
    function refreshDisplays() {
      Object.keys(inputs).forEach(function (a) {
        var input = inputs[a];
        if (document.activeElement === input) return;
        input.value = displayOf(sheet, a);
        var v = sheet.value(a);
        input.classList.toggle("cell-error", !!(v && v.err));
      });
      updateTie();
    }
    function commit(input) {
      var a = input.dataset.addr;
      var raw = input.value.trim();
      // if the user re-focused and saw the formatted value, don't treat re-blur as an edit
      if (raw === displayOf(sheet, a) && !input.dataset.dirty) return;
      sheet.setRaw(a, raw);
      if (ctx) store.saveCell(ctx.lessonId, itemId, a, raw);
      delete input.dataset.dirty;
      refreshDisplays();
      fbRaw.textContent = sheet.raw(a);
    }
    function bindCellEvents(input, td) {
      input.addEventListener("focus", function () {
        selected = input.dataset.addr;
        // Swap the pretty display for the editable raw text — but only if the
        // box still shows the display. Anything else means an edit is already
        // in flight and must not be clobbered.
        if (input.value === displayOf(sheet, selected)) {
          input.value = sheet.raw(selected);
          // Select it, so typing replaces the cell like a spreadsheet does.
          // A mouse click collapses this to a caret on mouseup, which is what
          // someone editing an existing formula wants.
          input.select();
        }
        fbAddr.textContent = selected;
        fbRaw.textContent = sheet.raw(selected);
        Array.prototype.forEach.call(tbody.querySelectorAll("td.cell-selected"), function (x) { x.classList.remove("cell-selected"); });
        td.classList.add("cell-selected");
      });
      input.addEventListener("input", function () { input.dataset.dirty = "1"; fbRaw.textContent = input.value; });
      input.addEventListener("blur", function () { commit(input); input.value = displayOf(sheet, input.dataset.addr); });
      input.addEventListener("keydown", function (e) { if (LS.sheetKeys) LS.sheetKeys(e, input, sheet, inputs, commit); });
    }

    /* tie meter — one pair, or one row per projected year */
    var tieBox = null;
    function tiePairs() {
      if (!cfg.tie) return [];
      return cfg.tie.pairs || [{ a: cfg.tie.a, le: cfg.tie.le, label: null }];
    }
    function updateTie() {
      if (!cfg.tie || !tieBox) return;
      var pairs = tiePairs(), multi = !!cfg.tie.pairs;
      tieBox.innerHTML = "";
      var tiedCount = 0, live = 0;
      pairs.forEach(function (pr) {
        var A = sheet.value(pr.a), L = sheet.value(pr.le);
        var an = typeof A === "number" ? A : null, ln = typeof L === "number" ? L : null;
        var diff = (an != null && ln != null) ? an - ln : null;
        if (an != null && ln != null) live++;
        if (diff === 0 && an !== 0) tiedCount++;
        if (multi) {
          var row = el("div", "tie-row");
          row.appendChild(el("span", null, esc(pr.label || pr.a)));
          row.appendChild(el("span", null, diff == null ? "—" : (diff === 0 ? "ties ✓" : fmt.inr(diff) + " out")));
          tieBox.appendChild(row);
        } else {
          var r1 = el("div", "tie-row");
          r1.appendChild(el("span", null, esc(cfg.tie.aLabel || "Total assets")));
          r1.appendChild(el("span", null, an != null ? fmt.inr(an) : "—"));
          var r2 = el("div", "tie-row");
          r2.appendChild(el("span", null, esc(cfg.tie.leLabel || "Total liabilities + equity")));
          r2.appendChild(el("span", null, ln != null ? fmt.inr(ln) : "—"));
          tieBox.appendChild(r1); tieBox.appendChild(r2);
          var v1 = el("div", "tie-verdict");
          v1.appendChild(el("span", null, diff === 0 && an !== 0 ? "It ties ✓" : "Difference A − (L+E)"));
          v1.appendChild(el("span", "tie-badge", diff == null ? "—" : fmt.inr(diff)));
          tieBox.appendChild(v1);
        }
      });
      var allTied = tiedCount === pairs.length;
      if (multi) {
        var v = el("div", "tie-verdict");
        v.appendChild(el("span", null, allTied ? "Every year ties ✓" : "Years tying"));
        v.appendChild(el("span", "tie-badge", tiedCount + " / " + pairs.length));
        tieBox.appendChild(v);
      }
      tieBox.className = "tie-meter " + (allTied ? "tied" : "untied");
    }
    if (cfg.tie) {
      tieBox = el("div", "tie-meter untied");
      tieBox.setAttribute("aria-live", "polite");
      block.appendChild(tieBox);
      updateTie();
    }

    /* toolbar: check + copy-right + reset */
    var bar = el("div", "sheet-toolbar");
    var checkBtn = el("button", "btn btn-primary", "Check my sheet");
    checkBtn.type = "button";
    var resetBtn = el("button", "btn btn-ghost btn-small", "Reset");
    resetBtn.type = "button";
    var msg = el("span", "sheet-msg", "");
    bar.appendChild(checkBtn);
    // only worth offering where there is a column to copy into
    if (LS.copyRight && sheet.cols > 2) {
      var cpBtn = el("button", "btn btn-ghost btn-small", "Copy formula right →");
      cpBtn.type = "button";
      cpBtn.title = "Rewrites the selected cell's formula into the next column — what fill-right does in Excel";
      cpBtn.addEventListener("click", function () {
        if (!selected) { msg.textContent = "Select a formula cell first."; return; }
        var out = LS.copyRight(sheet, selected, inputs);
        if (out && !out.skipped && ctx) store.saveCell(ctx.lessonId, itemId, out.addr, out.raw);
        msg.textContent = out ? out.note : "Select a cell containing a formula, then copy it right.";
        refreshDisplays();
      });
      bar.appendChild(cpBtn);
    }
    bar.appendChild(resetBtn);
    bar.appendChild(msg);
    block.appendChild(bar);

    var results = el("ul", "check-results");
    results.setAttribute("aria-live", "polite");
    block.appendChild(results);

    checkBtn.addEventListener("click", function () {
      // commit any in-progress edit first
      if (document.activeElement && document.activeElement.classList && document.activeElement.classList.contains("cell-input")) {
        commit(document.activeElement);
      }
      var out = sheet.runChecks(cfg.checks || []);
      results.innerHTML = "";
      var allOk = out.length > 0;
      out.forEach(function (r) {
        var li = el("li", r.ok ? "ok" : "bad");
        li.appendChild(el("span", "ck-icon", r.ok ? "✓" : "✗"));
        li.appendChild(el("span", null, r.message + (!r.ok && r.detail ? " — " + esc(r.detail) : "")));
        results.appendChild(li);
        if (!r.ok) allOk = false;
        // colour the checked cell
        if (r.ok !== undefined && cfgCellOf(r, cfg)) {
          var inp = inputs[cfgCellOf(r, cfg)];
          if (inp) { inp.parentElement.classList.toggle("cell-ok", r.ok); inp.parentElement.classList.toggle("cell-bad", !r.ok); }
        }
      });
      if (allOk) {
        var li = el("li", "ok");
        li.appendChild(el("span", "ck-icon", "★"));
        li.appendChild(el("span", null, cfg.success || "All checks pass. On to the next lesson."));
        results.appendChild(li);
        if (ctx) { store.markItem(ctx.lessonId, itemId); buildSidebar(); if (ctx.onItemDone) ctx.onItemDone(); }
      }
    });
    function cfgCellOf(r, cfg) {
      var found = null;
      (cfg.checks || []).forEach(function (ck) { if (ck.message === r.message && ck.cell) found = ck.cell; });
      return found;
    }

    resetBtn.addEventListener("click", function () {
      if (ctx) store.clearSheet(ctx.lessonId, itemId);
      var fresh = renderSheet(cfg, ctx, itemId);
      block.parentNode.replaceChild(fresh, block);
    });

    refreshDisplays();
    return block;
  }

  /* ================= views ================= */
  var content = document.getElementById("main");

  function setMeta(title, desc) {
    document.title = title;
    var m = document.querySelector('meta[name="description"]');
    if (m && desc) m.setAttribute("content", desc);
  }

  function renderHome() {
    setMeta("LedgerSchool — Learn finance by building it",
      "Free, text-only finance school. Learn accounting, the three statements, ratios and modeling by building every number in a live spreadsheet.");
    var page = el("div", "page");
    var hero = el("div", "hero");
    hero.innerHTML =
      "<h1>Learn finance by building it.</h1>" +
      "<p>No videos. No sign-up. Short lessons that end in a live spreadsheet where <em>you</em> type the formula — and the balance sheet has to tie. Follow one café, " + esc(LS.C.name) + ", from its first invoice to a full valuation model.</p>";
    var cta = el("a", "btn btn-primary", "Start with lesson 1010 →");
    cta.href = "#/" + LS.manifest.modules[LS.manifest.levels[0].modules[0]].lessons[0];
    hero.appendChild(cta);
    page.appendChild(hero);

    page.appendChild(el("h2", null, "The syllabus"));
    page.appendChild(el("p", null, "Modules are numbered like a chart of accounts. Work top to bottom; every number you meet later is one you built earlier."));
    var cards = el("div", "module-cards");
    LS.manifest.levels.forEach(function (lv) {
      lv.modules.forEach(function (mc) {
        var m = LS.manifest.modules[mc];
        var prog = moduleProgress(mc);
        var a = el("a", "module-card");
        a.href = "#/module/" + mc;
        a.innerHTML = '<span class="mc-code">' + mc + "</span><h3>" + esc(m.title) + "</h3><p>" + esc(m.blurb) + "</p>" +
          '<div class="progress-track"><div class="progress-fill" style="width:' + (prog.total ? Math.round(prog.done / prog.total * 100) : 0) + '%"></div></div>' +
          '<div class="mc-meta"><span>' + prog.done + "/" + prog.total + " lessons</span><span>~" + moduleMinutes(mc) + " min</span></div>";
        cards.appendChild(a);
      });
    });
    page.appendChild(cards);

    if (LS.reference) {
      page.appendChild(el("h2", null, "Reference"));
      page.appendChild(el("p", null, "Look things up without hunting through lessons: every statement line defined in two sentences, and every formula in the course on one page."));
      var refCards = el("div", "module-cards");
      Object.keys(LS.reference).forEach(function (rid) {
        var r = LS.reference[rid];
        var a = el("a", "module-card");
        a.href = "#/ref/" + rid;
        a.innerHTML = '<span class="mc-code">§</span><h3>' + esc(r.title) + "</h3><p>" + esc(r.lede) + "</p>";
        refCards.appendChild(a);
      });
      page.appendChild(refCards);
    }

    page.appendChild(el("h2", null, "How it works"));
    page.appendChild(el("p", null, "Every lesson takes three to eight minutes: a definition, a formula, the café's real numbers, then a spreadsheet where you build the figure yourself. The sandbox checks your work and — where the point of the lesson is the formula — refuses to accept a hardcoded number. Progress is saved in your browser; nothing is sent anywhere, and there is no account to make."));

    content.innerHTML = "";
    content.appendChild(page);
  }

  function renderModule(code) {
    var m = LS.manifest.modules[code];
    if (!m) return renderHome();
    setMeta(code + " " + m.title + " · LedgerSchool", m.blurb);
    var page = el("div", "page");
    page.appendChild(el("p", "lesson-kicker", "Module " + code));
    page.appendChild(el("h1", null, esc(m.title)));
    page.appendChild(el("p", "lesson-lede", esc(m.blurb)));
    var prog = moduleProgress(code);
    var track = el("div", "progress-track");
    track.appendChild(el("div", "progress-fill")).style.width = (prog.total ? Math.round(prog.done / prog.total * 100) : 0) + "%";
    page.appendChild(track);
    page.appendChild(el("p", "sheet-msg", prog.done + " of " + prog.total + " lessons done · about " + moduleMinutes(code) + " minutes of reading & building"));
    var ul = el("ul", "lesson-list");
    m.lessons.forEach(function (id) {
      var lesson = LS.lessons[id];
      var li = el("li"), a = el("a");
      a.href = "#/" + id;
      a.innerHTML = '<span class="ll-code">' + lesson.code + "</span><span>" + esc(lesson.title) + "</span>" +
        (store.isDone(id) ? '<span class="ll-done">✓</span>' : "") +
        '<span class="ll-min">' + (lesson.minutes || 4) + " min</span>";
      li.appendChild(a);
      ul.appendChild(li);
    });
    page.appendChild(ul);
    if (LS.quizzes && LS.quizzes[code]) {
      var qa = el("a", "btn btn-ghost", "Take the module quiz →");
      qa.href = "#/quiz/" + code;
      page.appendChild(qa);
    }
    content.innerHTML = "";
    content.appendChild(page);
  }

  function renderLesson(id) {
    var lesson = LS.lessons[id];
    if (!lesson) return renderHome();
    setMeta(lesson.code + " " + lesson.title + " · LedgerSchool", lesson.desc || lesson.lede || "");
    var ctx = { lessonId: id, onItemDone: null };
    var page = el("div", "page");
    var mc = moduleOf(id);
    page.appendChild(el("p", "lesson-kicker",
      '<a href="#/module/' + mc + '" style="text-decoration:none">' + mc + " · " + esc(LS.manifest.modules[mc].title) + "</a>" +
      ' <span class="kicker-min">· ' + (lesson.minutes || 4) + " min</span>"));
    page.appendChild(el("h1", null, esc(lesson.title)));
    if (lesson.lede) page.appendChild(el("p", "lesson-lede", lesson.lede));

    (lesson.body || []).forEach(function (b, i) {
      var fn = blockRenderers[b.t];
      if (fn) page.appendChild(fn(b, ctx, i));
    });

    // share card — appears as soon as the capstone's checks all pass
    if (LS.shareCard && lesson.share) {
      var card = LS.shareCard(lesson, sheetsDone(lesson));
      page.appendChild(card);
      ctx.onItemDone = function () {
        var fresh = LS.shareCard(lesson, sheetsDone(lesson));
        if (card.parentNode) card.parentNode.replaceChild(fresh, card);
        card = fresh;
      };
    }

    // prev/next
    var order = allLessonIdsInOrder();
    var at = order.indexOf(id);
    var nav = el("div", "lesson-nav");
    var prev = el("span"), next = el("span");
    if (at > 0) {
      var p = LS.lessons[order[at - 1]];
      prev.innerHTML = '<a href="#/' + order[at - 1] + '"><span class="nav-label">← Previous</span>' + p.code + " " + esc(p.short || p.title) + "</a>";
    }
    if (at >= 0 && at < order.length - 1) {
      var n = LS.lessons[order[at + 1]];
      next.innerHTML = '<a href="#/' + order[at + 1] + '" style="text-align:right;display:block"><span class="nav-label">Next →</span>' + n.code + " " + esc(n.short || n.title) + "</a>";
    }
    nav.appendChild(prev); nav.appendChild(next);
    page.appendChild(nav);

    content.innerHTML = "";
    content.appendChild(page);
  }

  /* ================= router ================= */
  function currentRoute() {
    var h = location.hash.replace(/^#\/?/, "");
    if (!h) return { kind: "home" };
    var parts = h.split("/");
    if (parts[0] === "module" && parts[1]) return { kind: "module", id: parts[1] };
    if (parts[0] === "quiz" && parts[1]) return { kind: "quiz", id: parts[1] };
    if (parts[0] === "ref" && parts[1]) return { kind: "ref", id: parts[1] };
    return { kind: "lesson", id: parts[0] };
  }

  function route() {
    var r = currentRoute();
    if (r.kind === "module") renderModule(r.id);
    else if (r.kind === "quiz" && LS.renderQuiz) LS.renderQuiz(r.id, content);
    else if (r.kind === "ref" && LS.renderRef) LS.renderRef(r.id, content);
    else if (r.kind === "lesson" && LS.lessons[r.id]) renderLesson(r.id);
    else renderHome();
    buildSidebar();
    closeNav();
    content.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  /* mobile nav */
  var sidebar = document.getElementById("sidebar");
  var scrim = document.getElementById("sidebarScrim");
  var toggle = document.getElementById("navToggle");
  function closeNav() {
    sidebar.classList.remove("open");
    scrim.hidden = true;
    toggle.setAttribute("aria-expanded", "false");
  }
  toggle.addEventListener("click", function () {
    var open = sidebar.classList.toggle("open");
    scrim.hidden = !open;
    toggle.setAttribute("aria-expanded", String(open));
    if (open) {
      var first = sidebar.querySelector("a");
      if (first) first.focus();
    }
  });
  scrim.addEventListener("click", closeNav);
  // Escape closes the mobile syllabus and returns focus to the toggle, so
  // keyboard users aren't stranded inside it.
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && sidebar.classList.contains("open")) {
      closeNav();
      toggle.focus();
    }
  });

  window.addEventListener("hashchange", route);
  // expose bits the LX layer (quizzes/reference/share) reuses
  LS.ui = { el: el, esc: esc, renderMCQ: renderMCQ, buildSidebar: buildSidebar, setMeta: setMeta, moduleProgress: moduleProgress };
  route();
})();

</script>
</body>
</html>
