<style>
/* ============================================================
   LedgerSchool — design system
   Ledger-paper palette:
   paper #FBF9F3 · ink #182530 · ledger green #1E6B4E · debit red #B23A2F
   Fraunces (display) · Public Sans (body) · IBM Plex Mono (cells)
   ============================================================ */

:root {
  --paper: #FBF9F3;
  --paper-2: #F4EFE3;        /* card / zebra tint */
  --paper-3: #ECE5D3;        /* deeper tint, table heads */
  --ink: #182530;
  --ink-soft: #51606B;
  /* ink-faint and amber are darker than a purely decorative choice would be:
     both carry real text (durations, counts, the example-card tag), so both
     clear 4.5:1 against paper, paper-2 and paper-3. */
  --ink-faint: #5E6870;
  --green: #1E6B4E;
  --green-soft: #E3EEE8;
  --red: #B23A2F;
  --red-soft: #F6E4E1;
  --line: #DCD3BE;
  --line-soft: #EAE3D2;
  --amber: #8E6417;

  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Public Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --sidebar-w: 288px;
  --content-max: 760px;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(24, 37, 48, 0.06), 0 4px 14px rgba(24, 37, 48, 0.05);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* ---------- a11y helpers ---------- */
.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--ink);
  color: var(--paper);
  padding: 0.6rem 1rem;
  z-index: 100;
  border-radius: 0 0 var(--radius) 0;
}
.skip-link:focus { left: 0; }

:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ---------- top bar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 0.9rem;
  padding: 0.55rem 1.1rem;
  background: var(--ink);
  color: var(--paper);
  border-bottom: 3px solid var(--green);
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  color: var(--paper);
  text-decoration: none;
}
.brand-mark { color: #6FBF9A; flex: none; }
.brand-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.25rem;
  letter-spacing: 0.01em;
}
.brand-name em { font-style: normal; color: #6FBF9A; }
.topbar-tag {
  margin-left: auto;
  font-size: 0.8rem;
  color: #AEB9C0;
  letter-spacing: 0.02em;
}
.nav-toggle {
  display: none;
  background: none;
  border: 1px solid #3D4C58;
  color: var(--paper);
  font-size: 1.05rem;
  line-height: 1;
  padding: 0.4rem 0.6rem;
  border-radius: 6px;
  cursor: pointer;
}

/* ---------- layout ---------- */
.layout {
  display: flex;
  min-height: calc(100vh - 56px);
}

.sidebar {
  width: var(--sidebar-w);
  flex: none;
  border-right: 1px solid var(--line);
  background: var(--paper);
  padding: 1.1rem 0 3rem;
  overflow-y: auto;
  position: sticky;
  top: 56px;
  height: calc(100vh - 56px);
  font-size: 0.92rem;
}

.content {
  flex: 1;
  min-width: 0;
  padding: 2.2rem 1.4rem 4rem;
}
.content > .page {
  max-width: var(--content-max);
  margin: 0 auto;
}
.content:focus { outline: none; }

/* ---------- sidebar syllabus ---------- */
.side-level {
  margin: 1.4rem 1.1rem 0.5rem;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-faint);
}
.side-module { margin-bottom: 0.35rem; }
.side-module-head {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  width: 100%;
  padding: 0.42rem 1.1rem;
  background: none;
  border: none;
  font: inherit;
  font-weight: 600;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
  text-decoration: none;
}
.side-module-head:hover { background: var(--paper-2); }
.side-code {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--green);
  font-weight: 600;
  flex: none;
  width: 2.6rem;
}
.side-module-head .side-progress {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--ink-faint);
  font-weight: 500;
}
.side-lessons { list-style: none; margin: 0; padding: 0; }
.side-lessons a {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  padding: 0.3rem 1.1rem 0.3rem 1.1rem;
  color: var(--ink-soft);
  text-decoration: none;
  border-left: 3px solid transparent;
}
.side-lessons a:hover { background: var(--paper-2); color: var(--ink); }
.side-lessons a.active {
  border-left-color: var(--green);
  background: var(--green-soft);
  color: var(--ink);
  font-weight: 600;
}
.side-lessons .side-code { color: var(--ink-faint); font-weight: 500; }
.side-lessons a.active .side-code { color: var(--green); }
.side-done {
  margin-left: auto;
  color: var(--green);
  font-size: 0.8rem;
  flex: none;
}
.side-quiz-link a { font-style: italic; }

/* ---------- generic page furniture ---------- */
h1, h2, h3 { font-family: var(--font-display); line-height: 1.25; }
h1 { font-size: 1.9rem; font-weight: 700; margin: 0 0 0.4rem; }
h2 { font-size: 1.35rem; font-weight: 600; margin: 2.2rem 0 0.6rem; }
h3 { font-size: 1.1rem; font-weight: 600; margin: 1.6rem 0 0.5rem; }
p { margin: 0.85rem 0; }
a { color: var(--green); }
strong { font-weight: 700; }

.lesson-kicker {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--green);
  font-weight: 600;
  letter-spacing: 0.04em;
  margin-bottom: 0.2rem;
}
.lesson-kicker .kicker-min { color: var(--ink-faint); font-weight: 400; }
.lesson-lede { font-size: 1.08rem; color: var(--ink-soft); margin-top: 0.3rem; }

hr.rule { border: none; border-top: 1px solid var(--line); margin: 2rem 0; }

/* ---------- definition card ---------- */
.def-card {
  background: #fff;
  border: 1px solid var(--line);
  border-left: 5px solid var(--green);
  border-radius: var(--radius);
  padding: 1rem 1.2rem;
  margin: 1.4rem 0;
  box-shadow: var(--shadow);
}
.def-card .def-term {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.05rem;
  margin: 0 0 0.25rem;
}
.def-card p { margin: 0.25rem 0 0; }

/* ---------- formula block (dark) ---------- */
.formula-block {
  background: var(--ink);
  color: #E8EDF0;
  border-radius: var(--radius);
  padding: 0.9rem 1.2rem;
  margin: 1.4rem 0;
  font-family: var(--font-mono);
  font-size: 0.95rem;
  overflow-x: auto;
  box-shadow: var(--shadow);
}
.formula-block .fx-title {
  font-family: var(--font-body);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #6FBF9A;
  margin-bottom: 0.45rem;
}
.formula-block .fx-line { white-space: nowrap; padding: 0.12rem 0; }
.formula-block .fx-line b { color: #8FD4B4; font-weight: 600; }
.formula-block .fx-note {
  font-family: var(--font-body);
  font-size: 0.82rem;
  color: #AEB9C0;
  margin-top: 0.5rem;
  white-space: normal;
}

/* ---------- example card ---------- */
.example-card {
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1rem 1.2rem;
  margin: 1.4rem 0;
}
.example-card .ex-tag {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--amber);
  margin-bottom: 0.4rem;
}
.example-card p { margin: 0.4rem 0; }
.example-card table { margin: 0.6rem 0 0.2rem; }

/* ---------- "where this number goes" ---------- */
.where-box {
  display: flex;
  gap: 0.7rem;
  align-items: baseline;
  background: var(--green-soft);
  border: 1px solid #C7DCD1;
  border-radius: var(--radius);
  padding: 0.75rem 1.1rem;
  margin: 1.4rem 0;
  font-size: 0.95rem;
}
.where-box .where-tag {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--green);
  flex: none;
}
.where-box p { margin: 0; }

.note-box {
  background: #FDF6E8;
  border: 1px solid #EAD9B0;
  border-radius: var(--radius);
  padding: 0.75rem 1.1rem;
  margin: 1.4rem 0;
  font-size: 0.95rem;
}
.note-box p { margin: 0.3rem 0; }

/* ---------- static tables ---------- */
table.ls-table {
  border-collapse: collapse;
  width: 100%;
  font-size: 0.92rem;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.table-wrap { overflow-x: auto; margin: 1.2rem 0; }
table.ls-table th, table.ls-table td {
  padding: 0.45rem 0.8rem;
  border-bottom: 1px solid var(--line-soft);
  text-align: left;
}
table.ls-table th {
  background: var(--paper-3);
  font-size: 0.78rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
table.ls-table td.num, table.ls-table th.num {
  text-align: right;
  font-family: var(--font-mono);
  font-size: 0.88rem;
  white-space: nowrap;
}
table.ls-table tr.total td {
  border-top: 2px solid var(--ink);
  font-weight: 700;
}

/* ---------- the spreadsheet ---------- */
.sheet-block {
  margin: 1.6rem 0;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.sheet-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.3rem 0.8rem;
  padding: 0.7rem 1rem 0.6rem;
  background: var(--paper-2);
  border-bottom: 1px solid var(--line);
}
.sheet-title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.02rem;
}
.sheet-tag {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--green);
  border: 1px solid var(--green);
  border-radius: 99px;
  padding: 0.05rem 0.55rem;
}
.sheet-hint { padding: 0.6rem 1rem 0; font-size: 0.92rem; color: var(--ink-soft); margin: 0; }
.sheet-scroll { overflow-x: auto; padding: 0.8rem 1rem 0.4rem; }

table.sheet {
  border-collapse: collapse;
  font-family: var(--font-mono);
  font-size: 0.88rem;
}
table.sheet th {
  background: var(--paper-3);
  color: var(--ink-soft);
  font-weight: 500;
  font-size: 0.72rem;
  padding: 0.25rem 0.55rem;
  border: 1px solid var(--line);
  text-align: center;
  min-width: 2rem;
}
table.sheet td {
  border: 1px solid var(--line);
  padding: 0;
  min-width: 7.2rem;
  height: 2.1rem;
  background: #fff;
}
table.sheet td.rowhead {
  background: var(--paper-3);
  color: var(--ink-soft);
  text-align: center;
  font-size: 0.72rem;
  min-width: 2rem;
  padding: 0.25rem 0.5rem;
}
table.sheet td .cell-static {
  display: block;
  padding: 0.35rem 0.55rem;
  white-space: nowrap;
}
table.sheet td.label-cell { background: var(--paper); }
table.sheet td.label-cell .cell-static { font-family: var(--font-body); font-size: 0.88rem; }
table.sheet td.num-cell .cell-static { text-align: right; }
table.sheet td.year-cell {
  background: var(--paper-3);
}
table.sheet td.year-cell .cell-static {
  font-weight: 600; text-align: right; color: var(--ink);
}
table.sheet input.cell-input {
  width: 100%;
  height: 100%;
  min-height: 2.1rem;
  border: none;
  background: #FFFDF4;
  font: inherit;
  padding: 0.3rem 0.55rem;
  text-align: right;
  color: var(--ink);
}
table.sheet input.cell-input:focus {
  outline: 2px solid var(--green);
  outline-offset: -2px;
  background: #fff;
  text-align: left;
}
table.sheet td.cell-ok input.cell-input { background: var(--green-soft); }
table.sheet td.cell-bad input.cell-input { background: var(--red-soft); }
table.sheet td.cell-selected { outline: 2px solid var(--green); outline-offset: -2px; }
.cell-error { color: var(--red); font-weight: 600; }
.neg { color: var(--red); }

.sheet-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  align-items: center;
  padding: 0.5rem 1rem 0.9rem;
}
.sheet-msg { font-size: 0.85rem; color: var(--ink-soft); margin-left: 0.2rem; }

.formula-bar {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin: 0 1rem;
  padding: 0.3rem 0.6rem;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--paper);
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--ink-soft);
  overflow-x: auto;
  white-space: nowrap;
}
.formula-bar .fb-addr { color: var(--green); font-weight: 600; flex: none; }

/* buttons */
.btn {
  font: inherit;
  font-weight: 600;
  font-size: 0.9rem;
  padding: 0.45rem 1.1rem;
  border-radius: 6px;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--paper);
  cursor: pointer;
}
.btn:hover { background: #24384A; }
.btn-primary { background: var(--green); border-color: var(--green); }
.btn-primary:hover { background: #17553E; }
.btn-ghost {
  background: none;
  color: var(--ink);
  border-color: var(--line);
}
.btn-ghost:hover { background: var(--paper-2); }
.btn-small { font-size: 0.8rem; padding: 0.3rem 0.75rem; }

/* check results */
.check-results { list-style: none; margin: 0; padding: 0 1rem 1rem; }
.check-results li {
  display: flex;
  gap: 0.55rem;
  align-items: baseline;
  padding: 0.3rem 0;
  font-size: 0.92rem;
}
.check-results .ck-icon { flex: none; font-weight: 700; }
.check-results li.ok .ck-icon { color: var(--green); }
.check-results li.bad .ck-icon { color: var(--red); }
.check-results li.ok { color: var(--ink-soft); }

/* ---------- tie meter ---------- */
.tie-meter {
  margin: 0 1rem 1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.8rem 1rem;
  background: var(--paper);
}
.tie-meter .tie-row {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  font-family: var(--font-mono);
  font-size: 0.88rem;
  padding: 0.1rem 0;
}
.tie-meter .tie-verdict {
  margin-top: 0.5rem;
  padding-top: 0.5rem;
  border-top: 2px solid var(--ink);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
  font-weight: 700;
}
.tie-meter.tied .tie-verdict { color: var(--green); }
.tie-meter.untied .tie-verdict { color: var(--red); }
.tie-badge {
  font-family: var(--font-mono);
  font-size: 0.95rem;
}

/* ---------- MCQ ---------- */
.mcq-block {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1rem 1.2rem;
  margin: 1.6rem 0;
  box-shadow: var(--shadow);
}
.mcq-tag {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 0.3rem;
}
.mcq-q { font-weight: 600; margin: 0 0 0.7rem; }
.mcq-opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.45rem; }
.mcq-opts button {
  width: 100%;
  text-align: left;
  font: inherit;
  padding: 0.55rem 0.9rem;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--paper);
  cursor: pointer;
  color: var(--ink);
}
.mcq-opts button:hover { border-color: var(--ink-soft); background: var(--paper-2); }
.mcq-opts button.picked-right { border-color: var(--green); background: var(--green-soft); font-weight: 600; }
.mcq-opts button.picked-wrong { border-color: var(--red); background: var(--red-soft); }
.mcq-opts button:disabled { cursor: default; opacity: 0.85; }
.mcq-explain {
  margin-top: 0.8rem;
  padding: 0.7rem 0.9rem;
  border-radius: 6px;
  font-size: 0.93rem;
  background: var(--paper-2);
  border-left: 4px solid var(--green);
}
.mcq-explain.wrong { border-left-color: var(--red); }
.mcq-explain p { margin: 0.3rem 0; }

/* ---------- classification exercise ---------- */
.classify-block {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1rem 1.2rem;
  margin: 1.6rem 0;
  box-shadow: var(--shadow);
}
.classify-item {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem 0.8rem;
  padding: 0.55rem 0;
  border-bottom: 1px solid var(--line-soft);
}
.classify-item:last-of-type { border-bottom: none; }
.classify-text { flex: 1 1 14rem; }
.classify-btns { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.classify-btns button {
  font: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  padding: 0.25rem 0.7rem;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: var(--paper);
  cursor: pointer;
  color: var(--ink-soft);
}
.classify-btns button:hover { border-color: var(--ink-soft); color: var(--ink); }
.classify-btns button.picked-right { background: var(--green); border-color: var(--green); color: #fff; }
.classify-btns button.picked-wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }
.classify-feedback { flex-basis: 100%; font-size: 0.85rem; color: var(--ink-soft); margin: 0; }

/* ---------- A vs B comparison ---------- */
.compare-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin: 1.4rem 0 0.4rem;
}
.compare-card {
  background: #fff;
  border: 1px solid var(--line);

.module-card {
  display: block;

  border: 1px solid var(--line);
  border-radius: var(--radius);

}

}

  </p>
  <p class="footer-fine">Text and exercises use Indian formats (₹, en-IN grouping); the concepts are global. Not investment or tax advice.</p>

<script>
/* js/engine.js */
/* LedgerSchool spreadsheet engine.
   Dependency-free. Parses "=B2-B3" style formulas with cell refs, ranges,
   functions, cycle detection, and Indian-format numbers.
   Loaded before app.js; exposes LS.Sheet, LS.fmt, LS.cellAddr helpers. */
(function () {
  "use strict";
  var LS = (window.LS = window.LS || {});

  /* ================= number formatting ================= */
  var nfIN0 = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 });
  var nfIN2 = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 2 });

  function group(v, dec) {
    return (dec ? nfIN2 : nfIN0).format(v);
  }

  var fmt = {
    // ₹ with en-IN grouping; negatives in parentheses: (₹1,50,000)
    inr: function (v) {
      if (typeof v !== "number" || isNaN(v)) return "";
      var r = Math.round(v);
      if (r < 0) return "(₹" + group(-r) + ")";
      return "₹" + group(r);
    },
    pct: function (v) {
      if (typeof v !== "number" || isNaN(v)) return "";
      var p = v * 100;
      var s = (Math.round(p * 10) / 10).toFixed(1).replace(/\.0$/, "");
      return (p < 0 ? "(" + s.replace("-", "") + "%)" : s + "%");
    },
    x: function (v) {
      if (typeof v !== "number" || isNaN(v)) return "";
      return String(Math.round(v * 100) / 100) + "x";
    },
    days: function (v) {
      if (typeof v !== "number" || isNaN(v)) return "";
      return group(Math.round(v * 10) / 10, true) + " days";
    },
    plain: function (v) {
      if (typeof v !== "number" || isNaN(v)) return "";
      var neg = v < 0, a = Math.abs(v);
      var s = group(Math.round(a * 100) / 100, a !== Math.round(a));
      return neg ? "(" + s + ")" : s;
    },
    cell: function (v, kind) {
      if (v == null || v === "") return "";
      if (typeof v === "string") return v;
      return (fmt[kind] || fmt.plain)(v);
    }
  };
  LS.fmt = fmt;

  /* ================= addresses ================= */
  function colToNum(s) {
    var n = 0;
    for (var i = 0; i < s.length; i++) n = n * 26 + (s.charCodeAt(i) - 64);
    return n;
  }
  function numToCol(n) {
    var s = "";
    while (n > 0) { var r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
    return s;
  }
  function addr(c, r) { return numToCol(c) + r; }
  function parseAddr(a) {
    var m = /^\$?([A-Z]+)\$?(\d+)$/.exec(a.toUpperCase());
    if (!m) return null;
    return { c: colToNum(m[1]), r: parseInt(m[2], 10) };
  }
  LS.cellAddr = { colToNum: colToNum, numToCol: numToCol, addr: addr, parseAddr: parseAddr };

  /* ================= input parsing =================
     "=B2-B3" -> formula; "1,50,000" / "₹500" / "(500)" / "12%" -> number;
     anything else -> text */
  function parseNumber(str) {
    var s = str.trim();
    if (!s) return null;
    var neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    s = s.replace(/[₹,\s]/g, "");
    if (s.charAt(0) === "-") { neg = !neg; s = s.slice(1); }
    var pct = false;
    if (s.slice(-1) === "%") { pct = true; s = s.slice(0, -1); }
    if (!/^\d*\.?\d+$/.test(s)) return null;
    var v = parseFloat(s);
    if (pct) v = v / 100;
    return neg ? -v : v;
  }
  LS.parseNumber = parseNumber;

  /* ================= formula tokenizer ================= */
  function tokenize(src) {
    var toks = [], i = 0, n = src.length;
    while (i < n) {
      var ch = src[i];
      if (ch === " " || ch === "\t") { i++; continue; }
      if (/[0-9.]/.test(ch)) {
        // No digit grouping inside formulas — a comma is always an argument
        // separator here, exactly as in Excel. ("1,50,000" typed straight into
        // a cell is still parsed with grouping; see parseNumber.)
        var j = i, num = "";
        while (j < n && /[0-9.]/.test(src[j])) { num += src[j]; j++; }
        toks.push({ t: "num", v: parseFloat(num) });
        i = j; continue;
      }
      if (/[A-Za-z$]/.test(ch)) {
        var j2 = i, word = "";
        while (j2 < n && /[A-Za-z0-9$]/.test(src[j2])) { word += src[j2]; j2++; }
        var up = word.toUpperCase();
        if (/^\$?[A-Z]+\$?\d+$/.test(up)) toks.push({ t: "ref", v: up });
        else toks.push({ t: "name", v: up });
        i = j2; continue;
      }
      if (ch === "<" && src[i + 1] === "=") { toks.push({ t: "op", v: "<=" }); i += 2; continue; }
      if (ch === ">" && src[i + 1] === "=") { toks.push({ t: "op", v: ">=" }); i += 2; continue; }
      if (ch === "<" && src[i + 1] === ">") { toks.push({ t: "op", v: "<>" }); i += 2; continue; }
      if ("+-*/^%()=<>:,".indexOf(ch) >= 0) { toks.push({ t: "op", v: ch }); i++; continue; }
      throw { err: "#NAME?", detail: "Unexpected '" + ch + "'" };
    }
    return toks;
  }

  /* ================= parser (recursive descent) =================
     compare := add (("="|"<>"|"<"|">"|"<="|">=") add)?
     add     := mul (("+"|"-") mul)*
     mul     := pow (("*"|"/") pow)*
     pow     := unary ("^" unary)*
     unary   := "-" unary | postfix
     postfix := primary ("%")*
     primary := num | ref | name "(" args ")" | "(" compare ")"        */
  function parse(toks) {
    var pos = 0;
    function peek() { return toks[pos]; }
    function next() { return toks[pos++]; }
    function expectOp(v) {
      var t = next();
      if (!t || t.t !== "op" || t.v !== v) throw { err: "#NAME?", detail: "Expected '" + v + "'" };
    }
    function compare() {
      var l = add(), t = peek();
      if (t && t.t === "op" && ["=", "<>", "<", ">", "<=", ">="].indexOf(t.v) >= 0) {
        next();
        return { t: "cmp", op: t.v, l: l, r: add() };
      }
      return l;
    }
    function add() {
      var l = mul(), t;
      while ((t = peek()) && t.t === "op" && (t.v === "+" || t.v === "-")) { next(); l = { t: "bin", op: t.v, l: l, r: mul() }; }
      return l;
    }
    function mul() {
      var l = pow(), t;
      while ((t = peek()) && t.t === "op" && (t.v === "*" || t.v === "/")) { next(); l = { t: "bin", op: t.v, l: l, r: pow() }; }
      return l;
    }
    function pow() {
      var l = unary(), t;
      while ((t = peek()) && t.t === "op" && t.v === "^") { next(); l = { t: "bin", op: "^", l: l, r: unary() }; }
      return l;
    }
    function unary() {
      var t = peek();
      if (t && t.t === "op" && t.v === "-") { next(); return { t: "neg", x: unary() }; }
      if (t && t.t === "op" && t.v === "+") { next(); return unary(); }
      return postfix();
    }
    function postfix() {
      var x = primary(), t;
      while ((t = peek()) && t.t === "op" && t.v === "%") { next(); x = { t: "pct", x: x }; }
      return x;
    }
    function rangeOrExpr() {
      // a function argument may be a range like B2:B5
      var t = peek();
      if (t && t.t === "ref" && toks[pos + 1] && toks[pos + 1].t === "op" && toks[pos + 1].v === ":") {
        var a = next().v; next();
        var b = next();
        if (!b || b.t !== "ref") throw { err: "#REF!", detail: "Bad range" };
        return { t: "range", a: a, b: b.v };
      }
      return compare();
    }
    function primary() {
      var t = next();
      if (!t) throw { err: "#NAME?", detail: "Formula ended early" };
      if (t.t === "num") return { t: "num", v: t.v };
      if (t.t === "ref") return { t: "ref", v: t.v };
      if (t.t === "name") {
        expectOp("(");
        var args = [];
        if (peek() && !(peek().t === "op" && peek().v === ")")) {
          args.push(rangeOrExpr());
          while (peek() && peek().t === "op" && peek().v === ",") { next(); args.push(rangeOrExpr()); }
        }
        expectOp(")");
        return { t: "call", name: t.v, args: args };
      }
      if (t.t === "op" && t.v === "(") {
        var e = compare();
        expectOp(")");
        return e;
      }
      throw { err: "#NAME?", detail: "Unexpected token" };
    }
    var root = compare();
    if (pos < toks.length) throw { err: "#NAME?", detail: "Unexpected trailing input" };
    return root;
  }

  /* ================= functions ================= */
  function flatten(args, sheet, out) {
    for (var i = 0; i < args.length; i++) {
      var a = args[i];
      if (a && a.range) { for (var j = 0; j < a.range.length; j++) out.push(a.range[j]); }
      else out.push(a);
    }
    return out.filter(function (v) { return typeof v === "number"; });
  }
  var FUNCS = {
    SUM: function (vals) { return vals.reduce(function (a, b) { return a + b; }, 0); },
    AVERAGE: function (vals) {
      if (!vals.length) throw { err: "#DIV/0!" };
      return vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
    },
    MIN: function (vals) {
      if (!vals.length) throw { err: "#VALUE!" };
      return Math.min.apply(null, vals);
    },
    MAX: function (vals) {
      if (!vals.length) throw { err: "#VALUE!" };
      return Math.max.apply(null, vals);
    },
    ABS: function (vals) {
      if (!vals.length) throw { err: "#VALUE!" };
      return Math.abs(vals[0]);
    },
    ROUND: function (vals) {
      if (!vals.length) throw { err: "#VALUE!" };
      var n = vals[0], d = vals.length > 1 ? Math.round(vals[1]) : 0;
      var f = Math.pow(10, d);
      // round half away from zero, like Excel (JS Math.round is half-up)
      return (n < 0 ? -1 : 1) * Math.round(Math.abs(n) * f) / f;
    },
    // IF needs the raw args (a false branch must not be flattened away)
    IF: function (vals, args) {
      if (args.length < 2) throw { err: "#VALUE!" };
      var cond = args[0];
      if (cond && cond.range) cond = cond.range.length ? cond.range[0] : 0;
      var t = args[1], f = args.length > 2 ? args[2] : 0;
      if (t && t.range) t = t.range.length ? t.range[0] : 0;
      if (f && f.range) f = f.range.length ? f.range[0] : 0;
      return cond ? t : f;
    }
  };
  LS.registerFunction = function (name, fn) { FUNCS[name.toUpperCase()] = fn; };
  LS.hasFunction = function (name) { return !!FUNCS[name.toUpperCase()]; };
  LS.functionNames = function () { return Object.keys(FUNCS); };

  /* ================= relative-reference shifting =================
     What Excel's fill-right does: move every relative column letter n columns
     across, leaving $-anchored ones alone. Pure and unit-tested. */
  function shiftFormula(raw, n) {
    if (!raw || raw.charAt(0) !== "=") return raw;
    return raw.replace(/(\$?)([A-Za-z]+)(\$?)(\d+)/g, function (m, cAbs, letters, rAbs, digits) {
      if (cAbs) return m;                       // $B2 — column locked
      var up = letters.toUpperCase();
      if (!/^[A-Z]+$/.test(up)) return m;
      var c = colToNum(up) + n;
      if (c < 1) return "#REF!";
      return numToCol(c) + rAbs + digits;
    });
  }
  LS.shiftFormula = shiftFormula;

  /* ================= Sheet ================= */
  // cfg: { cols: <int>, grid: [ [cell, ...], ... ] }
  // grid cell: string label | number | { v, input, fmt, mf, ph, year }
  function Sheet(cfg) {
    this.cols = cfg.cols || (cfg.grid[0] ? cfg.grid[0].length : 0);
    this.rows = cfg.grid.length;
    this.cells = {}; // addr -> {raw, ro, fmt, mf, label, year, ph}
    for (var r = 0; r < cfg.grid.length; r++) {
      for (var c = 0; c < cfg.grid[r].length; c++) {
        var def = cfg.grid[r][c], a = addr(c + 1, r + 1), cell;
        if (def == null) continue;
        if (typeof def === "string") cell = { raw: def, ro: true, label: true };
        else if (typeof def === "number") cell = { raw: String(def), ro: true, fmt: "inr" };
        else {
          cell = {
            raw: def.v != null ? String(def.v) : "",
            ro: !def.input,
            fmt: def.fmt || (typeof def.v === "string" ? undefined : "inr"),
            mf: !!def.mf, ph: def.ph, year: !!def.year,
            label: typeof def.v === "string" && !def.input
          };
        }
        this.cells[a] = cell;
      }
    }
    this._cache = {};
  }

  Sheet.prototype.cell = function (a) { return this.cells[a]; };
  Sheet.prototype.raw = function (a) { return this.cells[a] ? this.cells[a].raw : ""; };
  Sheet.prototype.setRaw = function (a, str) {
    var cell = this.cells[a];
    if (!cell || cell.ro) return;
    cell.raw = str;
    this._cache = {};
  };
  Sheet.prototype.isFormula = function (a) {
    return this.raw(a).trim().charAt(0) === "=";
  };

  Sheet.prototype.value = function (a) {
    a = a.replace(/\$/g, "");
    if (a in this._cache) return this._cache[a];
    var out = this._value(a, {});
    this._cache[a] = out;
    return out;
  };
  Sheet.prototype._value = function (a, visiting) {
    var cell = this.cells[a];
    if (!cell) return null; // empty/never-defined cell counts as blank
    var raw = (cell.raw || "").trim();
    if (raw === "") return null;
    if (raw.charAt(0) === "=") {
      if (visiting[a]) return { err: "#CYCLE!" };
      visiting[a] = true;
      var out;
      try {
        out = this._eval(parse(tokenize(raw.slice(1))), visiting);
        if (typeof out === "boolean") out = out ? 1 : 0;
        if (typeof out !== "number" || isNaN(out) || !isFinite(out)) out = { err: "#VALUE!" };
      } catch (e) {
        out = { err: e && e.err ? e.err : "#NAME?" };
      }
      delete visiting[a];
      return out;
    }
    var num = parseNumber(raw);
    if (num !== null) return num;
    return raw; // text label
  };
  Sheet.prototype._refValue = function (ref, visiting) {
    var a = ref.replace(/\$/g, "");
    if (!parseAddr(a)) throw { err: "#REF!" };
    var v = this._value(a, visiting);
    if (v && v.err) throw v;
    if (v == null) return 0;           // blank -> 0, like spreadsheets
    if (typeof v === "string") return 0; // text label in arithmetic -> 0
    return v;
  };
  Sheet.prototype._eval = function (node, visiting) {
    var self = this;
    switch (node.t) {
      case "num": return node.v;
      case "ref": return this._refValue(node.v, visiting);
      case "pct": return this._eval(node.x, visiting) / 100;
      case "neg": return -this._eval(node.x, visiting);
      case "bin": {
        var l = this._eval(node.l, visiting), r = this._eval(node.r, visiting);
        switch (node.op) {
          case "+": return l + r;
          case "-": return l - r;
          case "*": return l * r;
          case "/": if (r === 0) throw { err: "#DIV/0!" }; return l / r;
          case "^": return Math.pow(l, r);
        }
        throw { err: "#NAME?" };
      }
      case "cmp": {
        var a = this._eval(node.l, visiting), b = this._eval(node.r, visiting);
        switch (node.op) {
          case "=": return a === b;
          case "<>": return a !== b;
          case "<": return a < b;
          case ">": return a > b;
          case "<=": return a <= b;
          case ">=": return a >= b;
        }
        throw { err: "#NAME?" };
      }
      case "range": throw { err: "#VALUE!", detail: "Range outside a function" };
      case "call": {
        var fn = FUNCS[node.name];
        if (!fn) throw { err: "#NAME?", detail: node.name + " is not a function" };
        var args = node.args.map(function (arg) {
          if (arg.t === "range") {
            var A = parseAddr(arg.a), B = parseAddr(arg.b);
            if (!A || !B) throw { err: "#REF!" };
            var vals = [];
            for (var r = Math.min(A.r, B.r); r <= Math.max(A.r, B.r); r++)
              for (var c = Math.min(A.c, B.c); c <= Math.max(A.c, B.c); c++) {
                var v = self._value(addr(c, r), visiting);
                if (v && v.err) throw v;
                if (typeof v === "number") vals.push(v);
              }
            return { range: vals };
          }
          return self._eval(arg, visiting);
        });
        return fn(flatten(args, this, []), args);
      }
    }
    throw { err: "#NAME?" };
  };

  /* ================= checks =================
     check: { cell, expect, tol?, message, mustFormula?, mustUse? (regex/string on raw) }
          | { custom: function(sheet) -> true | "why it failed", message }   */
  Sheet.prototype.runChecks = function (checks) {
    var self = this;
    return (checks || []).map(function (ck) {
      var res = { message: ck.message || "", ok: false };
      if (ck.custom) {
        var r;
        try { r = ck.custom(self); } catch (e) { r = false; }
        res.ok = r === true;
        if (!res.ok && typeof r === "string") res.detail = r;
        return res;
      }
      var cellDef = self.cells[ck.cell] || {};
      var v = self.value(ck.cell);
      if (v == null || v === "") { res.detail = ck.cell + " is empty."; return res; }
      if (v && v.err) { res.detail = ck.cell + " shows " + v.err; return res; }
      if (typeof v !== "number") { res.detail = ck.cell + " is text, not a number."; return res; }
      var tol = ck.tol != null ? ck.tol : 1;
      if (Math.abs(v - ck.expect) > tol) {
        res.detail = ck.cell + " = " + fmt.cell(v, cellDef.fmt) + " — not the expected value.";
        return res;
      }
      if ((ck.mustFormula || cellDef.mf) && !self.isFormula(ck.cell)) {
        res.detail = ck.cell + " has the right value, but type it as a formula (start with =) — that's the point of the exercise.";
        return res;
      }
      if (ck.mustUse) {
        var raw = self.raw(ck.cell).toUpperCase().replace(/\s/g, "");
        var pat = ck.mustUse instanceof RegExp ? ck.mustUse : new RegExp(ck.mustUse.toUpperCase().replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
        if (!pat.test(raw)) {
          res.detail = ck.cell + " works, but write it using " + (ck.mustUseLabel || ck.mustUse) + ".";
          return res;
        }
      }
      res.ok = true;
      return res;
    });
  };

  LS.Sheet = Sheet;
})();

</script>
<script>
/* js/lessons/company.js */
/* Bombay Bean Coffee Co. — the single source of truth.
   Every number in every lesson derives from this file, so the whole course
   stays mutually consistent: the P&L capstone's PAT (₹1,80,000), the cash
   flow capstone's closing cash (₹1,00,000) and the balance-sheet capstone's
   total (₹19,50,000) all come from here and tie by construction.

   Story: Priya opens a café in Mumbai on 1 April 2023 with ₹10,00,000 of her
   own capital and a ₹6,00,000 bank term loan at 10%. FY24 (year ended
   31 Mar 2024) is the founding year; FY25 is the year most lessons build.

   Conventions used (kept deliberately simple, and taught as such):
   - Straight-line depreciation, zero residual value, full year in the year
     of purchase (FY25 additions are bought on day one of FY25).
   - Interest = 10% x opening loan balance for the year.
   - Flat 25% tax on profit before tax.
   - The term loan is shown as one non-current borrowing (current maturities
     are not split out — flagged in lesson 1220).                            */
(function () {
  "use strict";
  var LS = (window.LS = window.LS || {});
  var C = {};

  C.name = "Bombay Bean Coffee Co.";
  C.taxRate = 0.25;      // flat
  C.loanRate = 0.10;     // interest on opening balance

  /* ---------- fixed asset register ---------- */
  C.assets = [
    { name: "Café fit-out & furniture", cost: 600000, life: 10, bought: "FY24" },
    { name: "Espresso machine & kitchen", cost: 600000, life: 10, bought: "FY24" },
    { name: "Delivery van", cost: 400000, life: 5, bought: "FY24" },
    { name: "Second machine & scooter", cost: 240000, life: 6, bought: "FY25" }
  ];
  C.van = { cost: 400000, life: 5, dep: 80000 }; // the van schedule, reused across lessons

  /* ---------- FY24 (founding year, ended 31 Mar 2024) ---------- */
  C.fy24 = {
    pl: {
      revenue: 2000000, cogs: 700000, grossProfit: 1300000,
      rent: 360000, salaries: 440000, utilities: 60000, marketing: 20000,
      opex: 880000, ebitda: 420000, dep: 200000, ebit: 220000,
      interest: 60000, pbt: 160000, tax: 40000, pat: 120000
    },
    bs: {
      ppeGross: 1600000, accDep: 200000, ppeNet: 1400000,
      deposit: 100000, inventory: 120000, receivables: 160000, cash: 60000,
      totalAssets: 1840000,
      capital: 1000000, retained: 120000, loan: 600000,
      payables: 100000, accrued: 20000,
      totalLE: 1840000
    },
    cf: { // founding year, opening balances all zero
      pat: 120000, dep: 200000, dAR: -160000, dInv: -120000, dAP: 100000, dAccr: 20000,
      cfo: 160000, capex: -1600000, deposit: -100000, cfi: -1700000,
      capital: 1000000, loanDrawn: 600000, cff: 1600000,
      net: 60000, openingCash: 0, closingCash: 60000
    },
    dividend: 0
  };

  /* ---------- FY25 (the year the course builds, ended 31 Mar 2025) ---------- */
  C.fy25 = {
    pl: {
      revenue: 2400000, cogs: 840000, grossProfit: 1560000,
      rent: 360000, salaries: 540000, utilities: 80000, marketing: 40000,
      opex: 1020000, ebitda: 540000, dep: 240000, ebit: 300000,
      interest: 60000, pbt: 240000, tax: 60000, pat: 180000
    },
    bs: {
      ppeGross: 1840000, accDep: 440000, ppeNet: 1400000,
      deposit: 100000, inventory: 150000, receivables: 200000, cash: 100000,
      totalAssets: 1950000,
      capital: 1000000, retained: 250000, loan: 550000,
      payables: 120000, accrued: 30000,
      totalLE: 1950000
    },
    cf: {
      pat: 180000, dep: 240000, dAR: -40000, dInv: -30000, dAP: 20000, dAccr: 10000,
      cfo: 380000, capex: -240000, cfi: -240000,
      loanRepaid: -50000, dividend: -50000, cff: -100000,
      net: 40000, openingCash: 60000, closingCash: 100000
    },
    dividend: 50000
  };

  /* ---------- projection drivers (taught in 2210) ---------- */
  C.drivers = {
    growth: 0.15,        // revenue growth per projected year
    gm: 0.65,            // gross margin held flat
    opexGrowth: 0.10,    // operating cost inflation
    dep: 240000,         // steady state: depreciation ...
    capex: 240000,       // ... equals replacement capex
    repay: 50000,        // loan principal repaid each year
    dividendPerYear: 50000,
    arPctRevenue: C.fy25.bs.receivables / C.fy25.pl.revenue,   // ~8.33%
    invPctCogs: C.fy25.bs.inventory / C.fy25.pl.cogs,          // ~17.86%
    apPctCogs: C.fy25.bs.payables / C.fy25.pl.cogs             // ~14.29%
  };

  /* ---------- FY26–FY28 projections, computed (never hand-typed) ---------- */
  function projectYear(prev, prevBS) {
    var d = C.drivers;
    var pl = {};
    pl.revenue = prev.pl.revenue * (1 + d.growth);
    pl.cogs = pl.revenue * (1 - d.gm);
    pl.grossProfit = pl.revenue - pl.cogs;
    pl.opex = prev.pl.opex * (1 + d.opexGrowth);
    pl.ebitda = pl.grossProfit - pl.opex;
    pl.dep = d.dep;
    pl.ebit = pl.ebitda - pl.dep;
    pl.interest = C.loanRate * prevBS.loan;
    pl.pbt = pl.ebit - pl.interest;
    pl.tax = pl.pbt * C.taxRate;
    pl.pat = pl.pbt - pl.tax;

    var bs = {};
    bs.ppeNet = prevBS.ppeNet + d.capex - pl.dep;
    bs.deposit = prevBS.deposit;
    bs.receivables = pl.revenue * d.arPctRevenue;
    bs.inventory = pl.cogs * d.invPctCogs;
    bs.payables = pl.cogs * d.apPctCogs;
    bs.accrued = prevBS.accrued;
    bs.capital = prevBS.capital;
    bs.retained = prevBS.retained + pl.pat - d.dividendPerYear;
    bs.loan = prevBS.loan - d.repay;

    var cf = {};
    cf.pat = pl.pat; cf.dep = pl.dep;
    cf.dAR = -(bs.receivables - prevBS.receivables);
    cf.dInv = -(bs.inventory - prevBS.inventory);
    cf.dAP = bs.payables - prevBS.payables;
    cf.dAccr = bs.accrued - prevBS.accrued;
    cf.cfo = cf.pat + cf.dep + cf.dAR + cf.dInv + cf.dAP + cf.dAccr;
    cf.capex = -d.capex; cf.cfi = cf.capex;
    cf.loanRepaid = -d.repay; cf.dividend = -d.dividendPerYear;
    cf.cff = cf.loanRepaid + cf.dividend;
    cf.net = cf.cfo + cf.cfi + cf.cff;
    cf.openingCash = prevBS.cash;
    cf.closingCash = cf.openingCash + cf.net;

    bs.cash = cf.closingCash;
    bs.totalAssets = bs.ppeNet + bs.deposit + bs.inventory + bs.receivables + bs.cash;
    bs.totalLE = bs.capital + bs.retained + bs.loan + bs.payables + bs.accrued;

    // FCFF = EBIT x (1 - tax) + dep - capex - increase in working capital
    var dNWC = -(cf.dAR + cf.dInv + cf.dAP + cf.dAccr);
    var fcff = pl.ebit * (1 - C.taxRate) + pl.dep - d.capex - dNWC;

    return { pl: pl, bs: bs, cf: cf, dNWC: dNWC, fcff: fcff };
  }

  C.fy26 = projectYear(C.fy25, C.fy25.bs);
  C.fy27 = projectYear(C.fy26, C.fy26.bs);
  C.fy28 = projectYear(C.fy27, C.fy27.bs);

  /* ---------- DCF (taught in 2240/2250) ---------- */
  function dcf(wacc, tg) {
    var f = [C.fy26.fcff, C.fy27.fcff, C.fy28.fcff];
    var pv = f.map(function (x, i) { return x / Math.pow(1 + wacc, i + 1); });
    var tv = f[2] * (1 + tg) / (wacc - tg);              // Gordon growth off FY28
    var pvTV = tv / Math.pow(1 + wacc, 3);
    var ev = pv[0] + pv[1] + pv[2] + pvTV;
    var netDebt = C.fy25.bs.loan - C.fy25.bs.cash;       // at the valuation date (31 Mar 2025)
    return { wacc: wacc, tg: tg, fcff: f, pv: pv, tv: tv, pvTV: pvTV, ev: ev, netDebt: netDebt, equity: ev - netDebt };
  }
  C.dcfBase = dcf(0.12, 0.04);
  C.dcfBear = dcf(0.13, 0.03);   // the "cautious" hardwired scenario
  C.dcfFn = dcf;

  /* ---------- ratios, FY25 (and FY24 where comparisons need them) ---------- */
  C.ratios = {
    gmPct: C.fy25.pl.grossProfit / C.fy25.pl.revenue,               // 65%
    ebitdaPct: C.fy25.pl.ebitda / C.fy25.pl.revenue,                // 22.5%
    patPct: C.fy25.pl.pat / C.fy25.pl.revenue,                      // 7.5%
    currentAssets: C.fy25.bs.inventory + C.fy25.bs.receivables + C.fy25.bs.cash, // 4,50,000
    currentLiabs: C.fy25.bs.payables + C.fy25.bs.accrued,           // 1,50,000
    current: 3.0, quick: 2.0,
    de: C.fy25.bs.loan / (C.fy25.bs.capital + C.fy25.bs.retained),  // 0.44
    intCover: C.fy25.pl.ebit / C.fy25.pl.interest,                  // 5.0
    equity: C.fy25.bs.capital + C.fy25.bs.retained,                 // 12,50,000
    roe: C.fy25.pl.pat / 1250000,                                   // 14.4%
    capEmployed: 1250000 + C.fy25.bs.loan,                          // 18,00,000
    roce: C.fy25.pl.ebit / 1800000,                                 // 16.67%
    dso: C.fy25.bs.receivables / C.fy25.pl.revenue * 365,           // ~30.4 days
    dio: C.fy25.bs.inventory / C.fy25.pl.cogs * 365,                // ~65.2 days
    dpo: C.fy25.bs.payables / C.fy25.pl.cogs * 365                  // ~52.1 days
  };

  /* ---------- self-audit, run by tests/engine.test.html ---------- */
  C.verify = function () {
    var out = [];
    function ok(name, cond) { out.push({ name: name, ok: !!cond }); }
    function near(a, b) { return Math.abs(a - b) < 0.01; }
    [C.fy24, C.fy25].forEach(function (y, i) {
      var n = i === 0 ? "FY24" : "FY25", p = y.pl, b = y.bs, c = y.cf;
      ok(n + " P&L: GP = revenue - COGS", p.grossProfit === p.revenue - p.cogs);
      ok(n + " P&L: opex adds up", p.opex === p.rent + p.salaries + p.utilities + p.marketing);
      ok(n + " P&L: EBITDA = GP - opex", p.ebitda === p.grossProfit - p.opex);
      ok(n + " P&L chain to PAT", p.pat === p.ebitda - p.dep - p.interest - p.tax);
      ok(n + " tax is 25% of PBT", p.tax === p.pbt * C.taxRate);
      ok(n + " BS assets add up", b.totalAssets === b.ppeNet + b.deposit + b.inventory + b.receivables + b.cash);
      ok(n + " BS L+E adds up", b.totalLE === b.capital + b.retained + b.loan + b.payables + b.accrued);
      ok(n + " BS ties", b.totalAssets === b.totalLE);
      ok(n + " PP&E net = gross - acc dep", b.ppeNet === b.ppeGross - b.accDep);
      ok(n + " CFO adds up", c.cfo === c.pat + c.dep + c.dAR + c.dInv + c.dAP + c.dAccr);
      ok(n + " cash closes", c.closingCash === c.openingCash + c.cfo + c.cfi + c.cff);
      ok(n + " CF closing cash = BS cash", c.closingCash === b.cash);
    });
    ok("FY25 RE rollforward", C.fy25.bs.retained === C.fy24.bs.retained + C.fy25.pl.pat - C.fy25.dividend);
    ok("FY25 PP&E rollforward", C.fy25.bs.ppeNet === C.fy24.bs.ppeNet + (-C.fy25.cf.capex) - C.fy25.pl.dep);
    ok("FY25 loan rollforward", C.fy25.bs.loan === C.fy24.bs.loan + C.fy25.cf.loanRepaid);
    ok("FY25 interest = 10% x opening loan", C.fy25.pl.interest === C.loanRate * C.fy24.bs.loan);
    ok("FY24 dep = register", C.fy24.pl.dep === 600000 / 10 + 600000 / 10 + 400000 / 5);
    ok("FY25 dep = register + addition", C.fy25.pl.dep === 200000 + 240000 / 6);
    ok("Capstone total is 19,50,000", C.fy25.bs.totalAssets === 1950000);
    ok("Capstone PAT is 1,80,000", C.fy25.pl.pat === 180000);
    ok("Capstone closing cash is 1,00,000", C.fy25.cf.closingCash === 100000);
    [C.fy26, C.fy27, C.fy28].forEach(function (y, i) {
      var n = "FY" + (26 + i);
      ok(n + " projected BS ties", near(y.bs.totalAssets, y.bs.totalLE));
      ok(n + " projected cash closes", near(y.cf.closingCash, y.cf.openingCash + y.cf.cfo + y.cf.cfi + y.cf.cff));
    });
    ok("Ratios: current ratio 3.0", near(C.ratios.currentAssets / C.ratios.currentLiabs, 3));
    ok("Ratios: interest cover 5.0", near(C.ratios.intCover, 5));
    ok("DCF: EV positive and equity < EV", C.dcfBase.ev > 0 && C.dcfBase.equity < C.dcfBase.ev);
    return out;
  };

  LS.C = C;
  LS.inr = LS.fmt ? LS.fmt.inr : function (v) { return "₹" + v; };
})();

</script>
<script>
/* js/lessons/m1000.js */
/* Module 1000 — Foundations */
(function () {
  "use strict";
  var LS = (window.LS = window.LS || {});
  LS.lessons = LS.lessons || {};
  var C = LS.C, R = LS.fmt.inr;

  LS.lessons["1010-five-buckets"] = {
    id: "1010-five-buckets", code: "1010", minutes: 4,
    title: "The five buckets every number falls into",
    short: "The five buckets",
    desc: "Assets, liabilities, equity, revenue and expenses — the five categories all of accounting sorts into, with a hands-on classification exercise.",
    lede: "Accounting looks huge. It isn't. Every number a business records lands in one of five buckets. Learn the buckets and the rest of this course is just plumbing between them.",
    body: [
      { t: "def", term: "Asset", h: "Something the business <strong>owns or controls</strong> that will bring future benefit — cash, an espresso machine, coffee beans, money customers owe you." },
      { t: "def", term: "Liability", h: "Something the business <strong>owes</strong> to outsiders — a bank loan, unpaid supplier bills, salaries not yet paid." },
      { t: "def", term: "Equity", h: "The <strong>owner's claim</strong> on the business: what would be left for the owner if you sold every asset and settled every liability. It grows when the business earns and keeps profit." },
      { t: "def", term: "Revenue & Expenses", h: "<strong>Revenue</strong> is what the business earns by selling; <strong>expenses</strong> are what it uses up to earn it. The difference — profit — flows into equity. They live on the income statement; the first three live on the balance sheet." },
      { t: "example", h: "<p>Priya opens <strong>Bombay Bean Coffee Co.</strong> in Mumbai on 1 April 2023. On day one she puts in " + R(1000000) + " of her own money and the bank lends the café " + R(600000) + ". The café buys an espresso machine, a delivery van and a sack of arabica. Every one of those facts is about to land in a bucket — and you'll follow this same café all the way to a full valuation model.</p>" },
      {
        t: "classify",
        tag: "Sort the café's world",
        intro: "Put each item in its bucket.",
        buckets: ["Asset", "Liability", "Equity", "Revenue", "Expense"],
        items: [
          { text: "The " + R(400000) + " delivery van", bucket: "Asset", why: "The café controls it and it delivers coffee (benefit) for years." },
          { text: "The " + R(600000) + " bank loan", bucket: "Liability", why: "Owed to an outsider — the bank — regardless of how business goes." },
          { text: "Priya's " + R(1000000) + " investment", bucket: "Equity", why: "The owner's claim. It is not owed back on a schedule like a loan — it's the residual.", whyNot: { "Liability": "Close — but the café doesn't owe Priya on fixed terms like the bank. An owner's stake is the residual claim: equity." } },
          { text: "₹180 collected for a flat white", bucket: "Revenue", why: "Earned by selling — this is the top of the income statement." },
          { text: "This month's " + R(30000) + " shop rent", bucket: "Expense", why: "Used up this month to earn revenue; nothing owned afterwards.", whyNot: { "Asset": "Rent buys the month that just passed — no future benefit remains, so nothing is owned. That makes it an expense, not an asset." } },
          { text: "Unpaid bill from the coffee-bean roaster", bucket: "Liability", why: "Beans received, money not yet paid — owed to a supplier. Accountants call it a trade payable." },
          { text: "Money a catering client owes the café", bucket: "Asset", why: "A right to receive cash — a trade receivable. Odd but true: other people's debts to you are your asset." }
        ]
      },
      { t: "where", h: "The first three buckets — assets, liabilities, equity — become the <strong>balance sheet</strong>. The last two — revenue and expenses — become the <strong>income statement</strong>, whose profit lands back in equity. Every statement in this course is one of those two lists, sorted." },
      { t: "mcq", q: "A customer pays the café ₹500 in advance for tomorrow's office coffee run. Right now, that ₹500 is best described as…", opts: ["Revenue — cash came in", "A liability — the café owes the customer coffee", "Equity — it belongs to the business", "An expense — the coffee will cost money to make"], correct: 1, why: ["Cash came in, but nothing has been <em>earned</em> yet — the coffee hasn't been delivered. Until it is, the café owes the customer either coffee or a refund. That obligation is a liability (called deferred revenue). Revenue is recognised when you deliver, not when cash arrives — a theme you'll meet again in lesson 1410.", "Cash went up (asset), and an obligation to deliver went up (liability). Accountants call it deferred or unearned revenue. When the coffee is delivered tomorrow, the liability disappears and revenue is finally recognised.", "Equity is the owner's residual claim, and nothing has been earned for the owner yet — there's an obligation outstanding first.", "Costs will come later, but the question is about the ₹500 received. Received-but-unearned money is an obligation: a liability."] }
    ]
  };

  LS.lessons["1020-accounting-equation"] = {
    id: "1020-accounting-equation", code: "1020", minutes: 4,
    title: "The accounting equation",
    short: "The accounting equation",
    desc: "Assets = Liabilities + Equity. Why it always holds, and your first live spreadsheet formula.",
    lede: "One equation runs all of accounting. Everything a business owns was paid for by someone — either outsiders (liabilities) or the owner (equity). There is no third source of money.",
    body: [
      { t: "formula", title: "The equation", lines: ["<b>Assets</b> = Liabilities + Equity", "…rearranged, the form you'll use most:", "<b>Equity</b> = Assets − Liabilities"], note: "Equity is a residual — it's whatever is left. That's why it's calculated, never counted." },
      { t: "p", h: "This isn't a rule someone imposed; it's arithmetic. Every rupee of stuff (left side) came from somewhere (right side). Later, the balance-sheet capstone will test your whole model against this equation with a live tie meter — if the two sides differ by even one rupee, something in your logic is wrong." },
      { t: "example", h: "<p>One year in — 31 March 2024 — the café owns assets worth " + R(C.fy24.bs.totalAssets) + " (machines, van, beans, cash, and money customers owe it). It owes outsiders " + R(C.fy24.bs.loan + C.fy24.bs.payables + C.fy24.bs.accrued) + " (the bank loan and unpaid bills). Priya's stake must be exactly the difference — no counting required.</p>" },
      {
        t: "sheet",
        sheet: {
          id: "s1",
          title: "Compute Priya's equity",
          hint: "Click the empty cell and type a formula, starting with = . Cell references work like Excel: B2 means column B, row 2.",
          grid: [
            ["", { v: "31 Mar 2024", year: true }],
            ["Everything the café owns (assets)", C.fy24.bs.totalAssets],
            ["Everything the café owes (liabilities)", C.fy24.bs.loan + C.fy24.bs.payables + C.fy24.bs.accrued],
            ["Priya's equity", { input: true, mf: true, fmt: "inr", ph: "=…" }]
          ],
          checks: [
            { cell: "B4", expect: 1120000, message: "B4: equity = assets − liabilities", mustFormula: true }
          ],
          success: "Equity is " + R(1120000) + " — and you never had to count it, because the equation does it for you."
        }
      },
      { t: "where", h: "This equation <em>is</em> the balance sheet: assets on one side, liabilities and equity on the other, always equal. You'll build the café's full balance sheet in lesson 1330." },
      { t: "mcq", q: "During FY25 the café's assets grow by ₹2,00,000 while its liabilities fall by ₹50,000. What happened to equity?", opts: ["Up ₹1,50,000", "Up ₹2,50,000", "Down ₹50,000", "Can't tell from this"], correct: 1, why: ["Careful with the sign on liabilities: they <em>fell</em>, which pushes equity up, not down. Equity = assets − liabilities = +2,00,000 − (−50,000) = +2,50,000.", "Equity = assets − liabilities, so ΔEquity = ΔAssets − ΔLiabilities = 2,00,000 − (−50,000) = ₹2,50,000. More stuff, fewer debts — both changes belong to the owner.", "Liabilities falling is good news for the owner — it can't push equity down.", "You can tell — that's the power of the equation. Equity is fully determined by the other two."] }

  LS.lessons["1030-two-sides"] = {

    body: [

        items: [

          { text: "Pay the first month's rent, " + R(30000), bucket: "Asset ↓ & Equity ↓", why: "Cash down, and nothing owned in exchange — the month has been consumed. That consumption is an expense, and expenses eat equity." }

      { t: "p", h: "Now watch the equation survive all four events at once. In the sheet below, each row shows the <em>change</em> each event causes to assets, liabilities and equity. Fill in the missing changes as plain numbers (negative numbers get a minus sign), then total each column with a formula." },

          ],
          checks: [

            { cell: "D5", expect: -30000, message: "D5: rent's effect on equity" },
            { cell: "B6", expect: 1570000, message: "B6: total asset change, using SUM", mustFormula: true, mustUse: "SUM", mustUseLabel: "the SUM function" },
            { cell: "C6", expect: 600000, message: "C6: total liability change, using SUM", mustFormula: true, mustUse: "SUM", mustUseLabel: "the SUM function" },

      { t: "where", h: "Each column total is a preview of a statement: asset and liability changes land on the <strong>balance sheet</strong>, and the equity change from trading (the rent) is what the <strong>income statement</strong> will explain, line by line." },
      { t: "mcq", q: "The café pays ₹50,000 of its bank loan back. What are the two sides?", opts: ["Asset ↓ and Expense ↑", "Asset ↓ and Liability ↓", "Liability ↓ and Equity ↓", "Asset ↓ and Equity ↓"], correct: 1, why: ["Repaying principal is not an expense — the café isn't consuming anything, it's settling a debt. (The <em>interest</em> on the loan is an expense; the principal is not. Lesson 1220 makes this precise.)", "Cash down, loan down, equation intact. Nothing was earned or consumed, so the income statement never hears about it — a distinction that matters enormously in the cash flow module.", "The bank's claim falls, but the owner's claim doesn't move — no value was created or consumed.", "Equity only moves when value is earned or consumed. Swapping cash to cancel a debt is neither."] }

  LS.lessons["1040-three-statements"] = {
    id: "1040-three-statements", code: "1040", minutes: 4,
    title: "The three statements, one story",
    short: "The three statements",
    desc: "Balance sheet, income statement, cash flow statement — what question each answers and how they interlock.",
    lede: "Companies tell their story in three documents. Each answers one question, and each hands a number to the next. By module 2100 you'll wire all three together; here's the map.",
    body: [
      { t: "def", term: "Balance sheet", h: "<strong>What does the business own and owe right now?</strong> A snapshot at one instant — assets on one side, liabilities and equity on the other, always equal. Dated \"as at 31 March 2025\"." },
      { t: "def", term: "Income statement (P&L)", h: "<strong>Did the business earn a profit this period?</strong> Revenue minus expenses over a stretch of time — \"for the year ended 31 March 2025\". Its bottom line, profit after tax, flows into equity on the balance sheet." },
      { t: "def", term: "Cash flow statement", h: "<strong>Where did the cash actually go?</strong> Profit is an opinion about value earned; cash is a fact. This statement reconciles the two, and its bottom line must equal the cash on the balance sheet." },
      {
        t: "svg",

          '<rect class="bx" x="10" y="30" width="180" height="90" rx="8"/><text class="hd" x="100" y="55" text-anchor="middle">Income statement</text><text class="tx" x="100" y="75" text-anchor="middle">Revenue − expenses</text><text class="tx" x="100" y="93" text-anchor="middle">= Profit after tax</text>' +
          '<rect class="bx" x="10" y="150" width="180" height="90" rx="8"/><text class="hd" x="100" y="175" text-anchor="middle">Cash flow statement</text><text class="tx" x="100" y="195" text-anchor="middle">Opening cash ± flows</text><text class="tx" x="100" y="213" text-anchor="middle">= Closing cash</text>' +
          '<rect class="bx" x="440" y="80" width="190" height="120" rx="8"/><text class="hd" x="535" y="105" text-anchor="middle">Balance sheet</text><text class="tx" x="535" y="127" text-anchor="middle">Assets (incl. cash)</text><text class="tx" x="535" y="145" text-anchor="middle">= Liabilities</text><text class="tx" x="535" y="163" text-anchor="middle">+ Equity (incl. retained</text><text class="tx" x="535" y="181" text-anchor="middle">earnings)</text>' +
          '<path class="ar" d="M195 75 C 320 75, 360 110, 435 118"/><text class="lb" x="300" y="66">PAT → retained earnings</text>' +
          '<path class="ar" d="M195 195 C 320 195, 360 145, 435 132"/><text class="lb" x="300" y="222">closing cash → cash</text></svg>',
        caption: "The two bridges you'll build by hand in module 2100 (plus a third, depreciation, that links the P&L to PP&E)."
      },
      { t: "example", h: "<p>For FY25, the café's income statement will show " + R(C.fy25.pl.pat) + " of profit after tax, its cash flow statement will end at " + R(C.fy25.cf.closingCash) + " of closing cash, and its balance sheet will carry both numbers — profit inside retained earnings, cash as the first asset a banker checks. Three statements, one café, zero contradictions.</p>" },
      {
        t: "classify",
        tag: "Which statement does it live on?",
        intro: "A line item walks into the room. Which statement is home?",
        buckets: ["Balance sheet", "Income statement", "Cash flow statement"],
        items: [
          { text: "The bank loan balance of " + R(C.fy25.bs.loan), bucket: "Balance sheet", why: "A thing owed at an instant — snapshot territory." },
          { text: "Baristas' salaries for the year", bucket: "Income statement", why: "An expense consumed over the period, matched against the revenue it helped earn." },
          { text: "Cash paid to buy the new espresso machine", bucket: "Cash flow statement", why: "A movement of cash (investing). The machine itself sits on the balance sheet; the P&L only sees it gradually, as depreciation.", whyNot: { "Income statement": "Buying a machine isn't an expense in the year of purchase — the café still owns the machine. The P&L feels it slowly as depreciation (lesson 1120); the cash leaving shows up here, on the cash flow statement." } },
          { text: "Coffee sales of " + R(C.fy25.pl.revenue), bucket: "Income statement", why: "Revenue earned over the year — the P&L's opening line." },
          { text: "Cash of " + R(C.fy25.bs.cash) + " on 31 March 2025", bucket: "Balance sheet", why: "A snapshot balance — and the number the cash flow statement must arrive at. Same rupees, two statements agreeing." }
        ]
      },
      { t: "where", h: "Each statement hands a number to the <strong>balance sheet</strong>: the income statement's profit after tax lands in retained earnings, and the cash flow statement's closing cash lands in cash. Those two crossings — plus depreciation — are the three bridges you'll wire together in module 2100." },
      { t: "mcq", q: "Why is the balance sheet dated \"as at\" a single day, while the other two say \"for the year ended\"?", opts: ["Tradition from paper ledgers", "The balance sheet is a snapshot of stocks; the other two measure flows over time", "Because the balance sheet is prepared last", "Auditors require it"], correct: 1, why: ["The phrasing is old, but it encodes something real about what's being measured.", "Assets and liabilities are <em>stocks</em> — amounts that exist at an instant, like water in a tank. Revenue, expenses and cash flows are <em>flows</em> — amounts per period, like water through a pipe. Mixing up stocks and flows is the single most common beginner error in modeling, so the statements label themselves clearly.", "Preparation order doesn't drive the dating — the nature of the measurement does.", "Auditors check the convention, but the reason is conceptual: stocks at an instant vs flows over a period."] }
    ]
  };

<script>

/* Module 1100 — Assets */
(function () {

  LS.lessons["1110-ppe"] = {
    id: "1110-ppe", code: "1110", minutes: 4,
    title: "Property, plant & equipment",
    short: "PP&E",
    desc: "Fixed assets and the capex-vs-expense test: when spending creates an asset and when it's just a cost.",
    lede: "Some spending vanishes into the month (rent). Some spending buys years of usefulness (an espresso machine). Accounting treats them completely differently, and the dividing line is the most useful test you'll learn this module.",
    body: [
      { t: "def", term: "Property, plant & equipment (PP&E)", h: "Long-lived physical assets a business uses to operate — machines, vehicles, furniture, shop fit-out. Bought once, used for years. Also called fixed assets or capital assets." },
      { t: "def", term: "Capital expenditure (capex)", h: "Spending that <strong>creates or improves</strong> a long-lived asset. It lands on the balance sheet as PP&E, not on the income statement as an expense. The test: <em>will this spending still be producing benefit beyond this year?</em>" },
      { t: "formula", title: "The capex test", lines: ["Benefit lasts beyond the year → <b>capitalise</b> (balance sheet, PP&E)", "Benefit consumed within the year → <b>expense</b> (income statement)"], note: "Repairs that merely maintain an asset are expenses. Improvements that extend its life or capacity are capex." },
      { t: "example", h: "<p>The café's opening shopping list, 1 April 2023:</p>" +
          '<div class="table-wrap"><table class="ls-table"><thead><tr><th>Asset</th><th class="num">Cost</th><th class="num">Useful life</th></tr></thead><tbody>' +
          "<tr><td>Café fit-out &amp; furniture</td><td class='num'>" + R(600000) + "</td><td class='num'>10 years</td></tr>" +
          "<tr><td>Espresso machine &amp; kitchen</td><td class='num'>" + R(600000) + "</td><td class='num'>10 years</td></tr>" +
          "<tr><td>Delivery van</td><td class='num'>" + R(400000) + "</td><td class='num'>5 years</td></tr>" +
          "</tbody></table></div><p>In FY25 the café adds a second machine and a scooter for " + R(240000) + " (6-year life). Keep this register in mind — it feeds the depreciation lesson next, and the balance sheet after that.</p>" },
      {
        t: "sheet",
        sheet: {
          id: "s1",
          title: "Total the opening gross block",
          hint: "\"Gross block\" is the total original cost of PP&E before any depreciation. Add the three day-one assets with a SUM over the range B2:B4.",

      { t: "mcq", q: "Which of these is capex for the café?", opts: ["Replacing the van's worn tyres", "Monthly deep-clean of the machine", "Buying the second espresso machine", "Baristas' training weekend"], correct: 2, why: ["Tyres keep the van doing what it already did — maintenance, an expense. If instead the café fitted a refrigeration unit that let the van deliver cold brew, that would extend capability: capex.", "Cleaning maintains the current asset. Expense.", "A new machine will produce lattes for six years — benefit far beyond this year, so its cost becomes an asset and reaches the P&L only slowly, as depreciation.", "Training has lasting benefit in a loose sense, but accounting is conservative: you can't own an employee's skills (they can resign). Staff costs are expensed."] }

  LS.lessons["1120-depreciation"] = {
    id: "1120-depreciation", code: "1120", minutes: 5,
    title: "Depreciation: the van schedule",
    short: "Depreciation",
    desc: "Straight-line depreciation with a hands-on 5-year schedule for the café's delivery van.",
    lede: "The van cost ₹4,00,000 but it won't die this year — it'll fade over five. Depreciation spreads the cost over the years that benefit, and it's the first expense you'll meet that consumes zero cash.",
    body: [
      { t: "def", term: "Depreciation", h: "Allocating the cost of a long-lived asset over its useful life, so each year's P&L carries a fair share of the asset it used up. It is an <strong>expense without a cash payment</strong> — the cash left when the asset was bought." },
      { t: "def", term: "Net book value (NBV)", h: "Cost minus accumulated depreciation — what remains on the balance sheet. Not the resale price; just the unallocated cost." },
      { t: "formula", title: "Straight-line depreciation", lines: ["Annual depreciation = (Cost − Residual value) ÷ Useful life", "Van: (" + R(400000) + " − 0) ÷ 5 = <b>" + R(80000) + " per year</b>"], note: "We assume zero residual (scrap) value throughout this course, and a full year's charge in the year of purchase — simple and common for small businesses." },
      { t: "example", h: "<p>The van, bought 1 April 2023 for " + R(400000) + ", life 5 years. Each year the P&L charges " + R(80000) + " and the van's book value steps down by the same amount, hitting zero at the end of FY28. This schedule reappears in lesson 1440 when you build the P&L, so build it well.</p>" },
      {
        t: "sheet",
        sheet: {
          id: "s1",
          title: "The van schedule, FY24–FY28",
          hint: "Straight-line depreciation is always the ORIGINAL cost ÷ life — never the opening book value ÷ life — which is why the charge is the same every year. Anchor the cost as $B$2 so it stays put as you work down the years. Closing = opening − depreciation, and next year's opening links to this year's closing (type =D2, not the number — links are the whole point). FY26–FY27 are done for you; finish FY28.",
          grid: [
            ["Year", "Opening value", "Depreciation", "Closing value"],
            ["FY24", 400000, { input: true, mf: true, fmt: "inr", ph: "=$B$2/5" }, { input: true, mf: true, fmt: "inr", ph: "=…" }],
            ["FY25", { input: true, mf: true, fmt: "inr", ph: "=D2" }, { input: true, mf: true, fmt: "inr" }, { input: true, mf: true, fmt: "inr" }],
            ["FY26", 240000, 80000, 160000],
            ["FY27", 160000, 80000, 80000],
            ["FY28", 80000, { input: true, mf: true, fmt: "inr" }, { input: true, mf: true, fmt: "inr", ph: "should hit 0" }]
          ],
          checks: [
            { cell: "C2", expect: 80000, message: "C2: FY24 depreciation — original cost ÷ 5", mustFormula: true },
            { cell: "D2", expect: 320000, message: "D2: FY24 closing = opening − depreciation", mustFormula: true },
            { cell: "B3", expect: 320000, message: "B3: FY25 opening links to FY24 closing (=D2)", mustFormula: true, mustUse: "D2", mustUseLabel: "a link to D2" },
            { cell: "C3", expect: 80000, message: "C3: FY25 depreciation — the same charge again, off the original cost", mustFormula: true },
            { cell: "D3", expect: 240000, message: "D3: FY25 closing", mustFormula: true },
            { cell: "C6", expect: 80000, message: "C6: FY28 depreciation", mustFormula: true },
            { cell: "D6", expect: 0, message: "D6: FY28 closing value — fully depreciated", mustFormula: true, tol: 0 }
          ],
          success: "The van glides from " + R(400000) + " to zero over five years, " + R(80000) + " at a time. That yearly " + R(80000) + " is a real expense on the P&L — but not one rupee of cash moves."
        }
      },
      { t: "where", h: "The annual charge is an <strong>expense on the income statement</strong> (lesson 1440). The running total — accumulated depreciation — is subtracted from PP&E's cost on the <strong>balance sheet</strong>, giving net book value. And because no cash moves, the <strong>cash flow statement</strong> adds it right back (lesson 1520)." },
      { t: "mcq", q: "Depreciation is best described as…", opts: ["Cash set aside each year to replace the van", "The fall in the van's market resale price", "This year's share of a cost paid long ago", "A tax trick to reduce profit"], correct: 2, why: ["Nothing is set aside — no cash moves at all. (Well-run businesses do plan for replacement capex, but that's a management decision, not what depreciation records.)", "Book value and market value drift apart immediately — a one-day-old van resells below cost but is barely depreciated. Accounting allocates cost; it doesn't appraise.", "Exactly. The cash left in year one; depreciation is the matching principle spreading that old cost across the five years the van actually serves. Expense recognition follows benefit, not cash.", "It does reduce taxable profit, and tax codes set their own allowed rates — but the concept exists to match cost to benefit, not to game tax."] }
    ]
  };

  LS.lessons["1130-inventory"] = {

    lede: "Beans in the storeroom aren't an expense — they're an asset waiting to become one. The moment they're brewed and sold, they turn into the P&L's biggest cost line: cost of goods sold.",
    body: [

      { t: "example", h: "<p>FY25: the café started with " + R(C.fy24.bs.inventory) + " of stock, ended with " + R(C.fy25.bs.inventory) + ", and consumed " + R(C.fy25.pl.cogs) + " of beans, milk and pastry making the year's coffee. How much did it buy from suppliers during the year? Don't guess — derive it.</p>" },

  LS.lessons["1140-receivables"] = {
    id: "1140-receivables", code: "1140", minutes: 4,
    title: "Trade receivables",
    short: "Receivables",
    desc: "Selling on credit: why revenue is recognized before cash arrives, and how to roll a receivables balance forward.",
    lede: "The café's catering clients don't pay at the till — they pay 30 days after the invoice. The sale is real today; the cash is real next month. Receivables are the gap, and that gap is an asset.",
    body: [

      { t: "mcq", q: "On 25 March the café delivers a ₹40,000 catering order, payable 30 April. In the FY25 statements (year ends 31 March), this order appears in…", opts: ["Revenue only", "Revenue and receivables", "Cash only", "Nowhere until the cash arrives"], correct: 1, why: ["Revenue, yes — but the unpaid ₹40,000 must sit somewhere on the balance sheet too. Every entry has two sides.", "Delivered before year-end → recognized in FY25 revenue. Unpaid at year-end → sitting in receivables on the 31 March balance sheet. When cash arrives in April, receivables fall and cash rises — FY26's cash flow, not FY26's revenue.", "No cash has moved by 31 March, so it can't be in cash.", "Accrual accounting recognizes what's <em>earned</em>, not what's collected — otherwise statements could be gamed by simply delaying invoices."] }

<script>

/* Module 1200 — Liabilities */
(function () {
  "use strict";
  var LS = (window.LS = window.LS || {});

  LS.lessons["1210-payables"] = {
    id: "1210-payables", code: "1210", minutes: 4,
    title: "Trade payables & accrued expenses",
    short: "Payables & accruals",
    desc: "Supplier credit and accrued expenses: liabilities that arise from operating, not borrowing.",

    body: [
      { t: "def", term: "Trade payables", h: "Amounts owed to suppliers for goods or services already received — the mirror image of trade receivables. Also called accounts payable or creditors. A <strong>current liability</strong>: typically due in 30–60 days." },
      { t: "def", term: "Accrued expenses", h: "Costs that <strong>belong to this period but haven't been billed or paid yet</strong> — March salaries paid on 5 April, or electricity used but not yet invoiced. The expense is recognized now; the cash goes later; the gap is a liability." },
      { t: "formula", title: "Same roll-forward, other side", lines: ["Closing payables = Opening + Credit purchases − Payments made"], note: "Identical mechanics to receivables in 1140 — every balance rolls forward as opening + in − out." },
      { t: "example", h: "<p>The café's roaster gives 45-day terms. At 31 March 2025 the café owes suppliers " + R(C.fy25.bs.payables) + ", and its baristas' March salaries of " + R(C.fy25.bs.accrued) + " will be paid on 5 April. Both amounts are FY25 costs on the P&L — but at year-end the cash hasn't left, so both sit on the balance sheet as current liabilities.</p>" },
      {
        t: "sheet",
        sheet: {

          grid: [
            ["", { v: "FY25", year: true }],
            ["Opening trade payables", C.fy24.bs.payables],
            ["Purchases on credit", 870000],
            ["Closing trade payables", C.fy25.bs.payables],
            ["Cash paid to suppliers", { input: true, mf: true, fmt: "inr", ph: "=…" }]
          ],
          checks: [
            { cell: "B5", expect: 850000, message: "B5: payments = opening + purchases − closing", mustFormula: true }
          ],
          success: "Paid " + R(850000) + " against " + R(870000) + " purchased. The unpaid " + R(20000) + " is cash the café got to keep a little longer — supplier credit is a quiet, interest-free loan."
        }
      },
      { t: "where", h: "Trade payables and accrued expenses sit under <strong>current liabilities on the balance sheet</strong>. The expenses they relate to are already on the <strong>income statement</strong>. The timing gap between the two is a working-capital delta the <strong>cash flow statement</strong> adjusts for in lesson 1520." },
      { t: "mcq", q: "The café receives ₹60,000 of beans on 45-day credit. The immediate effect is…", opts: ["Expense up ₹60,000, cash down ₹60,000", "Inventory up ₹60,000, payables up ₹60,000", "Inventory up ₹60,000, cash down ₹60,000", "Nothing is recorded until payment"], correct: 1, why: ["No cash has moved, and no expense exists yet — the beans are still an asset on the shelf.", "An asset arrives (inventory ↑) and an obligation arrives with it (payables ↑). The equation grows on both sides. No expense until the beans are consumed; no cash movement until day 45. Three different events, three different dates — accrual accounting keeps them straight.", "Cash is untouched for 45 days — that's the whole point of credit terms.", "Accounting records the obligation the moment goods change hands. Waiting for payment would let a business hide its debts."] }
    ]
  };

  LS.lessons["1220-borrowings"] = {
    id: "1220-borrowings", code: "1220", minutes: 4,
    title: "Borrowings & interest",
    short: "Borrowings",
    desc: "Term loans: principal vs interest, why only interest is an expense, and computing both from the loan balance.",
    lede: "The bank gave the café ₹6,00,000 and wants two different streams back: interest (the rent on money — an expense) and principal (the money itself — never an expense). Confusing the two is the classic beginner mistake.",
    body: [
      { t: "def", term: "Borrowings", h: "Money owed to lenders on fixed terms — amount, interest rate, repayment schedule. The café's term loan is <strong>non-current</strong> (repayable over years). A working-capital overdraft would be current." },
      { t: "def", term: "Interest vs principal", h: "<strong>Interest</strong> is the cost of using the bank's money for a year — an expense on the P&L. <strong>Principal repayment</strong> just returns the borrowed money — it shrinks the liability and the cash, and the P&L never sees it." },
      { t: "formula", title: "This course's simple interest convention", lines: ["Interest expense = Rate × Opening loan balance", "FY25: 10% × " + R(C.fy24.bs.loan) + " = <b>" + R(C.fy25.pl.interest) + "</b>"], note: "Real loans charge on the reducing monthly balance; annual-opening-balance is the standard simplification in teaching models and keeps every number in this course reproducible by hand." },
      { t: "example", h: "<p>The café borrowed " + R(600000) + " at 10% on day one. FY24 was interest-only; from FY25 it also repays " + R(50000) + " of principal each year. So FY25: interest of " + R(60000) + " (an expense), principal repayment of " + R(50000) + " (not an expense), closing balance " + R(C.fy25.bs.loan) + ".</p>" },

            { cell: "B6", expect: 550000, message: "B6: closing = opening − principal repaid", mustFormula: true }

          success: "Interest " + R(60000) + " to the P&L; balance steps down to " + R(550000) + ". Two payments to the same bank, two totally different accounting fates."
